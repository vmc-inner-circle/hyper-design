<!-- pattern: list-detail (모바일) — 목록과 자세히는 **화면 두 장**이다(.split 금지).
     목록 화면(탭 화면): 큰 제목 → 검색 → 칩·나눔 → 판 안 목록.  자세히 화면(아래 화면): 머리줄+제목 → 정보 판들 → 아래 꽉 찬 버튼.
     screens.json의 화면이 어느 쪽인지 보고 둘 중 하나만 쓴다. data-region key는 예시. -->

<!-- ===== 목록 화면 ===== -->
<main class="content">
  <x-page-header eyebrow="마포구 망원1동 근처" title="망원1동 스튜디오"></x-page-header>
  <x-card data-region="example-filter">
    <div class="search"><x-icon name="search"/><input class="input" type="search" placeholder="스튜디오 이름으로 찾기"></div>
    <div class="chip-group"><button class="chip active">기구 필라테스</button><button class="chip">매트</button><button class="chip">요가</button><button class="chip">1km 안</button></div>
    <div class="segmented w-full"><button class="segmented-item active">거리순</button><button class="segmented-item">리뷰 많은 순</button><button class="segmented-item">별점순</button></div>
  </x-card>
  <x-card flush data-region="example-list">
    <x-list>
      <x-item title="숨결필라테스 망원" sub="기구 필라테스 · 380m · 별점 4.8 (리뷰 126)" meta="25,000원~" data-trigger="example-open"><x-icon name="chevron-right" size="sm"/></x-item>
      <x-item title="오전의요가 망원" sub="요가 · 650m · 체험 가능" meta="20,000원~"><x-icon name="chevron-right" size="sm"/></x-item>
      <x-item title="매트앤코어 망원" sub="매트 필라테스 · 900m" meta="18,000원~"><x-icon name="chevron-right" size="sm"/></x-item>
    </x-list>
  </x-card>
</main>

<!-- ===== 자세히 화면 ===== -->
<main class="content">
  <x-page-header eyebrow="숨결필라테스 망원 · 기구 필라테스 · 중급" title="리포머 중급" desc="10월 20일(화) 20:00~20:50 · 50분" data-region="example-head"></x-page-header>
  <x-card data-region="example-seats"><x-badge tone="danger">마감 임박</x-badge><p class="fw-semibold">잔여 2석</p><p class="text-sm text-2">정원 6명 · 대기 0명</p></x-card>
  <x-section title="취소 규정" data-region="example-policy">
    <x-list plain><x-item icon="calendar-days" tone="primary" title="10월 19일(월) 20:00까지 무료 취소" sub="이후 취소하면 1회 차감 · 휴강되면 자동 취소되고 횟수가 돌아와요"/></x-list>
