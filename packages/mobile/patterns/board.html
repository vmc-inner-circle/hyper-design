<!-- pattern: board (모바일 = 날짜 띠 + 그날 목록) — 주간 시간표(.week-grid)·여러 열 대신.
     위: 나눔 버튼(장소·종류) → 판 안 날짜 띠(.day-strip) + 안내 한 줄 → 칩 필터 → 그날 수업 판(시간 · 이름 · 잔여).
     data-region key는 예시. -->
<main class="content">
  <div class="segmented w-full" data-region="example-switch"><button class="segmented-item active">숨결필라테스 망원</button><button class="segmented-item">고요가 합정</button></div>
  <x-card data-region="example-days">
    <div class="row-between"><x-btn variant="ghost" icon="chevron-left" aria-label="지난주"></x-btn><p class="fw-bold text-lg">10월 12일 ~ 18일</p><x-btn variant="ghost" icon="chevron-right" aria-label="다음 주"></x-btn></div>
    <div class="day-strip">
      <button class="day"><span class="day-name">월</span><span class="day-num">12</span></button>
      <button class="day"><span class="day-name">화</span><span class="day-num">13</span></button>
      <button class="day active"><span class="day-name">수</span><span class="day-num">14</span></button>
      <button class="day"><span class="day-name">목</span><span class="day-num">15</span></button>
      <button class="day"><span class="day-name">금</span><span class="day-num">16</span></button>
    </div>
    <p class="text-sm text-2">10월 26일 수업까지 예약할 수 있어요</p>
  </x-card>
  <x-section title="10월 14일(수) 수업 7개" data-region="example-classes">
    <x-list>
      <x-item title="07:00 모닝 매트" sub="정예린 · 입문 · 잔여 4/6 · 예약 가능" data-trigger="example-open"><x-icon name="chevron-right" size="sm"/></x-item>
      <x-item title="10:00 리포머 기초" sub="한소라 · 입문 · 잔여 0/6 · 대기 2명" badge="마감" badge-tone="danger"><x-icon name="chevron-right" size="sm"/></x-item>
      <x-item title="11:00 소도구 재활" sub="한소라 · 입문 · 잔여 3/6 · 예약 가능"><x-icon name="chevron-right" size="sm"/></x-item>
    </x-list>
  </x-section>
</main>
