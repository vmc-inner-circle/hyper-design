<style>
:root{

  --color-border:#E7E0D4;--color-accent:#F97316;--color-on-accent:#FFFFFF;--color-accent-soft:rgba(249,115,22,.1);
  --space-4:4px;--space-8:8px;--space-12:12px;--space-16:16px;--space-24:24px;--space-32:32px;--space-48:48px;
  --space-screen-padding:16px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-full:9999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);
  --font-family:"Pretendard",Roboto,sans-serif;
  --type-h3:17px;--type-h3-weight:600;--type-body:15px;--type-body-weight:400;
  --type-caption:12px;--type-caption-weight:400;--type-line-height:1.5;--type-line-height-title:1.3;
  --frame-w:390px;--frame-h:844px;--sa-top:44px;--sa-bottom:34px;--tap-min:44px;

  --web-body:18px;

<style data-chrome>
/* 페이지 크롬 (프레임 밖) — token.bound 면제 */
body{margin:0;background:#EEEEEE;font:14px/1.5 system-ui,sans-serif;padding:16px}
.sec{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:0 0 32px}
.sec>h2{flex-basis:100%;margin:0;font-size:16px}
</style>
<style>
.swatch{display:flex;gap:var(--space-8);padding:var(--space-8)}
.sw{width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-md);border:1px solid var(--color-border)}
.btn{height:var(--btn-lg-h);display:inline-flex;align-items:center;gap:var(--space-8);padding:0 var(--space-24);border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-on-accent)}

</style>
<section><h2>토큰</h2><div class="swatch"><span class="sw" style="background:var(--color-bg)"></span><span class="sw" style="background:var(--color-accent)"></span></div></section>
