name: "🔧 고친 점"
description: 결과물에서 고쳐야 했던 점을 남겨 주세요. 하네스가 처음부터 잘하도록 고치는 데 써요.
title: "[고친 점] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        ### 제출 전 꼭 확인해 주세요

        - 이 이슈는 **공개**돼요. 기획서(PRD) 원문, 사람·가게·회사 이름, 사내 정보는 넣지 말아 주세요.
        - 이름이 필요하면 민감하지 않은 예시 이름으로 바꿔도 돼요. 바꾼 이름 뒤엔 `[예시 이름]`을 붙여 주세요.
        - 한 이슈에는 한 가지만 적어 주세요.

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 어느 화면의 무엇이 어떻게 나왔나요? 한 줄에 한 문장씩 적어 주세요.
      placeholder: |
        큰 글자 홈 화면인데 확정·바뀜 배지 글자만 작게 나와요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 나와야 한다고 생각하셨나요?
      placeholder: |
        큰 글자 화면에선 배지 글자도 같이 커져야 해요.
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 어느 단계에서였나요?
      description: 잘 모르겠으면 "잘 모르겠음"을 골라 주세요.
      options:
        - "① 확인 질문"
        - "② 기다림(실행 시간)"
        - "③ 흐름(화면 사이 이동·빠진 화면)"
        - "④ 화면 디자인"
        - "⑤ 활용(캔버스·고치기·넘기기)"
        - 잘 모르겠음
    validations:
      required: false

  - type: textarea
    id: prd-example
    attributes:
      label: 입력한 PRD(예시)
      description: 이 화면을 다시 만들어 볼 수 있을 만큼만, 민감하지 않은 이름으로 2~4줄 적어 주세요. 원문은 넣지 않아요.
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: |
        1. 위 예시 PRD로 `/k-style-ui-ux:go` 실행
        2. 큰 글자 홈 화면의 배지 확인
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: 다른 화면에서도 같았나요?
      options:
        - 이 화면만
        - 여러 화면에서
        - 잘 모르겠음
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷
      description: 고치기 전(실제)과 고친 뒤(기대)를 같이 올려 주시면 좋아요. 화면에 실제 이름이 보이면 가리거나 지운 뒤 올려 주세요.
    validations:
      required: false

  - type: textarea
    id: cause
    attributes:
      label: 원인 추정
      description: 하네스의 어떤 규칙 때문인지 짐작이 가면 적어 주세요. 정확하지 않아도 괜찮아요.
    validations:
      required: false

  - type: dropdown
    id: agent
    attributes:
      label: 에이전트 종류
      options:
        - Claude Code
        - Codex
        - Cursor
        - 기타
    validations:
      required: true

  - type: input
    id: agent-version
    attributes:
      label: 에이전트 버전
      description: 예 `claude --version` 결과
      placeholder: "예: 2.1.316"
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: k-style-ui-ux 버전
      description: Claude Code에서 `/plugin` 목록을 열면 `k-style-ui-ux` 옆에 보이는 버전이에요.
      placeholder: "예: 0.19.1"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 모델
      placeholder: "예: Claude Opus 5.5"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 참고 정보
      description: 에이전트 세션 로그(관련 구간만), 기기 정보 등. 경로의 사용자 이름은 `~`로 바꿔 주세요.
    validations:
      required: false
