name: "👍 좋았던 점"
description: 결과물에서 좋았던 점을 남겨 주세요. 하네스가 앞으로도 지켜야 할 동작이 돼요.
title: "[좋았던 점] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        ### 제출 전 꼭 확인해 주세요

        - 이 이슈는 **공개**돼요. 기획서(PRD) 원문, 사람·가게·회사 이름, 사내 정보는 넣지 말아 주세요.
        - 이름이 필요하면 민감하지 않은 예시 이름으로 바꿔도 돼요. 바꾼 이름 뒤엔 `[예시 이름]`을 붙여 주세요.
        - 한 이슈에는 한 가지만 적어 주세요.

  - type: textarea
    id: confirmed
    attributes:
      label: 확인한 동작
      description: 어느 화면의 무엇이 어떻게 나왔나요? 한 줄에 한 문장씩 적어 주세요.
      placeholder: |
        홈 첫 화면 맨 위에 "50일 남았어요"가 가장 크게 나와요.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 어떤 점이 좋았나요?
      description: 한 마디여도 괜찮아요. 평가("좋아요")보다 장면을 적어 주시면 하네스가 무엇을 지켜야 할지 알 수 있어요. 예 — 한눈에 들어와요 · 말투가 따뜻해요 · 누를 곳이 하나라 헷갈리지 않아요
      placeholder: |
        부모님이 묻지 않아도 언제 떠나는지 바로 알 수 있어요.
    validations:
      required: true

  - type: textarea
    id: keep
    attributes:
      label: 유지되어야 할 동작
      description: 앞으로 버전이 바뀌어도 이렇게 나와야 하는 것을 적어 주세요.
      placeholder: |
        여는 사람이 가장 궁금한 것이 첫 화면 맨 위에 가장 크게 나와요.
    validations:
      required: false

  - type: dropdown
    id: stage
    attributes:
      label: 어느 단계에서였나요?
      description: 잘 모르겠으면 "잘 모르겠음"을 골라 주세요.
      options:
        - "① 확인 질문"
        - "② 기다림(실행 시간)"
        - "③ 흐름(화면 사이 이동·빠진 화면)"
        - "④ 화면 디자인"
        - "⑤ 활용(캔버스·고치기·넘기기)"
        - 잘 모르겠음
    validations:
      required: false

  - type: textarea
    id: prd-example
    attributes:
      label: 입력한 PRD(예시)
      description: 이 화면을 다시 만들어 볼 수 있을 만큼만, 민감하지 않은 이름으로 2~4줄 적어 주세요. 원문은 넣지 않아요.
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: |
        1. 위 예시 PRD로 `/k-style-ui-ux:go` 실행
        2. 홈 첫 화면의 머리글 확인
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: 다른 화면에서도 같았나요?
      options:
        - 이 화면만
        - 여러 화면에서
        - 잘 모르겠음
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷
      description: 화면에 실제 이름이 보이면 가리거나 지운 뒤 올려 주세요.
    validations:
      required: false

  - type: textarea
    id: cause
    attributes:
      label: 원인 추정
      description: 하네스의 어떤 규칙 덕분에 이렇게 나왔는지 짐작이 가면 적어 주세요. 정확하지 않아도 괜찮아요.
    validations:
      required: false

  - type: dropdown
    id: agent
    attributes:
      label: 에이전트 종류
      options:
        - Claude Code
        - Codex
        - Cursor
        - 기타
    validations:
      required: true

  - type: input
    id: agent-version
    attributes:
      label: 에이전트 버전
      description: 예 `claude --version` 결과
      placeholder: "예: 2.1.316"
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: k-style-ui-ux 버전
      description: Claude Code에서 `/plugin` 목록을 열면 `k-style-ui-ux` 옆에 보이는 버전이에요. 좋았던 점이 나중에 깨지면 이 버전이 기준이 돼요.
      placeholder: "예: 0.19.1"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 모델
      placeholder: "예: Claude Opus 5.5"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 참고 정보
      description: 에이전트 세션 로그(관련 구간만), 기기 정보 등. 경로의 사용자 이름은 `~`로 바꿔 주세요.
    validations:
      required: false
