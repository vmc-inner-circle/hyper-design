<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>약관 동의 · 기본 정보 · 이름 없음</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta text-large">
<header class="appbar"><a class="appbar-btn" href="phone-verify.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">약관 동의 · 기본 정보</h1><span></span></header>
<main class="page">
  <div class="progress" role="progressbar" aria-valuenow="2" aria-valuemax="3" aria-label="가입 3단계 중 2단계"><span class="is-on"></span><span class="is-on"></span><span></span></div>
  <section class="block is-list">
    <div class="row"><div class="row-main"><p class="row-title">전체 동의</p><p class="row-sub">선택 항목 포함</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="false" aria-label="전체 동의 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><div class="row-main"><p class="row-title">[필수] 이용약관</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="[필수] 이용약관 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><div class="row-main"><p class="row-title">[필수] 개인정보 수집·이용</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="[필수] 개인정보 수집·이용 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><div class="row-main"><p class="row-title">[필수] 만 14세 이상이에요</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="[필수] 만 14세 이상이에요 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><div class="row-main"><p class="row-title">[선택] 마케팅 수신</p><p class="row-sub">새 수업·할인 소식</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="false" aria-label="[선택] 마케팅 수신 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
  </section>
  <div class="field is-error"><label class="label" for="name">이름(실명)</label><input class="input" id="name" autocomplete="name" value="" placeholder="실명">
    <p class="field-msg" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5M12 16v.5"/></svg>출석부에 쓰일 이름을 적어 주세요</p></div>
  <div class="field"><label class="label" for="nick">닉네임</label><input class="input" id="nick" value="지현"></div>
  <div class="field"><span class="label">성별 (선택)</span>
    <div class="seg" role="radiogroup"><button class="seg-item" role="radio" aria-checked="false">여성</button><button class="seg-item" role="radio" aria-checked="false">남성</button><button class="seg-item" role="radio" aria-checked="false">밝히지 않음</button></div></div>
  <div class="field"><label class="label" for="birth">태어난 해 (선택)</label><input class="input" id="birth" inputmode="numeric" maxlength="4" placeholder="4자리 숫자"></div>
</main>
<div class="cta"><button class="btn primary full" disabled>다음</button></div>
</body></html>
