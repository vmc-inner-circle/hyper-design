<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>예약 확인</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="has-cta text-large">
<header class="appbar"><a class="appbar-btn" href="class.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">예약 확인</h1><span></span></header>
<main class="page">
  <section class="block is-list">
    <div class="row"><span class="row-date">10/20<br>화</span><div class="row-main"><p class="row-title">리포머 중급</p><p class="row-sub">20:00~20:50 · 오지훈 · 숨결필라테스 망원</p></div></div>
  </section>
  <section class="block">
    <div class="block-head"><h2 class="h2">사용 수강권</h2></div>
    <p class="info"><img src="../assets/fluent/ticket.svg" alt=""><span>숨결 20회권</span></p>
    <p class="title">예약 가능 <span class="num">5회 → 4회</span></p>
    <p class="block-note">예약 시 차감, 무료 취소 시 복원</p>
  </section>
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">취소 규정</h2></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/calendar.svg" alt=""></span><div class="row-main"><p class="row-title">10월 19일(월) 20:00까지 무료 취소</p><p class="row-sub">이후 취소하면 1회 차감돼요</p></div></div>
    <div class="row"><div class="row-main"><p class="row-title">취소 규정을 확인했어요</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="취소 규정 확인"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
  </section>
</main>
<div class="cta"><a class="btn primary full" href="book-done.html">예약 확정</a></div>
