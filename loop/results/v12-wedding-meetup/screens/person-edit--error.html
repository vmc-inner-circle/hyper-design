<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>지인 고치기 · 이름 빈칸</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="people.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">지인 고치기</h1><span></span></header>
<main class="page">
  <div class="field"><div class="row"><div class="row-main"><p class="row-title">따로 만나야 하는 분인가요?</p><p class="row-sub">켜 두면 모임 만들 때 1:1로 추천해요</p></div><button class="switch" role="switch" aria-checked="false" aria-label="따로 만나기"></button></div></div>
  <div class="field is-error"><label class="label" for="n">이름</label><input class="input" id="n" value="" placeholder="이름"><p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.5"/></svg>이름을 적어 주세요</p></div>
  <div class="field"><span class="label">쪽</span>
    <div class="seg" role="radiogroup"><button class="seg-item is-selected" role="radio" aria-checked="true">지은 쪽</button><button class="seg-item" role="radio" aria-checked="false">민수 쪽</button><button class="seg-item" role="radio" aria-checked="false">함께</button></div></div>
  <div class="field"><span class="label">무리</span>
    <div class="chips"><button class="chip is-selected">대학 동기</button><button class="chip is-selected">망원 동네</button><button class="chip">마케팅팀</button><button class="chip">개발팀</button><button class="chip">가족·친척</button><a class="chip" href="circle-edit.html">+ 새 무리</a></div></div>
  <div class="field"><label class="label" for="t">연락처</label><input class="input" id="t" type="tel" value="010-0000-0000"></div>
  <button class="btn secondary full">지우기</button>
</main>
<div class="cta"><button class="btn primary full">저장</button></div>
