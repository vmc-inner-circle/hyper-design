<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>새 모임 · 후보와 마감</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="meetup-new.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">후보와 마감</h1><span></span></header>
<main class="page">
  <p class="done">링크를 복사했어요 — 망원 동네 단톡방에 붙여넣으세요</p>
  <section class="block">
    <div class="field"><label class="label" for="nm">모임 이름</label><input class="input" id="nm" value="망원 동네 친구"></div>
    <div class="field"><span class="label">나가는 사람</span>
      <div class="seg" role="radiogroup"><button class="seg-item is-selected" role="radio" aria-checked="true">지은</button><button class="seg-item" role="radio" aria-checked="false">민수</button><button class="seg-item" role="radio" aria-checked="false">둘 다</button></div></div>
  </section>
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">후보 날짜</h2></div>
    <div class="row"><span class="row-date">10/11</span><div class="row-main"><span class="badge">후보</span><p class="row-title">10/11(일) 점심</p></div><span class="row-trail"><button class="btn small tint" aria-label="10/11 점심 후보 지우기">지우기</button></span></div>
    <div class="row"><span class="row-date">10/18</span><div class="row-main"><span class="badge">후보</span><p class="row-title">10/18(일) 저녁</p></div><span class="row-trail"><button class="btn small tint" aria-label="10/18 저녁 후보 지우기">지우기</button></span></div>
    <a class="row is-add" href="date-pick.html"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><div class="row-main"><p class="row-title">후보 더하기</p></div></a>
  </section>
  <section class="block">
    <div class="field"><label class="label" for="dl">회신 마감</label><input class="input" id="dl" value="10월 2일(금)"></div>
  </section>
  <section class="block"><a class="block-link" href="home.html">모임으로 돌아가기</a></section>
</main>
<div class="cta"><button class="btn secondary full">다시 복사</button></div>
