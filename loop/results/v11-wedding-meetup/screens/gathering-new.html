  <section class="block is-list">

    <div class="row"><div class="row-main"><p class="row-title">최수빈</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="최수빈 고르기"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>

    <div class="row"><div class="row-main"><p class="row-title">한소라</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="한소라 고르기"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><div class="row-main"><p class="row-title">오예진</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="오예진 고르기"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><div class="row-main"><p class="row-title">윤가람</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="윤가람 고르기"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>

    <div class="row"><div class="row-main"><p class="row-title">임나래</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="false" aria-label="임나래 고르기"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>

<div class="cta"><a class="btn primary full" href="gathering-dates.html">6명으로 묶기</a></div>
