<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>리뷰 작성</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>textarea.input { height: auto; padding: var(--stack-m); line-height: var(--lh-body); resize: none; }</style>
</head>
<body class="has-cta text-large">
<header class="appbar"><a class="appbar-btn" href="my-bookings-past.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">리뷰 작성</h1><span></span></header>
<main class="page">
  <section class="block is-list">
    <div class="row"><span class="avatar is-text">정</span><div class="row-main"><span class="badge is-success">출석</span><p class="row-title">리포머 중급 · 정다은</p><p class="row-sub">10월 6일(화) 20:00 · 숨 필라테스 망원점</p></div></div>
  </section>
  <section class="block">
    <div class="block-head"><h2 class="h2">별점</h2></div>
    <div class="rating is-input" role="radiogroup" aria-label="별점 주기"><button class="is-on" role="radio" aria-checked="false" aria-label="1점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="2점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="3점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="4점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="true" aria-label="5점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button></div>
    <p class="block-note"><span class="num">5점</span>을 골랐어요</p>
  </section>
  <section class="block">
    <div class="block-head"><h2 class="h2">좋았던 점</h2></div>
    <div class="chips">
      <button class="chip" aria-pressed="false">친절해요</button>
      <button class="chip is-selected" aria-pressed="true">자세 교정 꼼꼼</button>
      <button class="chip" aria-pressed="false">시설 깨끗</button>
      <button class="chip is-selected" aria-pressed="true">강도 적당</button>
      <button class="chip" aria-pressed="false">주차 편함</button>
    </div>
    <p class="block-note">여러 개 골라도 돼요</p>
  </section>
  <section class="block">
    <div class="field"><label class="label" for="body">후기</label><textarea class="input" id="body" rows="4" maxlength="500">코어가 약하다고 하니 손으로 위치를 잡아 주셨어요. 50분이 금방 가요.</textarea></div>
    <p class="block-note"><span class="num">40</span> / 500자 · 10자 이상 · 욕설은 등록되지 않아요</p>
    <p class="block-note">닉네임 ‘퇴근후필라’로 보여요 · 사진은 아직 받지 않아요</p>
  </section>
  <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>10월 20일(화)까지 쓸 수 있어요 · 수업 1회에 리뷰 1개</span></p>
</main>
<div class="cta"><a class="btn primary full" href="review-done.html">리뷰 등록하기</a></div>
</body></html>
