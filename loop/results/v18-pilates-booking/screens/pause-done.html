<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">

<body class="text-large has-cta">
<main class="page">
  <header class="hero">
    <p class="eyebrow">바른몸 재활필라테스 · 3개월 기간권(주 3회)</p>
    <h1 class="title">일시정지했어요</h1>
    <p class="lead">10월 26일(월) ~ 11월 8일(일) · 14일</p>

  <section class="block is-list">

  </section>
  <section class="block is-list">
    <a class="row" href="ticket-detail.html"><span class="row-art"><img src="../assets/fluent/idcard.svg" alt=""></span><div class="row-main"><p class="row-title">일찍 돌아오면 조기 해제</p><p class="row-sub">수강권 상세에서 · 실제 쉰 날만 차감돼요</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></a>
