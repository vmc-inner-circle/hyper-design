<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>대기 신청</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="text-large has-cta">
<header class="appbar"><a class="appbar-btn" href="class.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">대기 신청</h1><span></span></header>
<main class="page">
  <section class="block">
    <div class="photo is-16x9"><img src="../assets/photos/class-reformer.jpg" alt="숨 필라테스 그룹 수업 모습"></div>
    <div class="block-head"><h2 class="h2">체어 필라테스</h2></div>
    <p class="row-sub">10월 18일(일) 10:00–10:50 · 오민재 · 숨 필라테스 망원점</p>
    <p class="row-sub">정원 6명 · 마감</p>
  </section>

  <section class="block">
    <div class="field"><span class="label">대기 인원</span>
      <p class="title">내 순번 <span class="num">2번</span></p>
      <p class="block-note">지금 대기 1명 · 최대 5명까지 기다릴 수 있어요</p>
    </div>
  </section>

  <section class="block">
    <div class="block-head"><h2 class="h2">자리가 나면</h2></div>
    <p class="info"><img src="../assets/fluent/phone.svg" alt=""><span>대기 순서대로 알림을 보내요</span></p>
    <p class="info"><img src="../assets/fluent/clipboard.svg" alt=""><span>알림 받고 2시간 안에 확정하면 예약돼요</span></p>
    <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>시작 3시간 전까지 자리가 안 나면 대기가 자동으로 풀려요</span></p>
  </section>

  <section class="block is-list">
    <div class="row"><span class="row-art"><img src="../assets/fluent/ticket.svg" alt=""></span>
      <div class="row-main"><p class="row-title">숨 20회권 · 사용 가능 5회</p><p class="row-sub">지금은 차감 없음 · 확정할 때 1회 차감</p></div></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/calendar.svg" alt=""></span>
      <div class="row-main"><p class="row-title">겹치는 예약 없음</p><p class="row-sub">겹치는 수업이 있으면 여기서 미리 알려 드려요</p></div></div>
  </section>
</main>
<div class="cta"><a class="btn primary full" href="waitlist--done.html">대기 신청</a></div>
</body></html>
