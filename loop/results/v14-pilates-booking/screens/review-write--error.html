<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>리뷰 쓰기 · 글자 수 부족</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="text-large plain has-cta">
<header class="appbar"><a class="appbar-btn" href="my-bookings-past.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">리뷰 쓰기</h1><span></span></header>
<main class="page">
  <section class="block is-list">
    <div class="row"><span class="thumb"><img src="../assets/photos/teacher-han.jpg" alt="한소율 강사"></span>
      <div class="row-main"><span class="badge is-success">출석</span><p class="row-title">기구 필라테스 중급</p><p class="row-sub">10월 12일(월) 20:00 · 한소율 · 숨 필라테스 망원점</p></div></div>
  </section>
  <div class="field"><span class="label">수업은 어땠나요?</span>
    <div class="rating is-input" role="radiogroup" aria-label="별점"><button class="is-on" role="radio" aria-checked="false" aria-label="1점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="2점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="3점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="4점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button><button class="is-on" role="radio" aria-checked="true" aria-label="5점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button></div>
  </div>
  <div class="field"><span class="label">좋았던 점 · 여러 개 골라도 돼요</span>
    <div class="chips"><button class="chip is-selected" aria-pressed="true">자세 교정 꼼꼼</button><button class="chip is-selected" aria-pressed="true">강도 적당</button><button class="chip" aria-pressed="false">친절해요</button><button class="chip" aria-pressed="false">시설 깨끗</button><button class="chip" aria-pressed="false">주차 편함</button></div>
  </div>
  <div class="field is-error"><label class="label" for="body">후기</label><textarea class="input" id="body" maxlength="500">좋았어요 강추</textarea><p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5M12 16v.5"/></svg>10자 이상 써 주세요 · 지금 7자</p></div>
  <p class="block-note">닉네임 '저녁필라'로 올라가요. 10월 26일까지 쓸 수 있고, 올린 뒤에도 고치거나 지울 수 있어요</p>
</main>
<div class="cta"><button class="btn primary full">리뷰 올리기</button></div>
</body></html>
