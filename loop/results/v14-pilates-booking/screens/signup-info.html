<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>약관 동의 · 기본 정보</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="text-large plain has-cta">
<header class="appbar"><a class="appbar-btn" href="phone.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">가입하기</h1><span></span></header>
<main class="page">
  <div class="progress" role="progressbar" aria-valuenow="2" aria-valuemax="3"><span class="is-on"></span><span class="is-on"></span><span></span></div>
  <section class="field" aria-label="약관 동의">
    <h2 class="h2">약관 동의</h2>
    <div class="row"><div class="row-main"><p class="row-title">전체 동의</p><p class="row-sub">선택 항목까지 모두 동의해요</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="false" aria-label="전체 동의 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/clipboard.svg" alt=""></span><div class="row-main"><p class="row-title">이용약관</p><p class="row-sub">필수</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="이용약관 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/eyes.svg" alt=""></span><div class="row-main"><p class="row-title">개인정보 수집·이용</p><p class="row-sub">필수</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="개인정보 수집·이용 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/idcard.svg" alt=""></span><div class="row-main"><p class="row-title">만 14세 이상이에요</p><p class="row-sub">필수</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="만 14세 이상이에요 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/invite.svg" alt=""></span><div class="row-main"><p class="row-title">마케팅 정보 받기</p><p class="row-sub">선택 · 체험·이벤트 소식</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="false" aria-label="마케팅 정보 받기 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></span></button></span></div>
  </section>
  <h2 class="h2">기본 정보</h2>
  <div class="field"><label class="label" for="name">이름</label><input class="input" id="name" value="김지현" autocomplete="name"><p class="block-note">이름은 출석부용이라 스튜디오 운영자에게만 보여요. 리뷰에는 닉네임이 나가요.</p></div>
  <div class="field"><label class="label" for="nick">닉네임</label><input class="input" id="nick" value="저녁필라"></div>
  <div class="field"><span class="label">성별 (선택)</span>
    <div class="seg" role="radiogroup"><button class="seg-item" role="radio" aria-checked="false">여성</button><button class="seg-item" role="radio" aria-checked="false">남성</button><button class="seg-item" role="radio" aria-checked="false">밝히지 않음</button></div>
  </div>
  <div class="field"><label class="label" for="birth">태어난 해 (선택)</label><input class="input" id="birth" inputmode="numeric" placeholder="예: 4자리 숫자"></div>
</main>
<div class="cta"><a class="btn primary full" href="neighborhood.html">다음</a></div>
</body></html>
