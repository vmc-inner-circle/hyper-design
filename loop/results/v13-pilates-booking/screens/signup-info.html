<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>약관 동의 · 기본 정보</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="phone-verify.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">가입 정보</h1><span></span></header>
<main class="page">
  <div class="field"><label class="label" for="name">이름(실명)</label><input class="input" id="name" value="박서연"></div>
  <p class="block-note">이름은 스튜디오 출석부에만 쓰여요. 리뷰에는 닉네임만 보여요.</p>
  <div class="field"><label class="label" for="nick">닉네임</label><input class="input" id="nick" value="서연맘"></div>
  <div class="field"><span class="label">성별 (선택)</span>
    <div class="seg" role="radiogroup"><button class="seg-item is-selected" role="radio" aria-checked="true">여성</button><button class="seg-item" role="radio" aria-checked="false">남성</button><button class="seg-item" role="radio" aria-checked="false">선택 안 함</button></div>
  </div>
  <div class="field"><label class="label" for="birth">출생 연도 (선택)</label><input class="input" id="birth" inputmode="numeric" value="1988"></div>
  <div class="field"><span class="label">약관 동의</span>
    <section class="block is-list">
      <div class="row"><span class="row-art"><img src="../assets/fluent/clipboard.svg" alt=""></span><div class="row-main"><p class="row-title">전체 동의</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="전체 동의 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="row-art"><img src="../assets/fluent/clipboard.svg" alt=""></span><div class="row-main"><p class="row-title">[필수] 이용약관</p></div><span class="row-trail"><a class="block-link" href="settings.html">약관 보기</a><button class="check" role="checkbox" aria-checked="true" aria-label="[필수] 이용약관 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="row-art"><img src="../assets/fluent/idcard.svg" alt=""></span><div class="row-main"><p class="row-title">[필수] 개인정보 수집·이용</p></div><span class="row-trail"><a class="block-link" href="settings.html">약관 보기</a><button class="check" role="checkbox" aria-checked="true" aria-label="[필수] 개인정보 수집·이용 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="row-art"><img src="../assets/fluent/idcard.svg" alt=""></span><div class="row-main"><p class="row-title">[필수] 만 14세 이상이에요</p></div><span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="[필수] 만 14세 이상이에요 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="row-art"><img src="../assets/fluent/phone.svg" alt=""></span><div class="row-main"><p class="row-title">[선택] 마케팅 수신</p></div><span class="row-trail"><a class="block-link" href="settings.html">약관 보기</a><button class="check" role="checkbox" aria-checked="false" aria-label="[선택] 마케팅 수신 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    </section>
    
  </div>
</main>
<div class="cta"><a class="btn primary full" href="neighborhood.html">다음</a></div>
</body></html>
