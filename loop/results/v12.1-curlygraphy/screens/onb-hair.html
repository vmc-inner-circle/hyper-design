<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>내 모발 상태</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="onb-name.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><span></span></header>
<main class="page">
  <header class="hero">
    <h1 class="title">몽글이의 지금 모발 상태예요</h1>
  </header>
  <section class="block">
    <div class="h2">모발 상태</div>
    <div class="field"><span class="label">곱슬 타입 (범위로 골라요)</span><div class="chips" role="group" aria-label="곱슬 타입"><button class="chip" aria-pressed="false">2A</button><button class="chip" aria-pressed="false">2B</button><button class="chip is-selected" aria-pressed="true">2C</button><button class="chip is-selected" aria-pressed="true">3A</button><button class="chip" aria-pressed="false">3B</button><button class="chip" aria-pressed="false">3C</button><button class="chip" aria-pressed="false">4A</button><button class="chip" aria-pressed="false">4B</button><button class="chip" aria-pressed="false">4C</button><button class="chip" aria-pressed="false">모름</button></div></div>
    <div class="field"><span class="label">공극률</span><div class="seg" role="radiogroup" aria-label="공극률"><button class="seg-item" role="radio" aria-checked="false">저공성</button><button class="seg-item is-selected" role="radio" aria-checked="true">중공성</button><button class="seg-item" role="radio" aria-checked="false">다공성</button><button class="seg-item" role="radio" aria-checked="false">모름</button></div></div>
    <p class="info"><img src="../assets/fluent/eyes.svg" alt=""><span>공극률은 머리카락이 수분을 머금는 정도예요</span></p>
    <div class="field"><span class="label">굵기</span><div class="seg" role="radiogroup" aria-label="굵기"><button class="seg-item" role="radio" aria-checked="false">가는모발</button><button class="seg-item" role="radio" aria-checked="false">보통</button><button class="seg-item is-selected" role="radio" aria-checked="true">굵은모발</button><button class="seg-item" role="radio" aria-checked="false">모름</button></div></div>
    <div class="field"><span class="label">두피</span><div class="seg" role="radiogroup" aria-label="두피"><button class="seg-item" role="radio" aria-checked="false">건성</button><button class="seg-item is-selected" role="radio" aria-checked="true">보통</button><button class="seg-item" role="radio" aria-checked="false">지성</button></div></div>
    <div class="field"><span class="label">기장</span><div class="chips" role="group" aria-label="기장"><button class="chip" aria-pressed="false">숏컷</button><button class="chip" aria-pressed="false">귀밑</button><button class="chip" aria-pressed="false">턱선</button><button class="chip is-selected" aria-pressed="true">쇄골</button><button class="chip" aria-pressed="false">가슴</button><button class="chip" aria-pressed="false">허리</button></div></div>
    <div class="field"><span class="label">염색</span><div class="seg" role="radiogroup" aria-label="염색"><button class="seg-item is-selected" role="radio" aria-checked="true">있음</button><button class="seg-item" role="radio" aria-checked="false">없음</button></div></div>
    <div class="field"><span class="label">탈색</span><div class="seg" role="radiogroup" aria-label="탈색"><button class="seg-item" role="radio" aria-checked="false">있음</button><button class="seg-item is-selected" role="radio" aria-checked="true">없음</button></div></div>
  </section>
  <section class="block">
    <div class="h2">매직펌 이력</div>
    <div class="field"><label class="label" for="mg">마지막 매직펌</label><input class="input" id="mg" value="2024년 9월"></div>
    <div class="field"><span class="label">탈매직 완료</span><div class="seg" role="radiogroup" aria-label="탈매직 완료"><button class="seg-item is-selected" role="radio" aria-checked="true">예</button><button class="seg-item" role="radio" aria-checked="false">아니오</button></div></div>
    <div class="field"><label class="label" for="dm">탈매직 완료 시기</label><input class="input" id="dm" value="2025년 8월"></div>
    <div class="field"><span class="label">연결펌</span><div class="seg" role="radiogroup" aria-label="연결펌"><button class="seg-item" role="radio" aria-checked="false">있음</button><button class="seg-item is-selected" role="radio" aria-checked="true">없음</button></div></div>
  </section>
</main>
<div class="cta"><a class="btn primary full" href="onb-survey.html">다음</a></div>
</body></html>
