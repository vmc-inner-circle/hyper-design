<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>시작 · 결혼식 날짜와 짝꿍 초대 · 보낸 뒤</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<main class="page">
  <div class="photo is-16x9"><img src="../assets/photos/couple.jpg" alt="함께 웃고 있는 예비부부"></div>
  <header class="hero">
    <p class="eyebrow">12월 12일(토) 결혼식 · <span class="num">D-66</span></p>
    <h1 class="title">준호 님께 초대를 보냈어요</h1>
    <p class="lead">준호 님이 들어오면 둘이 같은 모임과 일정을 봐요</p>
  </header>
  <div class="field"><label class="label" for="wd">결혼식 날짜 · 필수</label><input class="input" id="wd" value="2026년 12월 12일 토요일" placeholder="날짜를 골라 주세요"></div>
  <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>D-66 · 11월 28일부터는 급한 모임으로 알려 드려요</span></p>
  <div class="field"><label class="label" for="nm">내 이름</label><input class="input" id="nm" value="한서연"></div>
  <div class="field"><span class="label">나는</span>
    <div class="seg" role="radiogroup"><button class="seg-item is-selected" role="radio" aria-checked="true">예비신부</button><button class="seg-item" role="radio" aria-checked="false">예비신랑</button></div>
  </div>
  <div class="field"><label class="label" for="pt">짝꿍 초대</label><input class="input" id="pt" value="박준호" placeholder="짝꿍 이름"></div>
  <p class="done">카톡으로 초대 링크를 보냈어요 — 준호 님이 아직 들어오지 않았어요</p>
  <button class="btn secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4c-4.97 0-9 3.13-9 7 0 2.4 1.56 4.52 3.94 5.78L6 20l3.6-2.2c.79.13 1.59.2 2.4.2 4.97 0 9-3.13 9-7s-4.03-7-9-7z"/></svg>링크 다시 보내기</button>
  <a class="hero-more" href="start.html">짝꿍 이름 고치기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</main>
<div class="cta"><a class="btn primary full" href="people.html">지인 불러오기</a></div>
</body></html>
