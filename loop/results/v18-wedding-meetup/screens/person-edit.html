  <div class="row"><div class="row-main"><p class="row-title">1:1로 따로 만나기</p><p class="row-sub">켜면 모임을 짤 때 따로 만날 사람으로 묶여요</p></div><button class="switch" role="switch" aria-checked="false" aria-label="1:1로 따로 만나기"></button></div>
