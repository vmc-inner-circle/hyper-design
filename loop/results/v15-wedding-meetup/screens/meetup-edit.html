<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>대학 동기 모임 고치기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="meetup-detail.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">모임 고치기</h1><span></span></header>
<main class="page">
  <div class="field"><label class="label" for="name">모임 이름</label><input class="input" id="name" value="대학 동기 모임"></div>

  <section class="block is-list">
    <div class="block-head"><h2 class="h2">사람 5명</h2></div>
    <div class="row"><span class="avatar is-text">서연</span><div class="row-main"><p class="row-title">박서연</p><p class="row-sub">답함</p></div><span class="row-trail"><button class="appbar-btn" aria-label="박서연 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></button></span></div>
    <div class="row"><span class="avatar is-text">유나</span><div class="row-main"><p class="row-title">최유나</p><p class="row-sub">답함</p></div><span class="row-trail"><button class="appbar-btn" aria-label="최유나 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></button></span></div>
    <div class="row"><span class="avatar is-text">다은</span><div class="row-main"><p class="row-title">정다은</p><p class="row-sub">답함</p></div><span class="row-trail"><button class="appbar-btn" aria-label="정다은 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></button></span></div>
    <div class="row"><span class="avatar is-text">소희</span><div class="row-main"><p class="row-title">한소희</p><p class="row-sub">답 없음</p></div><span class="row-trail"><button class="appbar-btn" aria-label="한소희 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></button></span></div>
    <div class="row"><span class="avatar is-text">지현</span><div class="row-main"><p class="row-title">오지현</p><p class="row-sub">답 없음</p></div><span class="row-trail"><button class="appbar-btn" aria-label="오지현 빼기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></button></span></div>
    <a class="row is-add" href="meetup-new.html"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><div class="row-main"><p class="row-title">사람 더하기</p></div></a>
    <p class="block-note">답한 사람을 빼면 그 답도 지워져요</p>
  </section>

  <section class="block is-list">
    <div class="block-head"><h2 class="h2">날짜 후보</h2></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/calendar.svg" alt=""></span><div class="row-main"><p class="row-title">10월 17일(토) 저녁 7시</p><p class="row-sub">가능 2명 · 같은 날 낮에 동네 친구 모임이 있어요</p></div><span class="row-trail"><button class="appbar-btn" aria-label="10월 17일 후보 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/calendar.svg" alt=""></span><div class="row-main"><p class="row-title">10월 18일(일) 낮 12시</p><p class="row-sub">가능 2명</p></div><span class="row-trail"><button class="appbar-btn" aria-label="10월 18일 후보 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/calendar.svg" alt=""></span><div class="row-main"><p class="row-title">10월 24일(토) 저녁 7시</p><p class="row-sub">가능 3명</p></div><span class="row-trail"><button class="appbar-btn" aria-label="10월 24일 후보 지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
    <a class="row is-add" href="meetup-dates.html"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><div class="row-main"><p class="row-title">후보 추가</p></div></a>
    <p class="block-note">후보를 바꾸면 바뀐 후보에만 다시 답을 받아요</p>
  </section>

  <div class="field"><label class="label" for="due">회신 마감</label><input class="input" id="due" value="10월 6일(화) 밤 10시"></div>

  <div class="field">
    <a class="btn secondary full" href="home.html">모임 취소</a>
    <p class="block-note">취소하면 5명은 '아직 모임 없음'으로 돌아가요</p>
  </div>
</main>
<div class="cta"><a class="btn primary full" href="meetup-detail.html">저장</a></div>
</body></html>
