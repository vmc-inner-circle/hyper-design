<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>전화번호 인증</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="login.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">전화번호 인증</h1><span></span></header>
<main class="page">
  <div class="progress" role="progressbar" aria-valuenow="1" aria-valuemax="3" aria-label="가입 3단계 중 1단계"><span class="is-on"></span><span></span><span></span></div>

  <div class="field"><label class="label" for="phone">전화번호</label><input class="input" id="phone" type="tel" value="010-****-5512" readonly></div>

  </div>
  <section class="block">
    <button class="btn small secondary" disabled>인증번호 다시 받기</button>
  </section>
</main>
<div class="cta"><a class="btn primary full" href="login.html">카카오로 시작하기</a></div>
