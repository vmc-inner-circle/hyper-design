<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>일정 고치기 · 오류</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="day-edit.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">일정 고치기</h1><span></span></header>
<main class="page">
  <div class="field"><span class="label">상태</span>
    <div class="seg" role="radiogroup" aria-label="상태"><button class="seg-item" role="radio" aria-checked="false">후보</button><button class="seg-item is-selected" role="radio" aria-checked="true">확정</button></div>
  </div>
  <div class="field"><span class="label">종류</span>
    <div class="chips" role="radiogroup" aria-label="종류"><button class="chip" role="radio" aria-checked="false">이동</button><button class="chip" role="radio" aria-checked="false">숙박</button><button class="chip is-selected" role="radio" aria-checked="true">활동</button></div>
  </div>
  <div class="field"><label class="label" for="n">이름</label><input class="input" id="n" value="벳푸 지옥 온천 순례"></div>
  <div class="field"><label class="label" for="d">날짜</label><input class="input" id="d" value="11월 21일 토요일"></div>
  <div class="field is-error"><label class="label" for="t">시간</label>
    <div class="seg" role="radiogroup" aria-label="시간대"><button class="seg-item" role="radio" aria-checked="false">오전</button><button class="seg-item" role="radio" aria-checked="false">오후</button><button class="seg-item" role="radio" aria-checked="false">저녁</button></div>
    <input class="input" id="t" value="" placeholder="정확한 시간 (없으면 비워 두세요)"><p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>확정하려면 시간이나 오전·오후·저녁 중 하나를 골라 주세요</p>
  </div>
  <div class="field"><label class="label" for="p">장소</label><input class="input" id="p" value="벳푸 간나와 지옥"></div>
  <div class="field"><label class="label" for="m">메모</label><input class="input" id="m" value="유후인역 앞 버스 1시간, 걷기 많음"></div>
  <p class="info"><img src="../assets/fluent/eyes.svg" alt=""><span>확정으로 저장하면 가족 화면에 보이고 저녁 7시에 한 번 알려요</span></p>
  <a class="btn secondary" href="day-edit.html">지우기</a>
</main>
<div class="cta"><button class="btn primary full">확정으로 저장</button></div>
</body></html>
