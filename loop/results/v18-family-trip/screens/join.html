<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>초대 받고 들어오기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="text-large has-cta">
<main class="page">
  <header class="hero">
    <p class="eyebrow">김지은 님의 초대</p>
    <h1 class="title">지은 님이 '엄마 아빠랑 후쿠오카·유후인'에 불렀어요</h1>
  </header>
  <section class="block">
    <div class="photo is-16x9"><img src="../assets/photos/fukuoka.jpg" alt="후쿠오카 나카스 강변"></div>
    <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>11월 26일(목) ~ 11월 30일(월) · 4박 5일 · 6명</span></p>
  </section>
  <section class="block is-list" role="radiogroup" aria-label="저는 누구인가요?">
    <div class="block-head"><h2 class="h2">저는 누구인가요?</h2></div>
    <div class="row"><span class="avatar"><img src="../assets/fluent/mother.svg" alt=""></span><div class="row-main"><p class="row-title">박미숙</p><p class="row-sub">엄마</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="true" aria-label="박미숙"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    <div class="row"><span class="avatar"><img src="../assets/fluent/father.svg" alt=""></span><div class="row-main"><p class="row-title">김정호</p><p class="row-sub">아빠</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="김정호"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    <div class="row"><span class="avatar is-text">준</span><div class="row-main"><p class="row-title">김준호</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="김준호"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    <div class="row"><span class="avatar"><img src="../assets/fluent/minsu.svg" alt=""></span><div class="row-main"><p class="row-title">이민수</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="이민수"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    <div class="row"><span class="avatar"><img src="../assets/fluent/hayun.svg" alt=""></span><div class="row-main"><p class="row-title">이하윤</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="이하윤"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    <div class="row is-done"><span class="avatar"><img src="../assets/fluent/jieun.svg" alt=""></span><div class="row-main"><p class="row-title">김지은</p><p class="row-sub">이미 함께하고 있어요</p></div></div>
  </section>
  <p class="info"><img src="../assets/fluent/invite.svg" alt=""><span>가입이나 비밀번호는 필요 없어요</span></p>
</main>
<div class="cta"><a class="btn primary full" href="join--done.html">함께하기</a></div>
</body></html>
