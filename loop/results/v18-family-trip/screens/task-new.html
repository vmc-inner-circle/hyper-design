<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>할 일 맡기기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="text-large plain has-cta">
<header class="appbar"><a class="appbar-btn" href="tasks-all.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">할 일 맡기기</h1><span></span></header>
<main class="page">
  <div class="field"><label class="label" for="what">무엇을</label><input class="input" id="what" value="여권 사진 찍기"></div>
  <div class="field"><span class="label" id="who">누가</span>
    <div role="radiogroup" aria-labelledby="who">
      <div class="row"><span class="avatar"><img src="../assets/fluent/mother.svg" alt=""></span><div class="row-main"><p class="row-title">박미숙</p><p class="row-sub">엄마</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="박미숙"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="avatar"><img src="../assets/fluent/father.svg" alt=""></span><div class="row-main"><p class="row-title">김정호</p><p class="row-sub">아빠</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="true" aria-label="김정호"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="avatar is-text">준</span><div class="row-main"><p class="row-title">김준호</p><p class="row-sub">막내</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="김준호"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="avatar"><img src="../assets/fluent/minsu.svg" alt=""></span><div class="row-main"><p class="row-title">이민수</p><p class="row-sub">사위</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="이민수"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="avatar"><img src="../assets/fluent/hayun.svg" alt=""></span><div class="row-main"><p class="row-title">이하윤</p><p class="row-sub">손녀</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="이하윤"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><span class="avatar"><img src="../assets/fluent/jieun.svg" alt=""></span><div class="row-main"><p class="row-title">김지은 (나)</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="김지은 (나)"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    </div>
  </div>
  <div class="field"><label class="label" for="due">언제까지</label><input class="input" id="due" value="10월 20일"></div>
  <p class="info"><img src="../assets/fluent/clipboard.svg" alt=""><span>따로 알림은 가지 않고 아빠의 '내 것'에 바로 보여요</span></p>
</main>
<div class="cta"><a class="btn primary full" href="task-new--done.html">맡기기</a></div>
</body></html>
