<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>링크 · 확정된 뒤 (정하윤)</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="has-cta text-large">
<main class="page">
  <header class="hero">
    <p class="eyebrow">지은·민수의 청첩장모임</p>
    <span class="badge is-brand">확정</span>
    <h1 class="title">하윤님, 10월 10일에 만나요</h1>
    <p class="lead">지은·민수와 대학 동기 모임이 정해졌어요</p>
  </header>
  <section class="block">
    <div class="photo is-16x9"><img src="../assets/photos/restaurant-yeonnam.jpg" alt="연남동 소금빵식탁 실내"></div>
    <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>10월 10일(토) 낮 12시</span></p>
    <p class="info"><img src="../assets/fluent/pin.svg" alt=""><span>연남동 '소금빵식탁'</span></p>
  </section>
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">함께 오는 사람 5명</h2></div>
    <div class="row"><span class="avatar is-text">정</span><div class="row-main"><p class="row-title">정하윤</p><p class="row-sub">나</p></div></div>
    <div class="row"><span class="avatar is-text">최</span><div class="row-main"><p class="row-title">최유나</p><p class="row-sub">대학 동기</p></div></div>
    <div class="row"><span class="avatar is-text">박</span><div class="row-main"><p class="row-title">박소희</p><p class="row-sub">대학 동기</p></div></div>
    <div class="row"><span class="avatar is-text">윤</span><div class="row-main"><p class="row-title">윤다은</p><p class="row-sub">대학 동기</p></div></div>
    <div class="row"><span class="avatar is-text">한</span><div class="row-main"><p class="row-title">한예린</p><p class="row-sub">대학 동기</p></div></div>
  </section>
</main>
<div class="cta"><button class="btn primary full">내 캘린더에 넣기</button></div>
