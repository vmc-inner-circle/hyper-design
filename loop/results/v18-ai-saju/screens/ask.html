<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>AI에게 묻기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
  .hero.ask-head { flex-direction: row; align-items: center; justify-content: space-between; padding-bottom: var(--stack-s); }
  .ask-left { display: inline-flex; align-items: center; gap: var(--stack-s); font-size: var(--fs-sub); font-weight: var(--fw-strong); color: var(--c-text-2); }
  body.has-tab .page { padding-bottom: calc(var(--h-tab) + var(--h-btn) * 3 + var(--stack-l)); }
  .chat { display: flex; flex-direction: column; gap: var(--stack-s); padding: 0 var(--page-x); }
  .msg { max-width: 85%; padding: var(--stack-m); border-radius: var(--r-l); font-size: var(--fs-body); line-height: var(--lh-body); }
  .msg.is-me { align-self: flex-end; background: var(--c-brand); color: var(--c-on-brand); }
  .msg.is-ai { align-self: flex-start; background: var(--c-surface); display: flex; flex-direction: column; gap: var(--stack-m); }
  .msg-time { align-self: flex-end; font-size: var(--fs-caption); color: var(--c-text-3); margin-bottom: var(--stack-s); }
  .basis { border-top: thin solid var(--c-line); padding-top: var(--stack-m); display: flex; flex-direction: column; gap: var(--stack-s); }
  .basis summary { list-style: none; display: inline-flex; align-items: center; gap: 0.15em; min-height: var(--h-btn-s); font-size: var(--fs-sub); font-weight: var(--fw-strong); color: var(--c-brand-text); cursor: pointer; }
  .basis summary::-webkit-details-marker { display: none; }
  .basis summary svg { width: 1.15em; height: 1.15em; }
  .basis ul { display: flex; flex-direction: column; gap: var(--stack-s); }
  .basis li { display: flex; align-items: flex-start; gap: var(--stack-s); font-size: var(--fs-sub); line-height: var(--lh-sub); color: var(--c-text-2); }
  .el { flex: none; display: inline-grid; place-items: center; width: 2em; height: 2em; border-radius: var(--r-s); font-size: var(--fs-caption); font-weight: var(--fw-title); }
  .el.is-fire { background: var(--c-danger-tint); color: var(--c-danger-tint-text); }
  .el.is-metal { background: var(--c-bg); color: var(--c-text-2); border: thin solid var(--c-text-3); }
  .term { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 0.2em; color: var(--c-text-1); }
  .composer { position: fixed; left: 0; right: 0; bottom: var(--h-tab); padding: var(--stack-s) 0 var(--stack-s); background: var(--c-bg); border-top: thin solid var(--c-line); display: flex; flex-direction: column; gap: var(--stack-s); }
  .composer-note { padding: 0 var(--page-x); font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--c-text-3); }
  .composer-row { display: flex; gap: var(--stack-s); padding: 0 var(--page-x); }
  .composer-row .input { flex: 1; min-width: 0; background: var(--c-surface); border-color: var(--c-line); }
  .send { flex: none; width: var(--h-btn); height: var(--h-btn); border-radius: var(--r-pill); background: var(--c-brand); color: var(--c-on-brand); display: grid; place-items: center; }
  .send svg { width: var(--icon); height: var(--icon); }
</style>
</head>
<body class="has-tab text-large">
<main class="page">
  <header class="hero ask-head">
    <h1 class="title">AI에게 묻기</h1>
    <p class="ask-left"><span class="badge is-info">무료</span>2회 남음</p>
  </header>

  <div class="chat">
    <p class="msg is-me">이번 달 면접 운 어때?</p>
    <p class="msg-time">밤 11:08</p>

    <div class="msg is-ai">
      <p>10월 중순은 말로 인정받는 기운이 강해요. 14일 면접에선 준비한 경험을 구체적인 숫자로 말해 보세요.</p>
      <details class="basis" open>
        <summary>근거 보기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></summary>
        <ul>
          <li><span class="el is-metal">금</span><span>지금 <u class="term">대운</u> 경오 庚午 — 없던 금 기운이 들어와 노력이 결과로 맺혀요</span></li>
          <li><span class="el is-fire">화</span><span>10월 정유월의 불 기운이 나를 도와요</span></li>
          <li><span class="el is-fire">화</span><span>내 <u class="term">일간</u>은 <u class="term">병화</u> 丙火 — 불 기운을 받으면 말과 표현이 살아나요</span></li>
        </ul>
      </details>
    </div>
  </div>
</main>

<div class="composer">
  <div class="chips">
    <button class="chip" type="button">최종 면접에서 뭘 강조할까?</button>
    <button class="chip" type="button">도현이랑 연말 여행 가도 될까?</button>
    <button class="chip" type="button">첫 월급은 어떻게 모을까?</button>
  </div>
  <p class="composer-note">하루 3번 무료 · 이후 1번에 별 5개</p>
  <form class="composer-row" action="ask.html">
    <label class="label" for="q" hidden>질문</label>
    <input class="input" id="q" placeholder="지금 고민을 그대로 적어 보세요">
    <button class="send" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
</div>

<nav class="tabbar">

  <a class="tab" href="saju.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/></svg>내 사주</a>
  <a class="tab" href="ask.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-4 3v-3H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>묻기</a>
  <a class="tab" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>기록</a>
  <a class="tab" href="my.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>마이</a>
</nav>
</body></html>
