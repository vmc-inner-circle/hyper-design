<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>생년월일 입력 2/2 · 태어난 시간</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
.time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--stack-s); }
.time-grid .chip { flex-direction: column; justify-content: center; padding: var(--stack-s); }
.time-grid .chip small { font-size: var(--fs-caption); font-weight: var(--fw-caption); line-height: var(--lh-caption); }
</style>
</head>
<body class="plain has-cta text-large">
<header class="appbar"><a class="appbar-btn" href="birth-1.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">태어난 시간</h1><span></span></header>
<main class="page">
  <div class="progress" role="progressbar" aria-valuenow="2" aria-valuemax="2" aria-label="2단계 중 2단계"><span class="is-on"></span><span class="is-on"></span></div>
  <div class="row"><div class="row-main"><p class="row-title">시간을 몰라요</p><p class="row-sub">몰라도 풀이할 수 있어요. 나중에 넣으면 더 정확해져요</p></div>
    <span class="row-trail"><button class="check" role="checkbox" aria-checked="false" aria-label="시간을 몰라요"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span></button></span></div>
  <div class="field"><span class="label">태어난 시간</span>
  <div class="time-grid" role="radiogroup" aria-label="12지시">
    <button class="chip" role="radio" aria-checked="false">자시<small>23:30~01:29</small></button>
    <button class="chip" role="radio" aria-checked="false">축시<small>01:30~03:29</small></button>
    <button class="chip" role="radio" aria-checked="false">인시<small>03:30~05:29</small></button>
    <button class="chip" role="radio" aria-checked="false">묘시<small>05:30~07:29</small></button>
    <button class="chip is-selected" role="radio" aria-checked="true">진시<small>07:30~09:29</small></button>
    <button class="chip" role="radio" aria-checked="false">사시<small>09:30~11:29</small></button>
    <button class="chip" role="radio" aria-checked="false">오시<small>11:30~13:29</small></button>
    <button class="chip" role="radio" aria-checked="false">미시<small>13:30~15:29</small></button>
    <button class="chip" role="radio" aria-checked="false">신시<small>15:30~17:29</small></button>
    <button class="chip" role="radio" aria-checked="false">유시<small>17:30~19:29</small></button>
    <button class="chip" role="radio" aria-checked="false">술시<small>19:30~21:29</small></button>
    <button class="chip" role="radio" aria-checked="false">해시<small>21:30~23:29</small></button>
  </div></div>
  <div class="field"><label class="label" for="hm">시:분으로 입력</label><input class="input" id="hm" value="오전 8:10"></div>
  <div class="field"><label class="label" for="place">태어난 곳(선택)</label><input class="input" id="place" value="서울" placeholder="시·군·구"></div>
</main>
<div class="cta"><a class="btn primary full" href="home-first.html">풀이 받기</a></div>
</body></html>
