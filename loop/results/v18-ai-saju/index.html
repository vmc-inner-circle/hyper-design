<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전체 화면 한눈에 보기</title>
<!-- 캔버스 템플릿(정적). build_canvas.py 가 아래 hd-data 에 데이터만 끼워 넣는다. 외부 라이브러리 없음. -->
<link id="tokens" rel="stylesheet" href="tokens.css" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;background:#ECECE8;color:#1c1c1c;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

/* ---------- 헤더: 제목 · 탭 · 팔레트 · 보기 (조작 그룹 3개) ---------- */
.hd{flex:none;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid #dcdcd7;position:relative;z-index:5}
.hd h1{font-size:17px;font-weight:700;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tabs{display:flex;gap:2px;background:#EFEFEB;border-radius:12px;padding:3px}
.tab{min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:600;color:#5a5a55;cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:#1c1c1c;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pal{display:flex;align-items:center;gap:2px;margin-left:auto}
.pal-label{font-size:13px;color:#777;margin-right:4px}
.dot{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;padding:0 10px;border:0;border-radius:999px;background:transparent;font-size:14px;color:#444;cursor:pointer}
.dot i{flex:none;width:22px;height:22px;border-radius:999px;background:var(--dot);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dot[aria-pressed="true"]{background:#F1F1ED;color:#1c1c1c;font-weight:700}
.dot[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff,0 0 0 4px #1c1c1c}
.dot:hover{background:#F5F5F2}
.view{display:flex;align-items:center;gap:4px}
.vbtn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #dcdcd7;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.vbtn:hover{background:#F5F5F2}
.zoom{min-width:64px;font-variant-numeric:tabular-nums;color:#555}
body:not([data-tab="screens"]) .view{visibility:hidden}
@media (max-width:760px){
  .hd{padding:6px 10px;gap:4px 8px}
  .hd h1{flex:1 1 0;font-size:16px;order:1;max-width:none}
  .pal{order:2;margin-left:0}
  .tabs{order:3}
  .view{order:4;margin-left:auto}
  .tab{padding:0 7px;font-size:13px}
  .fit-long{display:none}
  .zoom{min-width:52px}
  .dot{padding:0}
  .dot{justify-content:center}
  .dot b,.pal-label{display:none}
  .vbtn{padding:0 10px}
}

/* ---------- 판 ---------- */
.panes{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0}
.pane[hidden]{display:none}
.pane iframe.doc{width:100%;height:100%;border:0;display:block;background:#F6F6F3}
#screens{overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#screens.dragging{cursor:grabbing}
#screens.dragging .cover{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;will-change:transform}

/* 판 안의 글 — 첫 배율 0.72 기준으로 읽히게 크게 쓴다(22px → 약 16px) */
.intro{padding:48px 0 0;max-width:1760px}
.intro-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
.hint{font-size:20px;color:#6b6b66;margin:0 0 18px}
.story h2{font-size:42px;line-height:1.3;margin:0 0 14px}
.story h2 em{font-style:normal;color:var(--c-brand,#2563eb)}
.story .sum{font-size:22px;line-height:1.6;color:#444;margin:0 0 24px}
.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.idea{background:#fff;border-radius:20px;padding:22px}
.idea b{font-size:22px}
.idea p{font-size:19px;line-height:1.55;color:#555;margin:8px 0 0}
.people{margin-top:20px}
.people h3{font-size:22px;margin:0 0 10px}
.people ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.people li{background:#fff;border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.45;color:#555}
.people li b{display:block;font-size:18px;color:#1c1c1c;margin-bottom:2px}
.people li .win{display:block;color:#1c1c1c;margin-top:4px}
.decisions{margin-top:6px}
.narrow .ideas,.narrow .decisions ul,.narrow .people ul,.narrow .intro-grid{grid-template-columns:1fr}
.narrow .decisions{margin-top:0}
.narrow .story h2{font-size:38px}
.decisions h3{font-size:27px;margin:0 0 8px}
.decisions .core{font-size:21px;color:#333;margin:0 0 14px}
.decisions ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.decisions li{background:#fff;border-radius:16px;padding:14px 18px;font-size:19px;line-height:1.45}
.decisions li b{margin-right:4px}
.decisions .why{display:block;color:#666;font-size:18px}
.v{display:inline-block;font-size:15px;font-weight:700;border-radius:8px;padding:2px 9px;margin-right:8px;background:#eee;color:#444;vertical-align:2px}
.v-cut{background:#fde8e8;color:#9b1c1c}
.v-lighten{background:#e7f0ff;color:#1d4ed8}
.v-follow{background:#e6f6ec;color:#166534}
.decisions h3.mk{margin-top:18px}

.rows{position:relative;padding-bottom:40px}
.flow{padding-top:90px}
.glabel{font-size:31px;font-weight:700;margin:0 0 104px;white-space:nowrap}
.cards{display:flex;gap:84px;align-items:flex-start}
.card{flex:none;width:375px}
.phone{position:relative;width:375px;height:812px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.10)}
.phone iframe{display:block;width:375px;height:812px;border:0;pointer-events:none;background:#fff}
.cover{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;margin:0;background:transparent;border-radius:28px;cursor:pointer}
.cover:hover,.cover:focus-visible{outline:4px solid #2563eb;outline-offset:0}
.ftitle{font-size:22px;font-weight:700;margin-top:16px;line-height:1.35}
.state{display:inline-block;font-size:15px;font-weight:700;color:#8a5a00;background:#fff3cf;border-radius:8px;padding:2px 8px;margin-right:8px;vertical-align:2px}
.fdesc{font-size:18px;color:#555;margin-top:4px;line-height:1.45}
.pol{margin:8px 0 0;padding-left:22px;font-size:17px;line-height:1.5;color:#444}
.more{font-size:17px;color:#666;margin-top:4px}
.more summary,.foot summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.more .pol{margin-top:0}
svg.ar{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.ar path.ln{fill:none;stroke:var(--c-brand,#2563eb);stroke-width:3;marker-start:url(#hd-dot);marker-end:url(#hd-head)}
svg.ar marker path,svg.ar marker circle{fill:var(--c-brand,#2563eb)}
.alabel{position:absolute;transform:translate(-50%,-100%);background:#fff;border:1.5px solid var(--c-brand,#2563eb);color:var(--c-brand-text,#1d4ed8);font-size:17px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.alabel.side{transform:translate(-100%,-50%);white-space:normal;max-width:220px;text-align:right;border-radius:14px}
.foot{padding:20px 0 120px;font-size:17px;color:#777;max-width:1500px}
.foot p{margin:0 0 6px}
.foot ul{margin:4px 0 0;padding-left:22px;line-height:1.6}
.foot a{color:#555}

/* ---------- 크게 보기 ---------- */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,20,20,.62);display:flex;align-items:center;justify-content:center}
#modal[hidden]{display:none}
#modal .box{position:relative;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal iframe{display:block;width:390px;height:844px;border:0;transform-origin:0 0;background:#fff}
#modal .close{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;min-width:44px;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;z-index:2}
#modal .mtitle{position:absolute;top:max(10px,env(safe-area-inset-top));left:16px;right:96px;color:#fff;font-size:15px;font-weight:600;min-height:44px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

</div>

    ((D.people || []).length ? '<div class="people"><h3>누구를 위한 앱인가</h3><ul>' + D.people.map(function (p) {
      return '<li><b>' + esc(p.name) + (p.core ? ' · 핵심' : '') + '</b>' + esc(p.why) + '<span class="win">→ ' + esc(p.win) + '</span>' + '</li>'; }).join('') + '</ul></div>' : '') + '</section>';
}
var dc = D.decisions;
if (dc && ((dc.items || []).length || dc.core)) {
  intro += '<section class="decisions"><h3>정한 것 · 뺀 것</h3>' + (dc.core ? '<p class="core">' + esc(dc.core) + '</p>' : '') +
    '<ul>' + (dc.items || []).map(function (i) {
      return '<li><span class="v v-' + esc(i.verdict) + '">' + esc(i.label) + '</span><b>' + esc(i.name) + '</b>' +
        (i.how ? ' → ' + esc(i.how) : '') + '<span class="why">' + esc(i.why) + '</span></li>'; }).join('') + '</ul>' +
    ((dc.market || []).length ? '<h3 class="mk">시장 관례 — 따른 것 · 벗어난 것</h3><ul>' + dc.market.map(function (i) {
      return '<li><span class="v v-' + esc(i.verdict) + '">' + esc(i.label) + '</span><b>' + esc(i.name) + '</b>' +
        '<span class="why">' + esc(i.verdict === 'cut' ? i.why : (i.how || i.why)) + '</span></li>'; }).join('') + '</ul>' : '') + '</section>';
}
$('#intro').innerHTML = '<p class="hint">끌어서 둘러보고, 화면을 누르면 크게 보고 직접 눌러볼 수 있어요 · 화살표는 갈래' + (D.stage === 'go' && D.pending ? ' · 오류·확인·빈 화면 같은 상태 ' + D.pending + '개는 <b>/hyper-design:max</b>로 더할 수 있어요' : '') + '</p><div class="intro-grid">' + intro + '</div>';
$('#intro').style.marginLeft = LEFT + 'px';

var html = '<svg class="ar" id="ar" width="1" height="1"><defs><marker id="hd-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker><marker id="hd-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4"><circle cx="5" cy="5" r="4"/></marker></defs></svg>';
(D.rows || []).forEach(function (row) {
  html += '<div class="flow"><div class="glabel">' + esc(row.group) + '</div><div class="cards">';
  row.screens.forEach(function (s) {
    var pol = s.policies || [];
    var shown = pol.slice(0, 3).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
    var more = pol.length > 3 ? '<details class="more"><summary>정책 ' + (pol.length - 3) + '개 더</summary><ul class="pol">' +
      pol.slice(3).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></details>' : '';
    html += '<div class="card" data-id="' + esc(s.id) + '"><div class="phone"><iframe scrolling="no" tabindex="-1" title="' + esc(s.title) +
      '" data-src="' + esc(s.file) + '"></iframe><button class="cover" data-file="' + esc(s.file) + '" data-title="' + esc(s.title) +
      '" aria-label="' + esc(s.title) + ' 크게 보기"></button></div>' +
      '<div class="ftitle">' + (s.state ? '<span class="state">상태</span>' : '') + esc(s.title) + '</div>' +
      (s.purpose ? '<div class="fdesc">' + esc(s.purpose) + '</div>' : '') + (shown ? '<ul class="pol">' + shown + '</ul>' : '') + more + '</div>';
  });
  html += '</div></div>';
});
rowsEl.innerHTML = html;
rowsEl.style.paddingLeft = LEFT + 'px';

var foot = '';
var P = D.palettes;
if (P && P.options && P.options.length) {
  foot += '<p>색 출처: ' + P.options.map(function (o) { return esc(o.name) + ' 웹 팔레트'; }).join(' · ') +
    ' — 시안용 참고. 출시 전 자체 브랜드 색으로 바꾸세요.</p>';
}
if (D.credits && D.credits.length) {
  foot += '<details><summary>사진 출처 ' + D.credits.length + '장</summary><ul>' + D.credits.map(function (c) {
    var t = esc(c.title || c.file || c.slot);
    var link = c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + t + '</a>' : t;
    return '<li>' + (c.slot ? esc(c.slot) + ' — ' : '') + link + (c.author ? ' · ' + esc(c.author) : '') + (c.license ? ' · ' + esc(c.license) : '') + '</li>';
  }).join('') + '</ul></details>';
}
$('#foot').innerHTML = foot;
$('#foot').style.marginLeft = LEFT + 'px';

/* ---------- 화살표: 갈래(branches)에만. 같은 줄은 위쪽 호, 다른 줄은 왼쪽 통로로 우회 ---------- */
var contentLeft = LEFT;
function roundPath(pts, r) {
  var d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++) {
    var p = pts[i - 1], c = pts[i], n = pts[i + 1];
    var l1 = Math.hypot(c[0] - p[0], c[1] - p[1]), l2 = Math.hypot(n[0] - c[0], n[1] - c[1]);
    var rr = Math.min(r, l1 / 2, l2 / 2);
    if (rr < 1) { d += ' L' + c[0] + ',' + c[1]; continue; }
    var a = [c[0] - (c[0] - p[0]) / l1 * rr, c[1] - (c[1] - p[1]) / l1 * rr];
    var b = [c[0] + (n[0] - c[0]) / l2 * rr, c[1] + (n[1] - c[1]) / l2 * rr];
    d += ' L' + a[0].toFixed(1) + ',' + a[1].toFixed(1) + ' Q' + c[0] + ',' + c[1] + ' ' + b[0].toFixed(1) + ',' + b[1].toFixed(1);
  }
  var e = pts[pts.length - 1];
  return d + ' L' + e[0] + ',' + e[1];
}
function drawArrows() {
  var svg = $('#ar'), box = {};
  $$('.card', rowsEl).forEach(function (c) {
    box[c.dataset.id] = {x: c.offsetLeft, y: c.offsetTop, row: c.parentNode};   // offsetParent = .rows
  });
  $$('.alabel', rowsEl).forEach(function (n) { n.remove(); });
  $$('path.ln', svg).forEach(function (n) { n.remove(); });
  var paths = '', labels = '', k = 0, minX = LEFT;
  (D.arrows || []).forEach(function (a) {
    var s = box[a.from], t = box[a.to]; if (!s || !t) return;
    var d, lx, ly, side = false;
    if (s.row === t.row) {
      var ax = s.x + CARD.w / 2, cx = t.x + CARD.w / 2, y = s.y - 10, peak = s.y - 58;
      d = 'M' + ax + ',' + y + ' C' + ax + ',' + peak + ' ' + cx + ',' + peak + ' ' + cx + ',' + (y - 2);
      lx = (ax + cx) / 2; ly = peak + 6;
    } else {
      var lane = LEFT - 56 - 22 * (k % 4), off = 22 + 12 * (k % 4);
      var sx = s.x + 60 + 24 * (k % 3), tx = t.x + 60 + 24 * (k % 3);
      var sg = s.y - off, tg = t.y - off;
      d = roundPath([[sx, s.y - 6], [sx, sg], [lane, sg], [lane, tg], [tx, tg], [tx, t.y - 8]], 18);
      lx = lane - 12; ly = (sg + tg) / 2; side = true; k++;
      minX = Math.min(minX, lane - 240);
    }
    paths += '<path class="ln" d="' + d + '"/>';
    if (a.label) labels += '<div class="alabel' + (side ? ' side' : '') + '" style="left:' + lx + 'px;top:' + ly + 'px">' + esc(a.label) + '</div>';
  });
  svg.insertAdjacentHTML('beforeend', paths);
  rowsEl.insertAdjacentHTML('beforeend', labels);
  if (labels) $$('.alabel.side', rowsEl).forEach(function (n) { minX = Math.min(minX, n.offsetLeft - n.offsetWidth); });
  contentLeft = Math.max(0, minX - 24);
}

/* ---------- 이동·확대 ---------- */
var z = Z0, tx = 0, ty = 0;
function apply() {
  stage.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + z.toFixed(4) + ')';
  stage.dataset.zoom = z.toFixed(4);
  $('#zoom').textContent = Math.round(z * 100) + '%';
  scheduleVisible();
}
var fitMin = ZMIN;                                // 전체 보기가 0.25 보다 작아야 하면 그만큼은 허용
function clampZ(v) { return Math.min(ZMAX, Math.max(fitMin, v)); }
function zoomAt(px, py, nz) {
  nz = clampZ(nz);
  var bx = (px - tx) / z, by = (py - ty) / z;
  z = nz; tx = px - bx * z; ty = py - by * z; apply();
}
function home() {
  z = Z0;
  tx = pane.clientWidth < 600 ? 12 - LEFT * z : 24 - contentLeft * z;   // 폰: 화면 줄이 바로 보이게 통로는 화면 밖으로
  ty = 0; apply();
}
function fit() {
  var w = stage.offsetWidth - contentLeft, h = stage.offsetHeight;
  var pw = pane.clientWidth, ph = pane.clientHeight;
  var fz = Math.min((pw - 32) / w, (ph - 32) / h);
  fitMin = Math.min(ZMIN, fz);
  z = clampZ(fz);
  tx = (pw - w * z) / 2 - contentLeft * z;
  ty = Math.max(16, (ph - h * z) / 2);
  apply();
}
$('#fit').addEventListener('click', fit);
$('#zoom').addEventListener('click', home);

pane.addEventListener('wheel', function (e) {
  e.preventDefault();
  var r = pane.getBoundingClientRect(), k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? pane.clientHeight : 1;
  var dx = e.deltaX * k, dy = e.deltaY * k;
  if (e.ctrlKey || e.metaKey) { zoomAt(e.clientX - r.left, e.clientY - r.top, z * Math.exp(-dy * 0.0022)); return; }
  if (e.shiftKey && !dx) { dx = dy; dy = 0; }
  tx -= dx; ty -= dy; apply();
}, {passive: false});

var ptrs = new Map(), drag = null, pinch = null, justDragged = false;
function mid() { var a = Array.from(ptrs.values()); return {x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1}; }
function startDrag(id, p, type) { drag = {id: id, x: p.x, y: p.y, tx: tx, ty: ty, moved: false, thr: type === 'touch' ? 8 : 4}; }
pane.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  justDragged = false;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 1) startDrag(e.pointerId, {x: e.clientX, y: e.clientY}, e.pointerType);
  else if (ptrs.size === 2) {
    var m = mid(); pinch = {m: m, z: z, tx: tx, ty: ty};
    if (drag) drag.moved = true;
    try { ptrs.forEach(function (_, id) { pane.setPointerCapture(id); }); } catch (err) {}
  }
});
pane.addEventListener('pointermove', function (e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  var r = pane.getBoundingClientRect();
  if (pinch && ptrs.size >= 2) {
    var m = mid(), nz = clampZ(pinch.z * m.d / pinch.m.d);
    var bx = (pinch.m.x - r.left - pinch.tx) / pinch.z, by = (pinch.m.y - r.top - pinch.ty) / pinch.z;
    z = nz; tx = m.x - r.left - bx * z; ty = m.y - r.top - by * z; apply();
    return;
  }
  if (!drag || drag.id !== e.pointerId) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > drag.thr) {
    drag.moved = true; pane.classList.add('dragging');
    try { pane.setPointerCapture(e.pointerId); } catch (err) {}
  }
  if (drag.moved) { tx = drag.tx + dx; ty = drag.ty + dy; apply(); }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (drag && drag.moved) justDragged = true;
  if (ptrs.size === 1) {                          // 핀치 끝 → 남은 손가락으로 이어서 이동
    pinch = null;
    var id = ptrs.keys().next().value, p = ptrs.get(id);
    startDrag(id, p, 'touch'); drag.moved = true;
  } else if (ptrs.size === 0) { drag = null; pinch = null; pane.classList.remove('dragging'); }
}
pane.addEventListener('pointerup', endPtr);
pane.addEventListener('pointercancel', endPtr);
pane.addEventListener('click', function (e) {
  if (justDragged) { justDragged = false; e.preventDefault(); e.stopPropagation(); return; }
  var c = e.target.closest && e.target.closest('.cover');
  if (c) openModal(c.dataset.file, c.dataset.title);
}, true);

/* ---------- 보이는 카드만 로드(이동·확대 후 100ms 묶어서) ---------- */
var visT = 0;
function loadVisible() {
  var pr = pane.getBoundingClientRect();
  if (!pr.width || pane.hidden) return;
  $$('.phone iframe[data-src]', rowsEl).forEach(function (f) {
    var r = f.parentNode.getBoundingClientRect();
    if (r.right > pr.left - 80 && r.left < pr.right + 80 && r.bottom > pr.top - 80 && r.top < pr.bottom + 80) {
      f.addEventListener('load', function () { sendTo(f); });
      f.src = f.getAttribute('data-src'); f.removeAttribute('data-src');
    }
  });
}
function scheduleVisible() { clearTimeout(visT); visT = setTimeout(loadVisible, 100); }
addEventListener('resize', scheduleVisible);

/* ---------- 크게 보기 ---------- */
var modal = $('#modal'), mframe = $('#mframe'), mbox = $('#mbox');
function sizeModal() {
  var s = Math.min(1, (innerHeight - 72) / MH, (innerWidth - 16) / MW);
  mframe.style.transform = s < 1 ? 'scale(' + s.toFixed(4) + ')' : '';
  mbox.style.width = Math.floor(MW * s) + 'px'; mbox.style.height = Math.floor(MH * s) + 'px';
  mbox.style.marginTop = '48px';
}
function openModal(file, title) {
  sizeModal(); $('#mtitle').textContent = title || '';
  mframe.src = file; modal.hidden = false; $('#mclose').focus();
}
function closeModal() { modal.hidden = true; mframe.removeAttribute('src'); }
mframe.addEventListener('load', function () { sendTo(mframe); });
$('#mclose').addEventListener('click', closeModal);
modal.addEventListener('click', function (e) { if (e.target === modal || e.target.id === 'mtitle') closeModal(); });
addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
addEventListener('resize', function () { if (!modal.hidden) sizeModal(); });

/* ---------- 탭 ---------- */
function showTab(name) {
  document.body.dataset.tab = name;
  $$('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === name)); });
  $$('.pane').forEach(function (p) { p.hidden = p.id !== name; });
  var f = $('#' + name + ' iframe.doc');
  if (f && f.hasAttribute('data-src')) {
    f.addEventListener('load', function () { sendTo(f); });
    f.src = f.getAttribute('data-src'); f.removeAttribute('data-src');
  }
  if (name === 'screens') scheduleVisible();
  try { history.replaceState(null, '', name === 'screens' ? location.pathname + location.search : '#' + name); } catch (e) {}
}
$$('.tab').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });

/* ---------- 팔레트: #tokens 교체 + 모든 iframe 에 postMessage + localStorage ---------- */
var KEY = 'hd-palette', cur = null;
function sendTo(f) { if (!cur) return; try { f.contentWindow.postMessage({type: 'hd-palette', slug: cur}, '*'); } catch (e) {} }
function setPalette(slug) {
  cur = slug;
  var l = $('#tokens'), base = l.getAttribute('data-base') || l.getAttribute('href');
  l.setAttribute('data-base', base);
  l.setAttribute('href', base.replace(/tokens(-[^/]*)?\.css$/, 'tokens-' + slug + '.css'));
  $$('iframe').forEach(sendTo);
  $$('.dot').forEach(function (d) { d.setAttribute('aria-pressed', String(d.dataset.slug === slug)); });
}
if (P && P.options && P.options.length) {
  var pal = $('.pal');
  pal.innerHTML = '<span class="pal-label">색</span>' + P.options.slice(0, 3).map(function (o) {
    return '<button class="dot" data-slug="' + esc(o.slug) + '" style="--dot:' + esc(o.brand) + '" aria-pressed="false" title="' +
      esc(o.name) + ' 색으로 보기' + (o.source ? ' — ' + esc(o.source) : '') + '" aria-label="' + esc(o.name) + ' 색으로 보기"><i></i><b>' + esc(o.name) + '</b></button>';
  }).join('');
  $$('.dot').forEach(function (d) {
    d.addEventListener('click', function () { setPalette(d.dataset.slug); try { localStorage.setItem(KEY, cur); } catch (e) {} });
  });
  var start = new URLSearchParams(location.search).get('p');
  try { start = start || localStorage.getItem(KEY); } catch (e) {}
  if (!start || !P.options.some(function (o) { return o.slug === start; })) start = P.default || P.options[0].slug;
  setPalette(start);
}

/* ---------- 시작 ---------- */
(function () {                                    // 판 위 글은 첫 배율에서 화면 폭에 들어오게
  var pw = pane.clientWidth, narrow = pw < 600;
  if (narrow) stage.classList.add('narrow');
  var left = narrow ? 12 : 24 + LEFT * Z0;
  var mw = Math.round((pw - left - 24) / Z0) + 'px';
  $('#intro').style.maxWidth = mw; $('#foot').style.maxWidth = mw;
})();
drawArrows();
home();
loadVisible();
var hashTab = (location.hash || '').slice(1);
if (hashTab === 'foundation' || hashTab === 'components') showTab(hashTab);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawArrows(); });
window.__hdReady = performance.now();
})();
</script>
</body>
</html>
