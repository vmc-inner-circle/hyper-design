<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>일정 고치기 · 시간 없음</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="day-edit.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">일정 고치기</h1><span></span></header>
<main class="page">
  <div class="field"><span class="label">종류</span>
    <div class="seg" role="radiogroup" aria-label="종류"><button class="seg-item" role="radio" aria-checked="false">이동</button><button class="seg-item" role="radio" aria-checked="false">숙박</button><button class="seg-item is-selected" role="radio" aria-checked="true">활동</button><button class="seg-item" role="radio" aria-checked="false">식사</button></div>
  </div>
  <div class="field"><span class="label">상태</span>
    <div class="seg" role="radiogroup" aria-label="상태"><button class="seg-item" role="radio" aria-checked="false">후보</button><button class="seg-item is-selected" role="radio" aria-checked="true">확정</button></div>
    <p class="info"><img src="../assets/fluent/eyes.svg" alt=""><span>확정하면 가족 화면에 바로 보여요</span></p>
  </div>
  <div class="field"><label class="label" for="n">이름</label><input class="input" id="n" type="text" value="호이안 올드타운·등불 배"></div>
  <div class="field"><label class="label" for="d">날짜</label><input class="input" id="d" type="text" value="12월 19일 토"></div>
  <div class="field is-error"><label class="label" for="t">시간</label><input class="input" id="t" type="text" value="" placeholder="시간을 골라 주세요"><p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>확정하려면 시간이 필요해요 · 후보로는 그대로 저장돼요</p></div>
  <div class="field"><label class="label" for="due">정할 날 · 선택</label><input class="input" id="due" type="text" value="12월 3일" placeholder="출발 2주 전"><p class="block-note">비워 두면 출발 2주 전</p></div>
  <div class="field"><label class="label" for="m">메모</label><input class="input" id="m" type="text" value="" placeholder="예약 확인번호나 챙길 것"></div>
  <a class="btn secondary full" href="day-edit.html">지우기</a>
</main>
<div class="cta"><button class="btn primary full" type="button">저장</button></div>
</body></html>
