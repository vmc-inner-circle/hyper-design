<!doctype html>
<html lang="ko" data-devices="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 흐름 (아직 확정 없음) — 제주 가족여행</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://unpkg.com/lucide@1.48.0"></script>
  <script src="../theme.js"></script>
</head>
<body class="bg-background text-foreground font-sans text-lg">
  <header data-id="view-top" class="px-4 pt-12 pb-2">
    <h1 class="text-2xl font-semibold">제주 가족여행</h1>
    <p class="text-base text-muted-foreground mt-1">11월 12일(목)~15일(일) · 출발까지 74일</p>
  </header>

  <main class="px-4 pt-3 pb-10 flex flex-col gap-5">
    <div data-id="empty-state" class="empty">
      <figure><i data-lucide="calendar-clock"></i></figure>
      <h2 class="text-xl font-semibold">아직 정해진 일정이 없어요</h2>
      <p class="text-base text-muted-foreground">지은 님이 일정을 짜고 있어요. 정해지는 대로 저녁 8시에 모아서 알려 드릴게요. 따로 물어보지 않으셔도 돼요.</p>
    </div>

    <section data-id="trip-facts" class="card">
      <section class="flex flex-col gap-3">
        <div><p class="text-base text-muted-foreground">언제</p><p class="text-xl font-semibold">11월 12일(목)부터 3박 4일</p></div>
        <div><p class="text-base text-muted-foreground">어디로</p><p class="text-xl font-semibold">제주</p></div>
        <div><p class="text-base text-muted-foreground">누구와</p><p class="text-xl font-semibold">6명 (지은, 준호, 수진, 서윤과 함께)</p></div>
      </section>
    </section>

    <a data-id="packing-line" href="view-packing.html" class="item min-h-14 text-lg" data-variant="outline">
      <i data-lucide="list" class="text-muted-foreground"></i>
      <div class="flex-1 min-w-0"><p class="text-lg font-semibold">미리 챙길 것 보기</p><p class="text-base text-muted-foreground">신분증, 평소 드시는 약</p></div>
      <i data-lucide="chevron-right" class="text-muted-foreground"></i>
    </a>
  </main>
</body>
</html>
