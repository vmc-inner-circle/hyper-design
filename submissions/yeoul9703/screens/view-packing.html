<!doctype html>
<html lang="ko" data-devices="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>챙길 것 — 제주 가족여행</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://unpkg.com/lucide@1.48.0"></script>
  <script src="../theme.js"></script>
</head>
<body class="bg-background text-foreground font-sans text-lg">
  <header data-id="view-header" class="sticky top-0 z-10 bg-background border-b border-border px-4 pt-12 pb-3 flex items-center gap-2">
    <a data-id="back-btn" data-back href="view-home.html" class="btn size-12" data-variant="ghost" data-size="icon" aria-label="뒤로"><i data-lucide="chevron-left"></i></a>
    <h1 class="text-xl font-semibold">챙길 것</h1>
  </header>

  <main class="px-4 pt-4 pb-10 flex flex-col gap-6">
    <section data-id="group-docs" class="flex flex-col gap-2">
      <h2 class="font-semibold">서류</h2>
      <ul class="flex flex-col divide-y divide-border rounded-lg border border-border">
        <li class="px-4 py-3"><p>신분증</p><p class="text-base text-muted-foreground">비행기 탈 때 꼭 필요해요</p></li>
        <li class="px-4 py-3"><p>운전면허증</p><p class="text-base text-muted-foreground">렌터카 운전하는 사람</p></li>
      </ul>
    </section>
    <section data-id="group-clothes" class="flex flex-col gap-2">
      <h2 class="font-semibold">옷</h2>
      <ul class="flex flex-col divide-y divide-border rounded-lg border border-border">
        <li class="px-4 py-3"><p>바람막이</p><p class="text-base text-muted-foreground">11월 제주는 바람이 세요</p></li>
        <li class="px-4 py-3"><p>편한 운동화</p></li>
        <li class="px-4 py-3"><p>흰 상의</p><p class="text-base text-muted-foreground">셋째 날 가족사진</p></li>
      </ul>
    </section>
    <section data-id="group-medicine" class="flex flex-col gap-2">
      <h2 class="font-semibold">약</h2>
      <ul class="flex flex-col divide-y divide-border rounded-lg border border-border">
        <li class="px-4 py-3"><p>평소 드시는 약 4일치</p></li>
        <li class="px-4 py-3"><p>멀미약</p></li>
      </ul>
    </section>
    <section data-id="group-etc" class="flex flex-col gap-2">
      <h2 class="font-semibold">기타</h2>
      <ul class="flex flex-col divide-y divide-border rounded-lg border border-border">
        <li class="px-4 py-3"><p>휴대폰 충전기</p></li>
        <li class="px-4 py-3"><p>보조배터리</p><p class="text-base text-muted-foreground">비행기에는 들고 타요</p></li>
        <li class="px-4 py-3"><p>서윤 카시트</p><p class="text-base text-muted-foreground">렌터카에 신청해 둠, 따로 안 챙겨도 돼요</p></li>
      </ul>
    </section>
  </main>
</body>
</html>
