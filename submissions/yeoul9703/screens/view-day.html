<!doctype html>
<html lang="ko" data-devices="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>첫째 날 — 제주 가족여행</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://unpkg.com/lucide@1.48.0"></script>
  <script src="../theme.js"></script>
</head>
<body class="bg-background text-foreground font-sans text-lg">
  <header data-id="view-header" class="sticky top-0 z-10 bg-background border-b border-border px-4 pt-12 pb-3 flex items-center gap-2">
    <a data-id="back-btn" data-back href="view-home.html" class="btn size-12" data-variant="ghost" data-size="icon" aria-label="뒤로"><i data-lucide="chevron-left"></i></a>
    <div class="flex-1 min-w-0">
      <h1 class="text-xl font-semibold">첫째 날</h1>
      <p class="text-base text-muted-foreground">11월 12일(목)</p>
    </div>
  </header>

  <main class="px-4 pt-4 pb-10 flex flex-col gap-3">
    <section data-id="stop-1" class="card">
      <section class="flex flex-col gap-1">
        <p class="text-2xl font-semibold">아침 8시</p>
        <p class="text-xl">김포공항 국내선 3층 B카운터 앞</p>
        <p class="text-base text-muted-foreground">모여서 함께 수속해요. 신분증을 꼭 챙겨 주세요.</p>
      </section>
    </section>
    <section data-id="stop-2" class="card">
      <section class="flex flex-col gap-1">
        <p class="text-2xl font-semibold">아침 9시 10분</p>
        <p class="text-xl">제주행 비행기 출발</p>
        <p class="text-base text-muted-foreground">10시 20분 제주공항 도착</p>
      </section>
    </section>
    <section data-id="stop-3" class="card">
      <section class="flex flex-col gap-1">
        <p class="text-2xl font-semibold">오전 11시 30분</p>
        <p class="text-xl">제주공항 렌터카하우스 5번 구역</p>
        <p class="text-base text-muted-foreground">차를 받아 서귀포로 가요</p>
      </section>
    </section>
    <section data-id="stop-4" class="card">
      <section class="flex flex-col gap-1">
        <p class="text-2xl font-semibold">오후 3시</p>
        <p class="text-xl">서귀포 바다정원 리조트</p>
        <p class="text-base text-muted-foreground">체크인하고 쉬어요. 서귀포시 칠십리로 00</p>
      </section>
    </section>

    <p data-id="day-note" class="text-base text-muted-foreground pt-2">이날 다른 일정은 정해지면 저녁 8시 소식으로 알려 드릴게요.</p>
  </main>
</body>
</html>
