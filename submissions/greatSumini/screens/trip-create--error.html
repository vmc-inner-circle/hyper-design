<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<title>여행 만들기 · 이름 비어 있음</title>
<link rel="stylesheet" href="../tokens.css">
<style>
.dates { display: flex; gap: var(--space-12); }
.dates > div { flex: 1; min-width: 0; }
.nights { margin-top: var(--space-8); }
</style>
</head>
<body class="has-cta">

<header class="appbar">
  <a class="icon-btn" href="planner-home.html" aria-label="뒤로">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
  <h1 class="appbar-title">여행 만들기</h1>
  <span class="icon-btn" aria-hidden="true"></span>
</header>

<main style="padding-top: var(--space-24);">
  <div class="field is-error">
    <label class="field-label" for="trip-name">여행 이름</label>
    <input class="input" id="trip-name" type="text" value="" placeholder="예: 엄마 환갑 교토·오사카 여행" aria-invalid="true" aria-describedby="trip-name-error">
    <p class="field-error" id="trip-name-error">여행 이름을 적어 주세요</p>
  </div>
  <div class="field">
    <span class="field-label">날짜</span>
    <div class="dates">
      <div>
        <label class="field-label muted" for="date-go">가는 날</label>
        <input class="input" id="date-go" type="text" value="12월 10일(목)" readonly>
      </div>
      <div>
        <label class="field-label muted" for="date-back">오는 날</label>
        <input class="input" id="date-back" type="text" value="12월 14일(월)" readonly>
      </div>
    </div>
    <p class="nights muted">4박 5일</p>
  </div>
</main>

<div class="bottom-cta">
  <a class="btn btn-primary block" href="invite-family.html">다음</a>
</div>

</body>
</html>
