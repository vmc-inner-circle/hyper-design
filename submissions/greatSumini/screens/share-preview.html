<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>함께가요 — 부모님께 보이는 모습</title>
<link rel="stylesheet" href="../tokens.css">
<style>
body { word-break: keep-all; }
.preview { --fs-sub: 17px; --fs-caption: 17px; padding: var(--space-24) 0 var(--space-12); }
.preview .big-title { padding: 0 var(--space-20) var(--space-8); }
.preview .badge { height: 28px; margin-bottom: var(--space-4); }
.lead { padding: var(--space-12) var(--space-8) 0; }
</style>
</head>
<body class="has-cta">
<header class="appbar">
  <a class="appbar-btn left" href="planner-day.html" aria-label="뒤로">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <h1>부모님께 보이는 모습</h1>
</header>
<main class="page">
  <p class="eyebrow lead">아버지·어머니 화면 그대로예요</p>

  <section class="block preview">
    <h2 class="big-title">11월 21일 토요일</h2>
    <div class="row">
      <span class="row-time">14:00</span>
      <div class="row-main">
        <span class="badge is-fixed">확정</span>
        <p class="row-title">섭지코지 산책</p>
        <p class="row-sub">해비치 호텔에서 차로 40분</p>
      </div>
    </div>
    <div class="row">
      <span class="row-time">오전<br>저녁</span>
      <div class="row-main">
        <span class="badge">정하는 중</span>
        <p class="row-title">지은이가 정하고 있어요</p>
        <p class="row-sub">11월 10일까지</p>
      </div>
    </div>
  </section>

  <section class="block is-list">
    <div class="row">
      <span class="row-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.6 6.6A16.5 16.5 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4.5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </span>
      <div class="row-main">
        <p class="row-title">후보 2개는 보이지 않아요</p>
        <p class="row-sub">우도 배편 · 흑돼지 '돈사돈'</p>
      </div>
    </div>
    <a class="row" href="parent-day.html">
      <span class="row-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <div class="row-main">
        <p class="row-title">부모님 화면으로 보기</p>
      </div>
      <svg class="row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </section>
</main>

<div class="cta-area">
  <a class="btn primary block-w" href="planner-day.html">확인했어요</a>
</div>

</body>
</html>
