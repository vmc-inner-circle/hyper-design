<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375">
<title>가족 초대</title>
<link rel="stylesheet" href="../tokens.css">
<style>
.lead { padding: var(--space-24) var(--space-20) var(--space-8); font-size: var(--fs-xl); font-weight: var(--fw-bold); line-height: 1.35; }
.note { padding: var(--space-12) var(--space-20) var(--space-24); border-top: 1px solid var(--gray-2); }
</style>
</head>
<body class="has-cta">

<header class="appbar">
  <a class="icon-btn" href="trip-create.html" aria-label="뒤로">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
  <h1 class="appbar-title">가족 초대</h1>
  <span class="icon-btn" aria-hidden="true"></span>
</header>

<main>
  <p class="lead">가족마다 볼 수 있는 범위를 정해 주세요</p>
  <ul class="list">
    <li class="row">
      <div class="row-body">
        <div class="row-title" id="m1">김영호 · 아빠</div>
        <div class="seg" role="radiogroup" aria-labelledby="m1" style="margin-top: var(--space-12);">
          <button class="seg-item" type="button" role="radio" aria-checked="false">함께 계획</button>
          <button class="seg-item" type="button" role="radio" aria-checked="true">보기만</button>
        </div>
      </div>
    </li>
    <li class="row">
      <div class="row-body">
        <div class="row-title" id="m2">박순자 · 엄마</div>
        <div class="seg" role="radiogroup" aria-labelledby="m2" style="margin-top: var(--space-12);">
          <button class="seg-item" type="button" role="radio" aria-checked="false">함께 계획</button>
          <button class="seg-item" type="button" role="radio" aria-checked="true">보기만</button>
        </div>
      </div>
    </li>
    <li class="row">
      <div class="row-body">
        <div class="row-title" id="m3">김민수 · 동생</div>
        <div class="seg" role="radiogroup" aria-labelledby="m3" style="margin-top: var(--space-12);">
          <button class="seg-item" type="button" role="radio" aria-checked="true">함께 계획</button>
          <button class="seg-item" type="button" role="radio" aria-checked="false">보기만</button>
        </div>
      </div>
    </li>
    <li class="row">
      <div class="row-body">
        <div class="row-title" id="m4">이하나 · 올케</div>
        <div class="seg" role="radiogroup" aria-labelledby="m4" style="margin-top: var(--space-12);">
          <button class="seg-item" type="button" role="radio" aria-checked="false">함께 계획</button>
          <button class="seg-item" type="button" role="radio" aria-checked="true">보기만</button>
        </div>
      </div>
    </li>
    <li class="row">
      <div class="row-body">
        <div class="row-title">김도윤 · 조카(6살)</div>
        <div class="row-sub">앱 없이 함께 가요</div>
      </div>
    </li>
  </ul>
  <p class="row-sub note">보기만: 확정된 일정과 내 준비만 보여요</p>
</main>

<div class="bottom-cta">
  <a class="btn btn-primary block" href="planner-home.html">초대 링크 보내기</a>
</div>

</body>
</html>
