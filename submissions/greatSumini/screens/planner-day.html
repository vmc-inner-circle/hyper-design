<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>함께가요 — 둘째 날 일정</title>
<link rel="stylesheet" href="../tokens.css">
<style>
body { word-break: keep-all; }
.day-chips { background: var(--gray-0); padding-bottom: var(--space-12); }
.day-list .row { gap: var(--space-8); padding-left: var(--space-8); }
.row-sub .badge { margin-right: var(--space-8); }
</style>
</head>
<body class="has-tab has-cta">
<header class="appbar">
  <a class="appbar-btn left" href="planner-home.html" aria-label="뒤로">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <h1>일정</h1>
</header>
<div class="chips day-chips" role="tablist" aria-label="날짜">
  <button class="chip" type="button" role="tab" aria-selected="false">11/20 금</button>
  <button class="chip is-selected" type="button" role="tab" aria-selected="true">11/21 토</button>
  <button class="chip" type="button" role="tab" aria-selected="false">11/22 일</button>
  <button class="chip" type="button" role="tab" aria-selected="false">11/23 월</button>
</div>
<main class="page">
  <section class="block is-list day-list">
    <h2 class="section-title">11월 21일 토요일</h2>
    <a class="row" href="item-edit.html">
      <span class="drag-handle" aria-label="끌어서 순서 바꾸기">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
        </span>
      <span class="row-time">09:30</span>
      <div class="row-main">
        <p class="row-title">우도 배편 (성산항)</p>
        <p class="row-sub"><span class="badge">후보</span>대안: 성산일출봉</p>
      </div>
      <svg class="row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="row" href="item-edit.html">
      <span class="drag-handle" aria-label="끌어서 순서 바꾸기">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
        </span>
      <span class="row-time">14:00</span>
      <div class="row-main">
        <p class="row-title">섭지코지 산책</p>
        <p class="row-sub"><span class="badge is-fixed">확정</span></p>
      </div>
      <svg class="row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="row" href="item-edit.html">
      <span class="drag-handle" aria-label="끌어서 순서 바꾸기">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
        </span>
      <span class="row-time">18:30</span>
      <div class="row-main">
        <p class="row-title">흑돼지 '돈사돈'</p>
        <p class="row-sub"><span class="badge">후보</span></p>
      </div>
      <svg class="row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </section>

  <section class="block is-list">
    <a class="row" href="share-preview.html">
      <span class="row-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <div class="row-main">
        <p class="row-title">부모님께는 '정하는 중'으로 보여요</p>
        <p class="row-sub">후보 2개 · 11월 10일까지 정해요</p>
      </div>
      <svg class="row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </section>
</main>

<div class="cta-area">
  <a class="btn primary block-w" href="item-edit.html">일정 추가</a>
</div>

<nav class="tabbar" aria-label="아래 메뉴">
  <a class="tab" href="planner-home.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
    홈
  </a>
  <a class="tab" href="planner-day.html" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
    일정
  </a>
  <a class="tab" href="tasks-all.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
    할 일
  </a>
</nav>

</body>
</html>
