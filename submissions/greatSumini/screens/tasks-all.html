<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>함께가요 — 할 일 나누기</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .check-row .row-title, .check-row .row-sub { display: block; }
  .block-link { padding: var(--space-4) var(--space-12) 0; }
</style>
</head>
<body class="has-tab has-cta">
<main class="page">
  <header class="block">
    <p class="eyebrow">제주 가족여행 · <span class="num">D-51</span></p>
    <h1 class="big-title">5가지 중 3가지 남았어요</h1>
  </header>

  <section class="block is-list">
    <h2 class="section-title">남은 일</h2>
    <button class="check-row" type="button" aria-pressed="false">
      <span class="check"></span>
      <span class="row-main"><span class="row-title">무릎 보호대·상비약</span><span class="row-sub">어머니 박정숙</span></span>
    </button>
    <button class="check-row" type="button" aria-pressed="false">
      <span class="check"></span>
      <span class="row-main"><span class="row-title">렌터카 추가 운전자 등록</span><span class="row-sub">김민수</span></span>
    </button>
    <button class="check-row" type="button" aria-pressed="false">
      <span class="check"></span>
      <span class="row-main"><span class="row-title">하윤이 카시트 요청</span><span class="row-sub">김지은</span></span>
    </button>
    <div class="block-link">
      <a class="btn text" href="my-tasks.html">어머니께는 이렇게 보여요</a>
    </div>
  </section>

  <section class="block is-list">
    <h2 class="section-title">끝난 일</h2>
    <button class="check-row is-done" type="button" aria-pressed="true">
      <span class="check is-selected"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="row-main"><span class="row-title">여행자 보험 가입</span><span class="row-sub">김지은</span></span>
    </button>
    <button class="check-row is-done" type="button" aria-pressed="true">
      <span class="check is-selected"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="row-main"><span class="row-title">신분증 챙기기</span><span class="row-sub">모두 챙겼어요</span></span>
    </button>
  </section>
</main>

<div class="cta-area">
  <button class="btn primary block-w" type="button">할 일 추가</button>
</div>

<nav class="tabbar" aria-label="아래 메뉴">
  <a class="tab" href="planner-home.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
    홈
  </a>
  <a class="tab" href="planner-day.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
    일정
  </a>
  <a class="tab" href="tasks-all.html" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
    할 일
  </a>
</nav>
</body>
</html>
