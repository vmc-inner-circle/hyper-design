<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>함께가요 · 부모 홈</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

:root {
  /* 색: 포인트 1 + 틴트 1 + 무채색 4 = 6 */
  --point: #FEE500;
  --tint: #FFF9C4;
  --gray-0: #FFFFFF;
  --gray-1: #F2F4F6;
  --gray-3: #4E5968;
  --gray-4: #191F28;

  /* 글자 크기 5종 */
  --fs-title: 26px;
  --fs-section: 20px;
  --fs-body: 18px;
  --fs-sub: 17px;
  --fs-tab: 12px;

  /* 여백 */
  --space-4: 4px;
  --space-8: 8px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;
  --space-40: 40px;

  /* 모서리 */
  --radius-badge: 6px;
  --radius-sm: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  /* 크기 */
  --row-h: 64px;
  --btn-h: 56px;
  --tab-h: 64px;
  --icon-circle: 40px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; }
a { color: inherit; text-decoration: none; }

html, body { background: var(--gray-1); }
body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.5;
  color: var(--gray-4);
  max-width: 375px;
  min-height: 812px;
  margin: 0 auto;
  overflow-x: hidden;
  padding-top: var(--space-12);
  padding-bottom: calc(var(--tab-h) + var(--btn-h) + var(--space-24) + var(--space-16));
}

main {
  display: flex;
  flex-direction: column;
  gap: var(--space-12);
  padding: 0 var(--space-12);
}

.section {
  background: var(--gray-0);
  border-radius: var(--radius-lg);
  padding: var(--space-16) var(--space-20);
}

/* 헤드라인 블록 */
.hero { padding: var(--space-24) var(--space-20); }
.trip {
  font-size: var(--fs-sub);
  font-weight: 600;
  color: var(--gray-3);
}
.trip strong { color: var(--gray-4); font-weight: 700; }
h1 {
  margin-top: var(--space-8);
  font-size: var(--fs-title);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.02em;
}
.hero-sub {
  margin-top: var(--space-12);
  font-size: var(--fs-body);
  color: var(--gray-3);
}

h2 {
  font-size: var(--fs-section);
  font-weight: 700;
  letter-spacing: -0.02em;
  padding-top: var(--space-4);
  padding-bottom: var(--space-4);
}

/* 목록 행 */
.row {
  display: flex;
  align-items: center;
  gap: var(--space-12);
  min-height: var(--row-h);
  padding: var(--space-8) 0;
}
.row-main { flex: 1; min-width: 0; }
.row-title {
  font-size: var(--fs-body);
  font-weight: 600;
  line-height: 1.4;
}
.row-sub {
  font-size: var(--fs-sub);
  color: var(--gray-3);
  line-height: 1.4;
}
.chev {
  flex: none;
  font-size: var(--fs-section);
  color: var(--gray-3);
}

.date {
  flex: none;
  width: 56px;
  font-size: var(--fs-sub);
  font-weight: 600;
  line-height: 1.3;
  color: var(--gray-4);
}
.date span { display: block; color: var(--gray-3); font-weight: 400; }

.icon-circle {
  flex: none;
  width: var(--icon-circle);
  height: var(--icon-circle);
  border-radius: var(--radius-pill);
  background: var(--gray-1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gray-4);
}

.badge {
  display: inline-block;
  font-size: var(--fs-sub);
  font-weight: 600;
  line-height: 1.3;
  padding: 0 var(--space-8);
  border-radius: var(--radius-badge);
  vertical-align: middle;
}
.badge-tint { background: var(--tint); color: var(--gray-4); }
.badge-gray { background: var(--gray-1); color: var(--gray-3); }
.row-main .badge { margin-top: var(--space-4); }

.news .row { padding: 0; }
.news .row-title { font-weight: 600; }

svg { display: block; }

/* 하단 고정 버튼 */
.cta-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: var(--tab-h);
  max-width: 375px;
  margin: 0 auto;
  padding: var(--space-12) var(--space-20);
  background: var(--gray-1);
}
.cta {
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--btn-h);
  border-radius: var(--radius-lg);
  background: var(--point);
  color: var(--gray-4);
  font-size: var(--fs-body);
  font-weight: 600;
}

/* 탭바 */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 375px;
  margin: 0 auto;
  height: var(--tab-h);
  background: var(--gray-0);
  border-top: 1px solid var(--gray-1);
  display: flex;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
  min-height: 44px;
  font-size: var(--fs-tab);
  font-weight: 600;
  color: var(--gray-3);
}
.tab[aria-current="page"] { color: var(--gray-4); }
</style>
</head>
<body>

<main>
  <!-- ① 다음 모일 곳: 부모, 앱 열 때마다 -->
  <section class="section hero">
    <p class="trip">제주 가족여행 · <strong>D-51</strong></p>
    <h1>11월 20일 금요일 아침 8시 30분, 김포공항에서 만나요</h1>
    <p class="hero-sub">김포공항 국내선 1층 대한항공 카운터 앞</p>
  </section>

  <!-- ② 새 소식: 변경을 보냈을 때만 -->
  <section class="section news">
    <a class="row" href="parent-news.html">
      <div class="row-main">
        <span class="badge badge-tint">새 소식</span>
        <p class="row-title">가는 비행기가 10:05로 바뀌었어요</p>
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>

  <!-- ③ 여행 흐름: 궁금할 때 -->
  <section class="section">
    <h2>여행 흐름</h2>
    <a class="row" href="parent-day.html">
      <p class="date">11/20<span>금</span></p>
      <div class="row-main">
        <p class="row-title">제주 도착 · 해비치 호텔</p>
        <span class="badge badge-tint">확정</span>
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </a>
    <a class="row" href="parent-day.html">
      <p class="date">11/21<span>토</span></p>
      <div class="row-main">
        <p class="row-title">섭지코지 산책 · 나머지는 정하는 중</p>
        <span class="badge badge-gray">정하는 중</span>
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </a>
    <a class="row" href="parent-day.html">
      <p class="date">11/22<span>일</span></p>
      <div class="row-main">
        <p class="row-title">정하는 중 · 11월 10일까지</p>
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </a>
    <a class="row" href="parent-day.html">
      <p class="date">11/23<span>월</span></p>
      <div class="row-main">
        <p class="row-title">집으로 돌아와요</p>
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>

  <!-- ④ 내 준비물: 출발 1~2주 전 -->
  <section class="section">
    <a class="row" href="my-tasks.html">
      <span class="icon-circle" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M9 13l2 2 4-4"/></svg>
      </span>
      <div class="row-main">
        <p class="row-title">내 준비물</p>
        <p class="row-sub">어머니 몫 2가지 중 1가지 남았어요</p>
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>
</main>

<div class="cta-wrap">
  <a class="cta" href="meet-point.html">모이는 곳 보기</a>
</div>

<nav class="tabbar">
  <a class="tab" href="parent-home.html" aria-current="page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5"/><path d="M15 6.5V20"/></svg>
    여행
  </a>
  <a class="tab" href="my-tasks.html">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/><path d="M4 18l1 1 2-2"/></svg>
    준비물
  </a>
  <a class="tab" href="parent-news.html">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
    소식
  </a>
</nav>

</body>
</html>
