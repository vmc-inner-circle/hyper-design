.bottom-cta > .row { gap: var(--sp-2); }
.bottom-cta > .row > .btn { flex: 1 1 0; width: auto; }
.bottom-cta > .text-sm, .bottom-cta > .text-xs { text-align: center; color: var(--c-text-2); }

/* ---- 아래 탭 (탭 화면에만 · 아이콘 + 11px 글자 · 지금 탭 = 본문 색, 나머지 = 흐린 회색) ---- */
.tabbar {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  height: var(--tabbar-h);
  padding: var(--sp-1) var(--sp-2) var(--sp-2);
  background: var(--m-card-bg);
  border-top: 1px solid var(--c-border);
  position: relative;
  z-index: var(--z-sticky);
}
.tabbar .nav-item {
  flex-direction: column;
  justify-content: center;
  gap: var(--sp-1);
  width: 100%;
  height: 100%;
  min-height: 0;
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: var(--c-text-muted);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  line-height: 1;
  text-align: center;
}
.tabbar .nav-item > span { flex: 0 0 auto; max-width: 100%; }
.tabbar .nav-item .icon { color: inherit; }
.tabbar .nav-item:hover { background: transparent; color: var(--c-text-2); }
.tabbar .nav-item:hover .icon { color: inherit; }
.tabbar .nav-item.active { background: transparent; color: var(--c-text); font-weight: var(--fw-semibold); }
.tabbar .nav-item.active .icon { color: var(--c-text); }
.tabbar .nav-item .badge { display: none; }

/* ---- 위 탭 메뉴 (시안 shell: top) — 서비스 이름 줄 아래 알약 탭. 지금 탭 = 주 색 테두리 + 연한 주 색 ---- */
.toptabs {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 0 var(--gutter) var(--sp-3);
  background: var(--m-page-bg);
  overflow-x: auto;
  overflow-y: hidden;
}
.toptabs .nav-item {
  width: auto;
  flex: 0 0 auto;
  gap: var(--sp-1);
  min-height: var(--ctl-sm);
  padding: 0 var(--sp-4);
  border: 1px solid var(--c-border);
  border-radius: var(--r-pill);
  background: var(--m-card-bg);
  color: var(--c-text-2);
  font-size: var(--fs-sm);
}
.toptabs .nav-item > span { flex: 0 0 auto; }
.toptabs .nav-item .icon { display: none; }
.toptabs .nav-item.active {
  border-color: var(--c-primary);
  background: var(--c-primary-soft);
  color: var(--c-primary-soft-fg);
}

/* ---- 메뉴 없는 한 장 (온보딩 · shell: none) — 위 여백을 넉넉히 ---- */
.app-mobile.no-nav .content { padding-top: var(--sp-12); }

/* ---- 안내·오류 문구(toast): 위 제목 줄 바로 아래, 양옆 꽉 차게 (기본 규칙 — 화면 위쪽 · 본문 크기 글자) ---- */
.app-mobile .toast, .app-mobile .toast-stack { top: calc(var(--appbar-h) + var(--sp-2)); left: var(--gutter); right: var(--gutter); translate: none; min-width: 0; max-width: none; }
.app-mobile .toast { padding: var(--sp-4); border: 0; }
/* 아래에 둘 때: 아래 탭·꽉 찬 버튼(아래 안내 한 줄 포함) 위로 — 가리지 않게 */
[data-toast-at="bottom"] .app-mobile .toast, [data-toast-at="bottom"] .app-mobile .toast-stack { top: auto; bottom: var(--sp-6); }
[data-toast-at="bottom"] .app-mobile:has(.tabbar) .toast, [data-toast-at="bottom"] .app-mobile:has(.tabbar) .toast-stack { bottom: calc(var(--tabbar-h) + var(--sp-3)); }
[data-toast-at="bottom"] .app-mobile:has(.bottom-cta) .toast, [data-toast-at="bottom"] .app-mobile:has(.bottom-cta) .toast-stack { bottom: calc(var(--ctl-lg) * 2 + var(--sp-10)); }


/* mobile/20-mobile-components.css */
/* mobile/20-mobile-components — 390 폭에서 어색한 web 컴포넌트를 고쳐 쓴다.
   카드는 회색 바탕 위 흰 판(테두리·그림자 없음, 안쪽 20), 묶음(.section)도 흰 판 하나(제목이 판 안에),
   여러 열 배치(grid-3·grid-4·split·form-grid)는 한 열로, 긴 글자는 줄바꿈. 토큰 변수만 참조한다. */

/* ---- 카드: 흰 판 ---- */
.app-mobile .card { background: var(--m-card-bg); }
.app-mobile .card-header {
  padding: var(--pad-card) var(--pad-card) 0;
  border-bottom: 0;
}
.app-mobile .card-title { font-size: var(--fs-lg); }
.app-mobile .card-body { gap: var(--sp-3); }
.app-mobile .card-footer { padding: 0 var(--pad-card) var(--pad-card); border-top: 0; }
.app-mobile .card-footer > .btn { flex: 1 1 0; }
.app-mobile .card-clickable:hover { box-shadow: none; border-color: transparent; }
.app-mobile .card.is-selected { border-color: var(--c-primary); }

/* ---- 묶음(.section) = 흰 판 하나. 제목·설명·내용이 모두 판 안에 ---- */
.app-mobile .section {
  margin-bottom: 0;
  padding: var(--pad-card);
  background: var(--m-card-bg);
  border-radius: var(--r-card);
}
.app-mobile .section-title { margin-bottom: var(--sp-3); font-size: var(--fs-lg); }
.app-mobile .section-title .link,
.app-mobile .section-title .btn { font-size: var(--fs-sm); font-weight: var(--fw-regular); color: var(--c-text-2); letter-spacing: var(--ls-body); }
.app-mobile .section-desc { margin: calc(var(--sp-2) * -1) 0 var(--sp-3); }
/* 묶음 안에 또 카드를 넣었으면 판을 겹치지 않고 줄로 나눈다 */
.app-mobile .section .card {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.app-mobile .section .card-header { padding: 0 0 var(--sp-2); }
.app-mobile .section .card-body { padding: 0; }
.app-mobile .section .card-footer { padding: var(--sp-3) 0 0; }
.app-mobile .section .card + .card { padding-top: var(--sp-3); border-top: 1px solid var(--c-border); }
.app-mobile .section .card > .list .list-item,
.app-mobile .section > .list .list-item { padding-left: 0; padding-right: 0; }
/* 판 안 맨 끝 목록은 아래 여백을 줄여 판과 붙인다 */
.app-mobile .card > .list .list-item:first-child { padding-top: var(--pad-card); }
.app-mobile .card > .list .list-item:last-child { padding-bottom: var(--pad-card); }
.app-mobile .section .card > .list .list-item:first-child { padding-top: var(--pad-row); }
.app-mobile .section .card > .list .list-item:last-child { padding-bottom: 0; }

/* ---- 여러 열 → 한 열 (2열은 숫자 둘을 나란히 둘 때만 남긴다) ---- */
.app-mobile .grid-3,
.app-mobile .grid-4 { grid-template-columns: minmax(0, 1fr); }
.app-mobile .span-2 { grid-column: auto; }
.app-mobile .grid-2 { gap: var(--sp-3); }
.app-mobile .form-grid { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
/* 좌 목록 / 우 자세히 는 모바일에서 두 화면으로 나눈다. 쓰였으면 위아래로 쌓는다 */
.app-mobile .split {
  display: flex;
  flex-direction: column;
  height: auto;
  border: 0;
  background: var(--m-card-bg);
}
.app-mobile .split-list { border-right: 0; border-bottom: 1px solid var(--c-border); overflow: visible; }
.app-mobile .split-detail { padding: var(--pad-card); overflow: visible; }

/* ---- 목록: 줄 위아래 12, 부제는 줄바꿈 ---- */
.app-mobile .list-item { min-height: var(--ctl-md); padding: var(--pad-row) var(--sp-4); align-items: flex-start; }
.app-mobile .list-item > .icon,
.app-mobile .list-item > .icon-sm { align-self: center; color: var(--c-text-muted); }
.app-mobile .list-title { white-space: normal; font-weight: var(--fw-semibold); }
.app-mobile .list-sub { white-space: normal; }
.app-mobile .list-meta { align-self: center; }
.app-mobile .list-actions { align-self: center; }
.app-mobile .list-icon { border-radius: var(--r-md); }

/* ---- 도구줄 · 검색: 꽉 차게, 넘치면 가로로 밀어 본다 ---- */
.app-mobile .toolbar { flex-wrap: nowrap; overflow-x: auto; margin-bottom: 0; }
.app-mobile .search { width: 100%; max-width: none; flex: 1 0 auto; }
.app-mobile .search > .input { background: var(--c-surface-2); border-color: transparent; }

/* ---- 칩: 한 줄로 가로 스크롤, 고른 칩 = 주 색 테두리 + 연한 주 색 ---- */
.app-mobile .chip-group { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; }
.app-mobile .chip { height: var(--ctl-sm); padding: 0 var(--sp-4); flex: 0 0 auto; }
.app-mobile .chip.active { border-color: var(--c-primary); background: var(--c-primary-soft); color: var(--c-primary-soft-fg); }

/* ---- 나눔 버튼(예정 · 대기 중 · 지난 수업): 고른 칸 = 주 색 테두리 + 연한 주 색 ---- */
.app-mobile .segmented { border-color: transparent; background: var(--c-surface-2); max-width: 100%; overflow-x: auto; }
.app-mobile .segmented-item { flex: 1 0 auto; font-size: var(--fs-sm); }
.app-mobile .segmented-item.active {
  border-color: var(--c-primary);
  background: var(--c-primary-soft);
  color: var(--c-primary-soft-fg);
  box-shadow: none;
}
.app-mobile .tabs { gap: 0; }
.app-mobile .tab { flex: 1 0 auto; justify-content: center; padding: 0 var(--sp-2); }

/* ---- 배지: 작고 연한 알약 ---- */
.app-mobile .badge { padding: 0 var(--sp-2); font-weight: var(--fw-semibold); }

/* ---- 숫자 카드 ---- */
.app-mobile .stat-value { font-size: var(--fs-2xl); }

/* ---- 입력: 손가락 크기, 버튼 줄은 위아래로 ---- */
.app-mobile .input, .app-mobile .select { height: var(--ctl-md); }
.app-mobile .field-inline { flex-direction: column; align-items: stretch; }
.app-mobile .form-actions {
  flex-direction: column-reverse;
  align-items: stretch;
  margin-top: var(--sp-4);
  padding-top: 0;
  border-top: 0;
}
.app-mobile .form-actions > .btn { width: 100%; height: var(--ctl-lg); }

/* ---- 안내 띠 · 빈 화면 ---- */
.app-mobile .banner { border-radius: var(--r-card); }
.app-mobile .empty { background: var(--m-card-bg); border-radius: var(--r-card); padding: var(--sp-10) var(--pad-card); }
.app-mobile .section .empty, .app-mobile .card .empty { background: transparent; padding: var(--sp-6) 0; }

/* ---- 모바일에 맞지 않는 것: 표 · 주간 시간표는 쓰지 않는다(lint). 쓰였으면 가로로 밀어 보게만 ---- */
.app-mobile .table-wrap { overflow-x: auto; }
.app-mobile .week-grid { overflow-x: auto; }
.app-mobile .day-strip-wide .day { flex: 0 0 auto; }   /* 7일 이상은 가로로 밀어 본다 */
.app-mobile .timeline-item { column-gap: var(--sp-2); }
.app-mobile .steps { overflow-x: auto; }


/* mobile/50-mobile-sheet.css */
/* mobile/50-mobile-sheet — 아래에서 올라오는 창(bottom sheet).
   모바일의 <x-modal>은 expand.js가 이 마크업으로 펼친다 (루트 클래스 .modal-backdrop은 그대로 — build·lint가 이걸로 찾는다):
     <div class="modal-backdrop sheet-backdrop">
       <div class="modal sheet" role="dialog">
         <span class="sheet-handle" aria-hidden="true"></span>
         <div class="modal-header"><div><h2 class="modal-title">…</h2><p class="modal-desc">…</p></div></div>
         <div class="modal-body">…</div>
         <div class="modal-footer">주 버튼 · 보조 버튼 (위아래로, 꽉 차게)</div>
       </div>
     </div>
   흐린 화면 위, 프레임 아래쪽에 붙는다. 위쪽 모서리만 둥글게. 토큰 변수만 참조한다. */

.modal-backdrop.sheet-backdrop {
  align-items: flex-end;
  justify-content: stretch;
  padding: 0;
}
.modal.sheet {
  width: 100%;
  max-width: none;
  max-height: var(--sheet-max-h);
  border: 0;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: var(--m-card-bg, var(--c-surface));
  box-shadow: var(--shadow-lg);
}
.sheet-handle {
  display: block;
  flex: 0 0 auto;
  width: var(--handle-w);
  height: var(--handle-h);
  margin: var(--sp-2) auto 0;
  border-radius: var(--r-pill);
  background: var(--c-border-strong);
}
.sheet .modal-header {
  padding: var(--sp-5) var(--gutter) var(--sp-2);
}
.sheet .modal-title {
  font-family: var(--font-head);
  font-size: var(--fs-xl);
  font-weight: var(--fw-head);
  letter-spacing: var(--ls-head);
}
.sheet .modal-desc { margin-top: var(--sp-2); font-size: var(--fs-md); line-height: var(--lh-normal); }
.sheet .modal-body { padding: var(--sp-2) var(--gutter) var(--sp-4); gap: var(--sp-3); }
.sheet .modal-body:empty { display: none; }
/* 바닥줄: 버튼을 위아래로 꽉 차게 — 주 버튼이 맨 위, 나머지(돌아가기 · 취소)는 그 아래 회색 */
.sheet .modal-footer {
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--gutter) var(--sp-6);
  border-top: 0;
}
.sheet .modal-footer > .btn {
  width: 100%;
  height: var(--ctl-lg);
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
}
.sheet .modal-footer > .btn-primary,
.sheet .modal-footer > .btn-danger { order: -1; }
.sheet .modal-footer > .btn-secondary,
.sheet .modal-footer > .btn-ghost { background: var(--c-surface-2); border-color: transparent; color: var(--c-text); }
.sheet .modal-footer .spacer,
.sheet .modal-footer .text-muted { margin-right: 0; text-align: center; font-size: var(--fs-sm); }
/* 확인 대화상자 모양(modal-center)도 아래 창에서는 왼쪽 정렬 그대로 둔다 */
.sheet.modal-center .modal-header,
.sheet.modal-center .modal-body { text-align: left; align-items: stretch; justify-content: flex-start; }

/* 창 안 목록은 판 가장자리까지 */
.sheet .modal-body > .list .list-item { padding-left: 0; padding-right: 0; }

/* ---- 그 밖의 창이 모바일에 쓰였을 때 (가운데 창 · 오른쪽 서랍) — 화면 폭에 맞춘다 ---- */
.app-mobile .modal-backdrop:not(.sheet-backdrop) { padding: var(--gutter); }
.app-mobile .modal:not(.sheet) { max-width: 100%; }
.app-mobile .drawer { width: 100%; }


/* canvas.css */
/* canvas.css — 하네스 크롬(보드·지도·따라가기 UI). `.hx-` 접두만 사용.
   화면 테마(data-theme)가 다크여도 크롬은 항상 라이트·중립: 자체 변수 --hxc-* 만 참조한다.
   화면 조각(프레임 안)은 테마 변수(--c-*)를 그대로 쓴다. */

:root {
  --hxc-bg: #F3F4F6;
  --hxc-surface: #FFFFFF;
  --hxc-surface-2: #F9FAFB;
  --hxc-surface-3: #EEF0F3;
  --hxc-border: #E5E7EB;
  --hxc-border-strong: #CBD0D6;
  --hxc-text: #111827;
  --hxc-text-2: #4B5563;
  --hxc-muted: #6B7280;
  --hxc-primary: #2563EB;
  --hxc-primary-soft: #EAF0FE;
  --hxc-rec: #0F766E;
  --hxc-rec-soft: #E3F4F1;
  --hxc-danger: #B91C1C;
  --hxc-danger-soft: #FEE2E2;
  --hxc-warn: #EA580C;
  --hxc-warn-soft: #FEF3C7;
  --hxc-dim: rgba(17, 24, 39, .55);
  --hxc-shadow: 0 4px 16px rgba(0, 0, 0, .08);
  --hxc-shadow-lg: 0 16px 48px rgba(0, 0, 0, .18);
  --hxc-r: 10px;
  --hxc-font: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --hxc-badge-size: 22px;
}

html[data-mode] body { background: var(--hxc-bg); color: var(--hxc-text); }
.hx-app {
  font-family: var(--hxc-font); font-size: 14px; line-height: 1.5; color: var(--hxc-text);
  min-height: 100vh; display: flex; flex-direction: column;
}
.hx-app * { box-sizing: border-box; }
:where(.hx-app) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }   /* :where — 클래스가 있는 버튼(.btn 등)이 항상 이기게 */
.hx-app input, .hx-app textarea { font: inherit; color: inherit; }
.hx-app h1, .hx-app h2, .hx-app h3, .hx-app p, .hx-app ul { margin: 0; }
.hx-app ul { padding: 0; list-style: none; }
.hx-app .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; display: block; }
.hx-app .icon-sm { width: 14px; height: 14px; }
.hx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- 공통 컨트롤 ---- */
.hx-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--hxc-border-strong); border-radius: 8px; background: var(--hxc-surface);
  color: var(--hxc-text); font-weight: 600; font-size: 13px; white-space: nowrap;
}
.hx-btn:hover { background: var(--hxc-surface-2); }
.hx-btn:disabled { opacity: .4; cursor: default; }
.hx-btn.hx-primary { background: var(--hxc-primary); border-color: var(--hxc-primary); color: #fff; }
.hx-btn.hx-primary:hover { filter: brightness(.95); }
.hx-btn.hx-icon-btn { width: 34px; padding: 0; justify-content: center; }
.hx-btn.hx-on { background: var(--hxc-primary-soft); border-color: var(--hxc-primary); color: var(--hxc-primary); }
.hx-app :focus-visible { outline: 2px solid var(--hxc-primary); outline-offset: 2px; }
.hx-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--hxc-border-strong); background: var(--hxc-surface); font-size: 13px; color: var(--hxc-text-2);
}
.hx-chip:hover { background: var(--hxc-surface-2); }
.hx-chip.hx-on { background: var(--hxc-text); border-color: var(--hxc-text); color: #fff; }
.hx-chip small { opacity: .7; font-size: 11px; }
.hx-tag {
  display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 18px;
  background: var(--hxc-surface-3); color: var(--hxc-text-2); vertical-align: middle;
}
.hx-tag.hx-rec { background: var(--hxc-rec-soft); color: var(--hxc-rec); white-space: nowrap; flex: 0 0 auto; }
.hx-tag.hx-role { background: var(--hxc-primary-soft); color: var(--hxc-primary); }
.hx-muted { color: var(--hxc-muted); }
.hx-why { color: var(--hxc-muted); font-size: 12px; }

/* ---- 번호 배지: 배율과 무관하게 항상 같은 픽셀 크기 ---- */
.hx-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: var(--hxc-badge-size); height: var(--hxc-badge-size); padding: 0 6px; border-radius: 999px;
  background: var(--hx-badge-bg, #FF3B30); color: var(--hx-badge-fg, #fff);
  font-family: var(--hxc-font); font-size: 13px; font-weight: 800; line-height: 1; letter-spacing: -.02em;
  box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0, 0, 0, .3); flex: 0 0 auto; vertical-align: middle;
}
.hx-badge.hx-badge-sm { --hxc-badge-size: 18px; font-size: 11px; padding: 0 4px; }

/* ---- 프레임: 원본 크기 스테이지를 scale, 오버레이는 scale 밖 ---- */
.hx-frame {
  position: relative; flex: 0 0 auto; overflow: hidden;
  background: var(--hxc-surface); border: 1px solid var(--hxc-border-strong); border-radius: 6px;
  box-shadow: var(--hxc-shadow);
}
.hx-stage {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  overflow: hidden; background: var(--c-bg); color: var(--c-text);
  font-family: var(--font-sans); font-size: var(--fs-md); line-height: var(--lh-normal);
}
.hx-screen { position: relative; width: 100%; height: 100%; overflow: hidden; }
.hx-screen-missing { display: grid; place-items: center; color: var(--hxc-danger); font-weight: 700; }
.hx-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: var(--z-badge, 900); }
.hx-bbox {
  position: absolute; pointer-events: auto; cursor: default;
  border: 2px solid var(--hx-bbox, rgba(255, 59, 48, .85)); background: var(--hx-bbox-fill, rgba(255, 59, 48, .06));
  border-radius: 4px; transition: box-shadow .15s, border-color .15s, background .15s;
}
.hx-bbox > .hx-badge { position: absolute; left: -8px; top: -8px; }
.hx-bbox.hx-on, .hx-bbox.hx-hover { border-color: var(--hx-badge-bg, #FF3B30); background: rgba(255, 59, 48, .16); box-shadow: 0 0 0 3px rgba(255, 59, 48, .25); }
.hx-frame-nobadge .hx-overlay, .hx-hide-badges .hx-overlay .hx-bbox:not(.hx-spot-on) { visibility: hidden; }
.hx-hide-badges .hx-overlay .hx-badge { visibility: hidden; }
/* 스포트라이트: 해당 bbox 밖을 큰 그림자로 어둡게 */
.hx-frame.hx-spot .hx-bbox { opacity: 0; }
.hx-frame.hx-spot .hx-bbox.hx-spot-on {
  opacity: 1; visibility: visible; background: transparent; border-color: var(--hx-badge-bg, #FF3B30);
  box-shadow: 0 0 0 4px rgba(255, 59, 48, .35), 0 0 0 100000px var(--hxc-dim);
}
.hx-frame.hx-spot .hx-bbox.hx-spot-on > .hx-badge { visibility: visible; transform: scale(1.25); transform-origin: 0 0; }

/* ---- 상단 바 ---- */
.hx-bar {
  position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 16px; background: var(--hxc-surface); border-bottom: 1px solid var(--hxc-border); min-height: 52px;
}
.hx-bar-title { font-size: 15px; font-weight: 800; margin-right: 4px; }
.hx-bar-title small { font-weight: 500; color: var(--hxc-muted); margin-left: 6px; font-size: 12px; }
.hx-tabs { display: inline-flex; padding: 3px; background: var(--hxc-surface-3); border-radius: 9px; gap: 2px; }
.hx-tab { height: 30px; padding: 0 14px; border-radius: 7px; font-weight: 600; color: var(--hxc-text-2); display: inline-flex; align-items: center; gap: 6px; }
.hx-tab[aria-selected="true"] { background: var(--hxc-surface); color: var(--hxc-text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.hx-bar-spacer { flex: 1; }
.hx-group { display: inline-flex; gap: 4px; align-items: center; }
.hx-zoom-val { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; color: var(--hxc-muted); font-size: 12px; }

/* ---- 모달 ---- */
.hx-modal { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 24px; }
.hx-modal-backdrop { position: absolute; inset: 0; background: rgba(17, 24, 39, .5); }
.hx-modal-panel {
  position: relative; display: flex; flex-direction: column; width: min(1600px, 100%); height: min(940px, 100%);
  background: var(--hxc-surface); border-radius: 14px; box-shadow: var(--hxc-shadow-lg); overflow: hidden;
  font-family: var(--hxc-font); font-size: 14px; color: var(--hxc-text);
}
.hx-modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hxc-border); }
.hx-modal-head h2 { font-size: 16px; font-weight: 800; }
.hx-modal-head .hx-purpose { color: var(--hxc-muted); font-size: 13px; margin-left: 4px; }
.hx-modal-body { display: flex; flex: 1; min-height: 0; }
.hx-modal-frame { flex: 1; min-width: 0; overflow: auto; background: var(--hxc-bg); padding: 20px; }
.hx-modal-side { width: 320px; flex: 0 0 320px; overflow: auto; border-left: 1px solid var(--hxc-border); padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }
.hx-side-h { font-size: 12px; font-weight: 700; color: var(--hxc-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.hx-region-li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; }
.hx-region-li.hx-on { background: var(--hxc-warn-soft); }
.hx-region-li b { font-weight: 600; }
.hx-step-btn { display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left; padding: 8px; border-radius: 8px; border: 1px solid var(--hxc-border); margin-bottom: 6px; }

/* ================= final: 지도 ================= */
.hx-map { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--hxc-bg); cursor: grab; touch-action: none; user-select: none;

/* 와이어플로우: 행 = 시나리오 하나. 행 배경을 아주 옅게 교차 */
.hx-wf-row { position: absolute; left: 0; top: 0; border-top: 1px solid var(--hxc-border); }
.hx-wf-row.hx-wf-alt { background: rgba(37, 99, 235, .035); }
.hx-wf-row.hx-wf-other { background: rgba(17, 24, 39, .03); }
.hx-wf-rail { position: absolute; left: 16px; top: 54px; right: 16px; z-index: 4; pointer-events: none; }
.hx-wf-head { position: static; padding: 6px 14px; display: inline-flex; flex-direction: row; align-items: center; gap: 10px; width: auto; max-width: 100%;
  background: var(--hxc-surface); border: 1px solid var(--hxc-border) !important; border-radius: 12px; box-shadow: var(--hxc-shadow);
  font-size: 13px; color: var(--hxc-text-2); overflow: hidden; border-top: 1px solid var(--hxc-border); }
.hx-wf-num { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--hxc-primary); color: #fff; font-size: 13px; font-weight: 800; }

.hx-wf-name { font-size: 18px; font-weight: 800; line-height: 1.3; color: var(--hxc-text); letter-spacing: -.01em; word-break: keep-all;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.hx-wf-head .hx-wf-meta { font-size: 12px; }
.hx-wf-meta { font-size: 13px; font-weight: 700; color: var(--hxc-muted); }
/* 시나리오 칩: 캔버스 왼쪽 위에 떠 있는 바 */
.hx-app .hx-wf-chips { position: absolute; left: 12px; top: 12px; right: 12px; z-index: 7; display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; }
.hx-app .hx-wf-chips::-webkit-scrollbar { display: none; }
.hx-app .hx-wf-chip { flex: 0 0 auto; }
.hx-app .hx-wf-chip { pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 6px; border-radius: 999px;
  background: var(--hxc-surface); border: 1px solid var(--hxc-border-strong); box-shadow: var(--hxc-shadow); font-size: 13px; font-weight: 700; color: var(--hxc-text-2); white-space: nowrap; }
.hx-app .hx-wf-chip b { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 999px; background: var(--hxc-surface-3); color: var(--hxc-text); font-size: 12px; }
.hx-app .hx-wf-chip:last-child:not(:first-child) { padding-left: 12px; }
.hx-app .hx-wf-chip:hover { color: var(--hxc-text); border-color: var(--hxc-primary); }
.hx-app .hx-wf-chip.hx-on { background: var(--hxc-primary); border-color: var(--hxc-primary); color: #fff; }

/* 단계 라벨 pill: 화살표 위, 노드 사이 틈 한가운데. 멀리서도 읽히게 역배율 */
.hx-wf-pills { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; pointer-events: none; }
.hx-wf-pill { position: absolute; transform: translate(-50%, calc(-100% - 6px)) scale(var(--hx-inv, 1)); transform-origin: 50% 100%;
  max-width: calc(var(--hx-gap, 240px) * .92 / var(--hx-inv, 1)); width: max-content; padding: 3px 10px; border-radius: 999px;
  background: #fff; color: var(--hx-arrow, #2563EB); border: 1.5px solid rgba(37, 99, 235, .35); box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
  font-size: 12px; font-weight: 600; line-height: 1.35; text-align: center; word-break: keep-all; transition: opacity .12s; }

.hx-wf-pill.hx-active { background: var(--hx-arrow, #2563EB); color: #fff; }

.hx-wf-pills.hx-has-sel .hx-wf-pill:not(.hx-sel):not(.hx-wf-pill-back) { opacity: .45; }
.hx-link-back { fill: none; stroke: #9CA3AF; stroke-width: calc(1.5px * var(--hx-inv-b, 1)); stroke-dasharray: 6 6; }
.hx-node-same { flex: 0 0 auto; padding: 0 6px; border-radius: 999px; background: var(--hxc-surface-3); color: var(--hxc-text-2); font-size: 11px; font-weight: 700; line-height: 18px; }
.hx-node-role { flex: 0 0 auto; font-size: 11px; font-weight: 700; color: var(--hxc-muted); }
.hx-node.hx-node-cur .hx-frame { box-shadow: 0 0 0 calc(4px * var(--hx-inv-b, 1)) var(--hxc-primary), 0 0 0 calc(10px * var(--hx-inv-b, 1)) rgba(37, 99, 235, .22), var(--hxc-shadow); }
.hx-bbox.hx-bbox-sel { border-width: calc(4px * var(--hx-inv-b, 1)); border-color: var(--hx-badge-bg, #FF3B30); box-shadow: 0 0 0 calc(4px * var(--hx-inv-b, 1)) rgba(255, 59, 48, .3); }
.hx-node { position: absolute; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
/* 노드 머리: 프레임 위에 떠 있고, 멀리서 볼수록 역배율로 커져 이름·번호가 읽힌다 */
.hx-node-head { position: absolute; left: 0; bottom: 100%; margin-bottom: calc(6px * var(--hx-inv, 1)); width: calc(100% / var(--hx-inv, 1));
  transform: scale(var(--hx-inv, 1)); transform-origin: 0 100%;
  display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.hx-node-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hx-node-tags { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.hx-node-tags:empty { display: none; }
.hx-node-purpose { font-size: 12px; color: var(--hxc-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hx-node:hover .hx-frame { border-color: var(--hxc-primary); box-shadow: 0 0 0 3px var(--hxc-primary-soft), var(--hxc-shadow); }
.hx-node:focus-visible { outline: none; }
.hx-node:focus-visible .hx-frame { box-shadow: 0 0 0 3px var(--hxc-primary); }
.hx-map .hx-bbox > .hx-badge { transform: scale(var(--hx-inv-b, 1)); transform-origin: 0 0; }
.hx-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 4; }
.hx-edge { fill: none; stroke: var(--hx-arrow, #2563EB); stroke-width: calc(2px * var(--hx-inv-b, 1)); pointer-events: none; transition: stroke .12s, opacity .12s; }
.hx-edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.hx-edges.hx-hover .hx-edge { stroke: var(--hx-arrow-muted, rgba(37, 99, 235, .35)); marker-end: url(#hx-arrow-muted); }
.hx-edges.hx-hover .hx-edge.hx-active { stroke: var(--hx-arrow, #2563EB); stroke-width: calc(3px * var(--hx-inv-b, 1)); marker-end: url(#hx-arrow-active); }
.hx-edges.hx-has-sel:not(.hx-hover) .hx-edge:not(.hx-sel), .hx-edges.hx-has-sel .hx-edge-dot:not(.hx-sel) { opacity: .28; }
.hx-edges.hx-has-sel:not(.hx-hover) .hx-edge.hx-sel { stroke-width: calc(3px * var(--hx-inv-b, 1)); }
.hx-edge-dot { fill: var(--hx-arrow, #2563EB); r: calc(4px * var(--hx-inv-b, 1)); }
/* 트리거 박스: 실제로 누르는 요소. 영역 bbox·배지보다 위 레이어 */
.hx-toverlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: calc(var(--z-badge, 900) + 1); }
.hx-tbox { position: absolute; pointer-events: none; border: calc(2px * var(--hx-inv-b, 1)) solid var(--hx-arrow, #2563EB); background: rgba(37, 99, 235, .08); border-radius: 4px; transition: box-shadow .12s, background .12s; }
.hx-tbox.hx-active { background: rgba(37, 99, 235, .2); box-shadow: 0 0 0 calc(3px * var(--hx-inv-b, 1)) rgba(37, 99, 235, .35); }
.hx-tbox > .hx-badge { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); }
.hx-tbox.hx-badge-left > .hx-badge { left: auto; right: calc(100% + 6px); }
.hx-frame.hx-spot .hx-tbox:not(.hx-spot-on) { opacity: 0; }
.hx-frame.hx-spot .hx-tbox.hx-spot-on { background: transparent; box-shadow: 0 0 0 4px rgba(37, 99, 235, .35), 0 0 0 100000px var(--hxc-dim); }
.hx-hide-flow .hx-map .hx-edges, .hx-hide-flow .hx-map .hx-tbox, .hx-hide-flow .hx-map .hx-wf-pills { display: none; }
/* 갈래: 흐름 밖의 버튼이 여는 화면·창 — 보라 점선 (본 흐름 파랑·돌아와서 회색과 구분) */
.hx-edge-branch { fill: none; stroke: var(--hx-branch, #7C3AED); stroke-width: calc(2px * var(--hx-inv-b, 1)); stroke-dasharray: calc(7px * var(--hx-inv-b, 1)) calc(6px * var(--hx-inv-b, 1)); pointer-events: none; }
.hx-edge-dot-branch { fill: var(--hx-branch, #7C3AED); }
.hx-edges.hx-hover .hx-edge-branch { opacity: .35; }

.hx-tbox.hx-tbox-branch.hx-active { background: rgba(124, 58, 237, .2); box-shadow: 0 0 0 calc(3px * var(--hx-inv-b, 1)) rgba(124, 58, 237, .3); }
.hx-frame.hx-spot .hx-tbox.hx-tbox-branch { opacity: 1; }
.hx-wf-pill-branch { color: var(--hx-branch, #7C3AED); border: 1px dashed rgba(124, 58, 237, .55); background: #FAF5FF; }
.hx-wf-pill-branch.hx-active { background: var(--hx-branch, #7C3AED); color: #fff; }
.hx-branch-tag { background: #F3E8FF; color: #6D28D9; }
.hx-node-branch .hx-frame { border-style: dashed; border-color: rgba(124, 58, 237, .45); }
.hx-tip { position: fixed; z-index: 2500; max-width: 320px; padding: 8px 10px; background: var(--hxc-text); color: #fff; border-radius: 8px; font-size: 12px; line-height: 1.45; pointer-events: none; box-shadow: var(--hxc-shadow-lg); }

.hx-tip div + div { margin-top: 4px; }

/* ================= final: 따라가기 ================= */
.hx-follow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.hx-flow-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--hxc-border); background: var(--hxc-surface); }
.hx-follow-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; }

.hx-dot.hx-done { background: var(--hxc-primary); opacity: .45; }

/* ================= board: 상단바 · 캔버스 · 오른쪽 패널 ================= */
html[data-mode="board"] .hx-app.hx-bd { height: 100vh; overflow: hidden; }
.hx-bd-bar { gap: 10px; }

.hx-bd-seg-btn { position: relative; height: 28px; min-width: 32px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--hxc-text-2); }

.hx-bd-copy { height: 36px; }
.hx-bd-main { flex: 1; min-height: 0; display: flex; }

.hx-bd-reopen { position: absolute; right: 12px; top: 56px; z-index: 8; display: none; box-shadow: var(--hxc-shadow); background: var(--hxc-primary); border-color: var(--hxc-primary); color: #fff; font-weight: 700; }

/* 하단 넘기기 바 */
.hx-bd-nav { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 6px;

/* 코치 팁 */
.hx-bd-coach { position: absolute; left: 12px; top: auto; bottom: 84px; z-index: 6; max-width: 380px; display: flex; gap: 6px; align-items: flex-start;
  background: var(--hxc-text); color: #fff; padding: 12px 6px 12px 14px; border-radius: 12px; box-shadow: var(--hxc-shadow-lg); font-size: 13px; line-height: 1.5; }

/* 캔버스 위 표시 상태 */
.hx-node.hx-node-sel .hx-frame { border-color: var(--hxc-primary); box-shadow: 0 0 0 calc(4px * var(--hx-inv-b, 1)) var(--hxc-primary), var(--hxc-shadow); }

/* 오른쪽 패널 */

.hx-bd-screen-head { display: flex; flex-direction: column; gap: 6px; }

/* 공용 입력 (패널) */
.hx-locked { padding: 10px 12px; border-radius: 8px; background: var(--hxc-surface-2); color: var(--hxc-text-2); font-weight: 600; }
.hx-radio { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0; }
.hx-radio input { width: 16px; height: 16px; margin: 0; accent-color: var(--hxc-primary); }
.hx-radio b { font-weight: 700; }
.hx-radio-group { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.hx-radio-col { flex-direction: column; gap: 0; }
.hx-radio-col .hx-radio { flex-wrap: wrap; }
.hx-radio-col .hx-radio .hx-why { flex-basis: 100%; padding-left: 24px; margin-top: -2px; }
.hx-ask { padding: 10px 0; border-top: 1px solid var(--hxc-border); }

.hx-rows { display: flex; flex-direction: column; gap: 8px; }

.hx-row-top { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.hx-row .hx-row-label { flex: 1; min-width: 0; font-weight: 700; }
.hx-row-why { margin-top: -4px; padding-left: 30px; }
.hx-row.hx-on { background: var(--hxc-warn-soft); border-color: #F59E0B; }
.hx-row.hx-sel { border-color: var(--hxc-primary); box-shadow: 0 0 0 2px var(--hxc-primary-soft); }

.hx-seg { display: flex; padding: 2px; background: var(--hxc-surface-3); border-radius: 8px; }
.hx-seg button { flex: 1; height: 28px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--hxc-text-2); }
.hx-seg button[aria-pressed="true"] { background: var(--hxc-surface); color: var(--hxc-text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.hx-seg button[aria-pressed="true"].hx-v-change { color: #B45309; }
.hx-seg button[aria-pressed="true"].hx-v-remove { color: var(--hxc-danger); }
.hx-memo { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--hxc-border-strong); border-radius: 8px; background: var(--hxc-surface); font-size: 13px; }
.hx-memo:focus { border-color: var(--hxc-primary); outline: none; }
.hx-check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }

@media (max-width: 1400px) {

}
@media (max-width: 900px) {
  .hx-modal-body { flex-direction: column; }
  .hx-modal-side { width: auto; flex: 0 0 auto; border-left: 0; border-top: 1px solid var(--hxc-border); }
  .hx-bd-panel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 7; width: min(360px, 100%); box-shadow: var(--hxc-shadow-lg); }

}
html[data-mode="final"] .hx-app.hx-final { height: 100vh; overflow: hidden; }

/* 패널: 인스턴스 맥락 */
.hx-bd-ctx { display: grid; gap: 4px; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--hxc-primary-soft); font-size: 13px; color: var(--hxc-text-2); }

/* 패널: 항목 집중 */
.hx-it-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.hx-badge.hx-badge-lg { --hxc-badge-size: 40px; font-size: 20px; flex: 0 0 auto; }
.hx-it-titles { min-width: 0; }
.hx-it-label { font-size: 20px; font-weight: 800; line-height: 1.3; }
.hx-it-where { margin-top: 2px; font-size: 12px; color: var(--hxc-muted); }
.hx-it-why { margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; background: var(--hxc-surface-2); border: 1px solid var(--hxc-border); font-size: 13px; color: var(--hxc-text-2); }
.hx-it-why-h { font-size: 11px; font-weight: 800; color: var(--hxc-muted); margin-bottom: 2px; }
.hx-app .hx-it-choices { display: grid; gap: 8px; margin-bottom: 14px; }
.hx-app .hx-it-choice { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--hxc-border-strong);

.hx-it-sub { font-size: 12px; font-weight: 700; color: var(--hxc-text-2); margin-bottom: 8px; }

.hx-it-all { width: 100%; justify-content: center; margin-top: 8px; }

/* 멀리서: 화살표 라벨은 "n단계"만 */

.hx-map-world.hx-zoom-far .hx-wf-pill.hx-active .hx-pill-act, .hx-map-world.hx-zoom-far .hx-wf-pill.hx-sel .hx-pill-act { display: inline; }

/* ===== 전체 흐름 (07-story.js) — 캔버스를 처음 열면 보이는 카드 목록 ===== */
.hx-story { position: absolute; inset: 0; overflow-y: auto; display: none; z-index: 3; padding: 64px 28px 110px; background: var(--hxc-bg, #F3F4F6); }
.hx-map.hx-mode-story .hx-story { display: block; }

.hx-story-intro { display: flex; flex-direction: column; gap: 4px; margin: 4px 4px 18px; }
.hx-story-intro b { font-size: 20px; font-weight: 800; color: var(--hxc-text); letter-spacing: -.01em; }
.hx-story-intro span { font-size: 14px; color: var(--hxc-text-2); }
.hx-story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }

  background: var(--hxc-surface, #fff); border: 1px solid var(--hxc-border); box-shadow: var(--hxc-shadow); transition: transform .12s, box-shadow .12s, border-color .12s; }

.hx-story-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hx-story-n { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: var(--hxc-primary); color: #fff; font-weight: 800; font-size: 14px; }
.hx-story-title { font-size: 18px; font-weight: 800; line-height: 1.35; color: var(--hxc-text); word-break: keep-all; min-height: 2.7em; }
.hx-story-thumb { border-radius: 10px; overflow: hidden; background: var(--hxc-surface-2); pointer-events: none; }
.hx-story-thumb .hx-frame { border-radius: 10px; box-shadow: none; }
.hx-story-path { display: flex; flex-wrap: wrap; gap: 4px 0; font-size: 13px; color: var(--hxc-text-2); line-height: 1.5; }

.hx-story-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--hxc-border); font-size: 13px; color: var(--hxc-muted); }
.hx-story-go { display: inline-flex; align-items: center; gap: 2px; color: var(--hxc-primary); font-weight: 800; }
.hx-story-go .icon, .hx-story-go svg { width: 16px; height: 16px; }
.hx-tag.hx-state { background: #FEF3C7; color: #92400E; }

/* ===== 보드 헤더 정리: 높이 32px로 통일, 세 컨트롤을 한 묶음으로 ===== */
.hx-bd-bar { flex-wrap: nowrap; min-height: 56px; height: 56px; padding: 0 16px; gap: 16px; }

.hx-bd-bar .hx-bar-title small { margin: 0; padding: 1px 8px; border-radius: 999px; background: var(--hxc-surface-3); color: var(--hxc-text-2); font-weight: 700; font-size: 11px; }

.hx-rec-tag { position: absolute; top: -9px; right: -4px; margin: 0; padding: 0 5px; font-size: 9px; line-height: 14px; border-radius: 999px; z-index: 1;
  background: var(--hxc-rec); color: #fff; box-shadow: 0 0 0 2px var(--hxc-surface); pointer-events: none; }

.hx-bd-viewtools { display: inline-flex; align-items: center; gap: 8px; }

/* ===== 의견 보내기 창 (23-board-send.js) ===== */

/* ===== 보드 두 탭: 사용 흐름 / 화면 디자인 (24-board-screens.js) ===== */

.hx-bd-tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--hxc-text-2); }

/* 사용 흐름: 번호·의견 창 없이 흐름만 */
.hx-bd .hx-map .hx-bbox { display: none !important; }
.hx-bd:not(.hx-tab-design) .hx-bd-panel, .hx-bd:not(.hx-tab-design) .hx-bd-reopen { display: none !important; }
.hx-bd .hx-map .hx-node { cursor: pointer; }
/* 화면 디자인 */
.hx-sd { display: none; }

.hx-bd.hx-tab-design .hx-sd { display: grid; grid-template-columns: 240px minmax(0, 1fr) 360px; height: calc(100vh - 56px); background: var(--hxc-bg); }
.hx-sd-list { overflow-y: auto; padding: 12px 10px 24px; border-right: 1px solid var(--hxc-border); background: var(--hxc-surface); display: flex; flex-direction: column; gap: 2px; }

.hx-sd-item .hx-badge { transform: scale(.85); flex: 0 0 auto; }

.hx-sd-name { flex: 1 1 auto; min-width: 0; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.35; }

.hx-sd-item .hx-tag { font-size: 10px; padding: 0 5px; flex: 0 0 auto; }
.hx-sd-dot { display: none; width: 8px; height: 8px; border-radius: 999px; background: var(--hxc-warn, #EA580C); flex: 0 0 auto; }
.hx-sd-item.hx-marked .hx-sd-dot { display: inline-block; }
.hx-sd-stage { overflow-y: auto; padding: 20px 28px 48px; }
.hx-sd-stage-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.hx-sd-stage-head h2 { font-size: 18px; font-weight: 800; margin: 0; flex: 1 1 auto; }
.hx-sd-frame { position: relative; }
.hx-sd-frame .hx-frame { border-radius: 10px; }
.hx-sd-frame .hx-frame, .hx-sd-frame .hx-frame * { cursor: crosshair; }
.hx-sd-removed .hx-sd-frame { opacity: .45; }
.hx-sd-all-hint { max-width: 520px; margin: 80px auto; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--hxc-text-2); line-height: 1.6; }
.hx-sd-all-hint b { font-size: 20px; color: var(--hxc-text); }
.hx-sd-side { overflow-y: auto; border-left: 1px solid var(--hxc-border); background: var(--hxc-surface); }
.hx-sd-all { display: none; }
.hx-sd.hx-sd-mode-all .hx-sd-all { display: block; }
.hx-sd.hx-sd-mode-all .hx-sd-screen { display: none; }
.hx-sd-all .hx-bd-panel { display: block !important; position: static; width: auto; height: auto; border: 0; box-shadow: none; }
.hx-sd-all .hx-bd-panel-head .hx-icon-btn { display: none; }
.hx-sd-screen { padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 14px; }
.hx-sd-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.hx-sd-purpose { margin: 6px 0 0; font-size: 13px; color: var(--hxc-text-2); line-height: 1.5; }
.hx-sd-flows { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hx-sd-k { width: 100%; font-size: 11px; font-weight: 800; color: var(--hxc-muted); }
.hx-sd-flow { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid var(--hxc-border-strong); font-size: 12px; font-weight: 700; color: var(--hxc-text-2); }
.hx-sd-flow b { display: inline-flex; width: 18px; height: 18px; align-items: center; justify-content: center; border-radius: 999px; background: var(--hxc-primary); color: #fff; font-size: 11px; }
.hx-sd-flow:hover { border-color: var(--hxc-primary); color: var(--hxc-primary); }
.hx-sd-h { font-size: 13px; font-weight: 800; color: var(--hxc-text); }
.hx-sd-editor { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--hxc-surface-2); }
.hx-sd-empty { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--hxc-text-2); line-height: 1.5; }
.hx-sd-empty svg { flex: 0 0 auto; margin-top: 2px; color: var(--hxc-primary); }
.hx-sd-picked-name { font-size: 16px; font-weight: 800; color: var(--hxc-text); word-break: keep-all; }

.hx-sd-picked-acts { display: flex; gap: 6px; margin-top: 8px; }
.hx-sd-picked-acts .hx-btn { height: 28px; font-size: 12px; }
.hx-sd-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hx-sd-choice { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border-radius: 10px; border: 1px solid var(--hxc-border-strong); background: var(--hxc-surface); font-size: 14px; font-weight: 700; color: var(--hxc-text); }
.hx-sd-choice svg { width: 16px; height: 16px; }
.hx-sd-choice.hx-v-change[aria-pressed="true"] { background: #FFF7ED; border-color: var(--hxc-warn, #EA580C); color: #9A3412; }
.hx-sd-choice.hx-v-remove[aria-pressed="true"] { background: var(--hxc-surface-3); border-color: #6B7280; color: var(--hxc-text); }
.hx-sd-change { display: flex; flex-direction: column; gap: 8px; }
.hx-sd-memo { width: 100%; }
.hx-sd-del { align-self: flex-start; height: 28px; font-size: 12px; color: var(--hxc-muted); }
.hx-sd-pins { display: flex; flex-direction: column; gap: 6px; }
.hx-sd-pinrow { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 8px; border-radius: 10px; border: 1px solid var(--hxc-border); background: var(--hxc-surface); }
.hx-sd-pinrow:hover { border-color: var(--hxc-primary); }
.hx-sd-pinrow-t { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--hxc-text-2); min-width: 0; }
.hx-sd-pinrow-t b { font-size: 13px; color: var(--hxc-text); }
.hx-sd-screen-opts { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--hxc-border); }
/* 고르기 표시: 마우스 올린 곳(파란 테두리+이름표), 고른 곳(굵은 테두리), 의견 핀 */
.hx-pick-hov { position: absolute; pointer-events: none; border: 2px solid var(--hx-arrow, #2563EB); background: rgba(37, 99, 235, .06); border-radius: 3px; z-index: 5; }
.hx-pick-lab { position: absolute; pointer-events: none; z-index: 6; padding: 2px 8px; border-radius: 6px; background: var(--hx-arrow, #2563EB); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.hx-pick-sel { position: absolute; pointer-events: none; border: 3px solid var(--hxc-warn, #EA580C); border-radius: 4px; box-shadow: 0 0 0 4px rgba(234, 88, 12, .2); z-index: 5; }
.hx-pick-pins { position: absolute; inset: 0; pointer-events: none; z-index: 7; }
.hx-pin { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #fff; background: var(--hxc-warn, #EA580C); box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0, 0, 0, .25); flex: 0 0 auto; }
.hx-pick-pins .hx-pin { position: absolute; pointer-events: auto; cursor: pointer; }
.hx-pin.hx-pin-remove { background: #6B7280; }
.hx-pin.hx-on { transform: scale(1.2); }

/* 지금까지 남긴 의견: 항목별 지우기 · 모두 지우기 */
.hx-bd-markrow { display: flex; align-items: center; gap: 4px; }
.hx-bd-markrow > .hx-bd-mark { flex: 1 1 auto; min-width: 0; }
.hx-mark-del { width: 28px !important; height: 28px !important; color: var(--hxc-muted); flex: 0 0 auto; }
.hx-mark-del:hover { color: var(--hxc-danger, #DC2626); }
.hx-bd-reset { margin-top: 8px; height: 30px; font-size: 12px; color: var(--hxc-muted); }
.hx-bd-reset.hx-armed { color: #fff; background: var(--hxc-danger, #DC2626); border-color: var(--hxc-danger, #DC2626); }

/* 아이콘 바꾸기 (24-board-screens.js) */
.hx-ip { display: flex; flex-direction: column; gap: 8px; }
.hx-ip-search { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--hxc-border-strong); border-radius: 8px; background: var(--hxc-surface); font-size: 13px; }
.hx-ip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; max-height: 220px; overflow-y: auto; padding: 2px; }
.hx-ip-item { display: inline-flex; align-items: center; justify-content: center; height: 38px; border-radius: 8px; border: 1px solid transparent; background: var(--hxc-surface); color: var(--hxc-text); }
.hx-ip-item svg { width: 20px; height: 20px; }
.hx-ip-item:hover { border-color: var(--hxc-primary); color: var(--hxc-primary); }
.hx-ip-item.hx-on { border-color: var(--hxc-warn, #EA580C); background: #FFF7ED; color: #9A3412; }

/* 분위기(이름 + 미리보기) · 버튼 색(색 조각) — 22-board-canvas.js */
.hx-bd-look { gap: 6px; padding: 0 10px; }
.hx-look-dot { position: relative; display: inline-block; width: 16px; height: 16px; border-radius: 999px; overflow: hidden; flex: 0 0 auto; }
.hx-look-dot > span { position: absolute; right: 0; bottom: 0; width: 8px; height: 8px; border-radius: 999px 0 0 0; }
.hx-bd-swatches { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px; }
.hx-sw { position: relative; width: 22px; height: 22px; border-radius: 999px; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); cursor: pointer; }
.hx-sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--hxc-surface), 0 0 0 4px var(--sw); }
.hx-sw .hx-rec-tag { top: -12px; right: -10px; }
.hx-bd-swname { font-size: 12px; font-weight: 700; color: var(--hxc-text-2); min-width: 48px; white-space: nowrap; }

/* 화면 느낌: 상단바 버튼 하나 + 아래로 열리는 창 */
.hx-feel-wrap { position: relative; }
.hx-feel-btn { gap: 8px; max-width: 360px; }
.hx-feel-k { font-weight: 800; }
.hx-feel-sum { font-weight: 600; color: var(--hxc-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hx-feel { display: none; position: absolute; top: 40px; left: 0; z-index: 2000; width: 420px; padding: 16px; border-radius: 14px;
  background: var(--hxc-surface); border: 1px solid var(--hxc-border); box-shadow: var(--hxc-shadow-lg, 0 12px 32px rgba(0,0,0,.16)); flex-direction: column; gap: 16px; }
.hx-feel.hx-open { display: flex; }
.hx-feel-h { display: flex; flex-direction: column; gap: 2px; }
.hx-feel-h b { font-size: 15px; }
.hx-feel-h span { font-size: 12px; color: var(--hxc-muted); }
.hx-feel .hx-bd-ctl { flex-direction: column; align-items: stretch; gap: 8px; padding: 0 !important; border: 0 !important; }
.hx-feel .hx-bd-ctl-l { font-size: 12px; }
.hx-feel .hx-bd-looks { flex-direction: column; height: auto; gap: 6px; background: none; padding: 0; }
.hx-feel .hx-bd-look { height: auto; min-height: 52px; justify-content: flex-start; gap: 12px; padding: 10px 12px; border: 1px solid var(--hxc-border); border-radius: 10px; background: var(--hxc-surface); text-align: left; }
.hx-feel .hx-bd-look[aria-pressed="true"] { border-color: var(--hxc-primary); box-shadow: 0 0 0 2px var(--hxc-primary-soft); }
.hx-feel .hx-look-dot { width: 28px; height: 28px; }
.hx-feel .hx-look-dot > span { width: 13px; height: 13px; }
.hx-look-t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hx-look-t b { font-size: 13px; }
.hx-look-t small { font-size: 11px; font-weight: 500; color: var(--hxc-muted); white-space: normal; }
.hx-feel .hx-bd-look .hx-rec-tag { position: static; margin-left: auto; box-shadow: none; }
.hx-feel .hx-bd-seg { align-self: flex-start; }
.hx-feel .hx-bd-swatches { gap: 10px; height: auto; padding: 4px 2px; }
.hx-feel .hx-sw { width: 30px; height: 30px; }
.hx-feel .hx-bd-locked { align-self: flex-start; }
.hx-feel .hx-bd-looks { align-items: stretch; }
.hx-feel .hx-bd-look { width: 100%; margin: 0; }

/* 최종본: 화면 모음 탭 (11-final-screens.js) — 화면 디자인 탭 레이아웃 재사용 */
.hx-final .hx-map .hx-bbox { display: none !important; }
.hx-final .hx-sd.hx-fs { display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; height: calc(100vh - 53px); background: var(--hxc-bg); }
.hx-fs-count { margin: 4px 6px 0; font-size: 12px; font-weight: 800; color: var(--hxc-text-2); }
.hx-fs-outs { display: flex; flex-direction: column; gap: 6px; }
.hx-fs-out { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--hxc-border); background: var(--hxc-surface); font-size: 12px; color: var(--hxc-text-2); }
.hx-fs-out b { font-size: 13px; color: var(--hx-arrow, #2563EB); }
.hx-fs-out:hover { border-color: var(--hx-arrow, #2563EB); }
.hx-final .hx-sd-frame .hx-frame, .hx-final .hx-sd-frame .hx-frame * { cursor: default; }

/* 최종본: 화면 전체 탭 (11-final-all.js) — Figma 페이지처럼 대지 나열 */
.hx-all { overflow-y: auto; height: calc(100vh - 53px); padding: 28px 32px 64px; background: var(--hxc-bg, #F3F4F6); }
.hx-all-intro { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
.hx-all-intro b { font-size: 20px; font-weight: 800; }
.hx-all-intro span { font-size: 14px; color: var(--hxc-text-2); }
.hx-all-sec { margin-bottom: 36px; }
.hx-all-sec h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 14px; font-size: 16px; font-weight: 800; }
.hx-all-sec h2 small { font-size: 12px; font-weight: 700; color: var(--hxc-muted); }
.hx-all-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
.hx-all-card { display: flex; flex-direction: column; gap: 8px; color: inherit; text-decoration: none; }
.hx-all-head { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.hx-all-n { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 700; color: var(--hxc-muted); }
.hx-all-open { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--hx-arrow, #2563EB); opacity: 0; transition: opacity .12s; }
.hx-all-card:hover .hx-all-open, .hx-all-card:focus-visible .hx-all-open { opacity: 1; }
.hx-all-frame { border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); transition: box-shadow .12s, transform .12s; pointer-events: none; }
.hx-all-card:hover .hx-all-frame { box-shadow: 0 0 0 3px var(--hx-arrow, #2563EB), 0 8px 24px rgba(0, 0, 0, .15); transform: translateY(-2px); }
.hx-all-purpose { margin: 0; font-size: 12px; color: var(--hxc-muted); line-height: 1.5; }

/* 최종본: 화면 전체 캔버스 (11-final-all.js) — Figma처럼 실제 크기 대지 + 확대·축소·이동 */
.hx-cv { position: relative; overflow: hidden; height: calc(100vh - 53px); cursor: grab; outline: none;
  background-color: #E9EAEE; background-image: radial-gradient(#CDD0D6 1px, transparent 1px); background-size: 24px 24px; }
.hx-cv.hx-dragging { cursor: grabbing; }
.hx-cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; --hx-inv: 1; }
.hx-cv-world.hx-anim { transition: transform .25s ease; }
.hx-cv-tools { position: absolute; left: 16px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 4px; padding: 4px 6px;
  background: var(--hxc-surface); border: 1px solid var(--hxc-border); border-radius: 10px; box-shadow: var(--hxc-shadow); }
.hx-cv-tools .hx-btn { height: 30px; }
.hx-cv-hint { margin-left: 8px; font-size: 12px; color: var(--hxc-muted); white-space: nowrap; }
.hx-cv-sec { position: absolute; display: flex; align-items: baseline; gap: 16px; transform: scale(var(--hx-inv)); transform-origin: 0 100%; margin-top: -40px; }
.hx-cv-sec b { font-size: 26px; font-weight: 800; color: var(--hxc-text); }
.hx-cv-sec span { font-size: 16px; font-weight: 700; color: var(--hxc-muted); }
.hx-cv-label { position: absolute; display: flex; align-items: center; gap: 8px; transform: translateY(-100%) scale(var(--hx-inv)); transform-origin: 0 100%; white-space: nowrap; font-size: 14px; }
.hx-cv-n { font-family: var(--font-mono, monospace); font-weight: 700; color: var(--hxc-muted); }
.hx-cv-open { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px; padding: 2px 8px; border-radius: 999px; background: var(--hx-arrow, #2563EB); color: #fff; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; }
.hx-cv-open:hover { filter: brightness(1.1); }
.hx-cv-board { position: absolute; width: 1280px; cursor: zoom-in; border-radius: 4px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); background: #fff; }
.hx-cv-board:hover { box-shadow: 0 0 0 4px var(--hx-arrow, #2563EB), 0 2px 10px rgba(0, 0, 0, .12); }
.hx-cv-board .hx-frame { border: 0; border-radius: 4px; box-shadow: none; }
.hx-cv-board .hx-frame, .hx-cv-board .hx-frame * { pointer-events: none; }
/* 갈래 노드는 화살표가 위에서 들어오므로 이름표를 화면 아래에 */
.hx-node-branch .hx-node-head { bottom: auto; top: 100%; margin-bottom: 0; margin-top: calc(6px * var(--hx-inv, 1)); transform-origin: 0 0; }

/* ---------- 시안 비교 탭 (25-board-concepts.js) ---------- */
.hx-cc { display: none; }
.hx-bd.hx-tab-concept .hx-bd-main, .hx-bd.hx-tab-concept .hx-bd-viewtools, .hx-bd.hx-tab-concept .hx-sd { display: none !important; }
.hx-bd.hx-tab-concept .hx-cc { display: block; height: calc(100vh - 56px); overflow-y: auto; background: var(--hxc-bg); padding: 20px 24px 64px; }
.hx-cc-intro { display: flex; flex-direction: column; gap: 2px; margin: 0 auto 16px; max-width: 1760px; }
.hx-cc-intro b { font-size: 18px; font-weight: 800; }
.hx-cc-intro span { color: var(--hxc-text-2); }
.hx-cc-h { font-size: 13px; font-weight: 800; color: var(--hxc-text-2); margin-bottom: 8px; }
.hx-cc-refs { max-width: 1760px; margin: 0 auto 20px; }
.hx-cc-refgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.hx-cc-ref { padding: 10px 12px; border: 1px solid var(--hxc-border); border-radius: var(--hxc-r); background: var(--hxc-surface); }
.hx-cc-ref-top { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.hx-cc-ref-top a, .hx-cc-from-row a { color: var(--hxc-primary); font-weight: 700; text-decoration: none; }
.hx-cc-ref-top a:hover, .hx-cc-from-row a:hover { text-decoration: underline; }
.hx-cc-ref-borrow { margin-top: 4px; font-size: 12px; color: var(--hxc-text-2); word-break: keep-all; }
.hx-cc-cols { display: flex; flex-direction: column; gap: 16px; max-width: 1760px; margin: 0 auto; }
.hx-cc-memo { width: 100%; min-height: 52px; font-size: 13px; }
/* 시안 하나 = 한 줄: 왼쪽 설명·고르기·메모 / 오른쪽 메인 화면들을 가로로 (넘치면 가로 스크롤) */
.hx-cc-col { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; padding: 14px; border: 2px solid var(--hxc-border); border-radius: 14px; background: var(--hxc-surface); align-items: start; }
.hx-cc-col.hx-on { border-color: var(--hxc-primary); box-shadow: 0 0 0 4px var(--hxc-primary-soft); }
.hx-cc-head { display: flex; flex-direction: column; gap: 8px; }
.hx-cc-top { display: flex; align-items: center; gap: 6px; }
.hx-cc-id { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--hxc-text); color: #fff; font-size: 12px; font-weight: 800; }
.hx-cc-name { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3; word-break: keep-all; }
.hx-cc-why { margin: 0; color: var(--hxc-text-2); word-break: keep-all; }
.hx-cc-traits { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.hx-cc-traits li { padding: 1px 8px; border-radius: 999px; background: var(--hxc-surface-3); font-size: 12px; font-weight: 700; color: var(--hxc-text-2); }
.hx-cc-from { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--hxc-surface-2); font-size: 12px; color: var(--hxc-text-2); }
.hx-cc-from-h { font-weight: 800; color: var(--hxc-muted); }
.hx-cc-pick { justify-content: center; height: 36px; }
.hx-cc-col.hx-on .hx-cc-pick { background: var(--hxc-primary); border-color: var(--hxc-primary); color: #fff; }
.hx-cc-shots { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
.hx-cc-shot { flex: 0 0 560px; display: flex; flex-direction: column; gap: 4px; }
html[data-platform="mobile"] .hx-cc-shot { flex-basis: 300px; }   /* 모바일 시안: 휴대폰 화면 폭에 맞춰 여러 장이 한눈에 */
html[data-platform="mobile"] .hx-cc-shot-frame { border-radius: 20px; }
.hx-cc-shot-name { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font-size: 12px; font-weight: 700; color: var(--hxc-muted); cursor: zoom-in; }
.hx-cc-shot-name:hover { color: var(--hxc-primary); }
.hx-cc-shot-frame { width: 100%; border-radius: 8px; overflow: hidden; }
.hx-cc-shot-frame .content { scrollbar-width: thin; }
.hx-cc-zoom { display: block; overflow: auto; padding: 16px; }

.hx-cc-right { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.hx-cc-shots-h { font-size: 12px; font-weight: 700; color: var(--hxc-muted); }

/* ---- 사용 흐름 = 구역 보드 (08-sections.js) — 디자이너 보드처럼 어두운 캔버스 위에 화면 · 이름표 · 정책 메모 ----
   world 좌표는 화면 실제 크기. --k = 이름표·메모 글자 배율(웹 2.2 · 모바일 1) */
.hx-sx { background: #FFFFFF; }   /* 흰 캔버스 (사용자 요청: "이전처럼 흰색으로") */
.hx-sx .hx-cv-world { color: var(--hxc-text); }
.hx-sx-band { position: absolute; height: calc(64px * var(--k)); display: flex; align-items: center; gap: calc(16px * var(--k)); padding: 0 calc(24px * var(--k));
  background: var(--hxc-surface-3); color: var(--hxc-text); border-radius: calc(6px * var(--k)); }
.hx-sx-band b { font-size: calc(26px * var(--k)); font-weight: 800; letter-spacing: -0.02em; }
.hx-sx-band span { font-size: calc(15px * var(--k)); font-weight: 600; color: var(--hxc-muted); }
.hx-sx-band .hx-sx-band-desc { font-style: normal; font-size: calc(17px * var(--k)); font-weight: 500; color: var(--hxc-text-2); white-space: nowrap; }
.hx-sx-step { position: absolute; height: calc(36px * var(--k)); display: flex; align-items: center; padding: 0 calc(14px * var(--k));
  background: var(--hxc-text); color: #FFFFFF; border-radius: calc(6px * var(--k)); font-size: calc(15px * var(--k)); font-weight: 700; white-space: nowrap; letter-spacing: -0.01em; }
.hx-sx-label { position: absolute; display: flex; align-items: center; gap: calc(8px * var(--k)); min-height: calc(34px * var(--k)); white-space: nowrap; line-height: 1.35;
  font-size: calc(13px * var(--k)); color: var(--hxc-muted); }
.hx-sx-label b { color: var(--hxc-text); font-weight: 600; }
.hx-sx-n { font-family: var(--font-mono, monospace); font-weight: 700; color: var(--hxc-muted); }
.hx-sx-state { padding: calc(2px * var(--k)) calc(8px * var(--k)); border-radius: 999px; font-size: calc(11px * var(--k)); font-weight: 700; background: var(--hxc-surface-3); color: var(--hxc-text-2); }
.hx-sx-state.hx-st-error { background: var(--hxc-danger-soft); color: var(--hxc-danger); }
.hx-sx-state.hx-st-success { background: #DCF2E3; color: #1F6B3A; }
.hx-sx-marks { display: inline-flex; gap: calc(6px * var(--k)); }
.hx-sx-mark { padding: calc(2px * var(--k)) calc(8px * var(--k)); border-radius: 999px; font-size: calc(11px * var(--k)); font-weight: 700; background: #F59E0B; color: #1C1C1C; }
.hx-sx-mark-removed { background: #6B7280; color: #fff; }
.hx-sx-board { border-radius: calc(4px * var(--k)); overflow: hidden; box-shadow: 0 0 0 1px var(--hxc-border), 0 calc(4px * var(--k)) calc(16px * var(--k)) rgba(17, 24, 39, .08); }
.hx-sx-board { cursor: grab; }
.hx-sx-board.hx-sx-removed { opacity: .35; }
html[data-platform="mobile"] .hx-sx-board, html[data-platform="mobile"] .hx-sx-board .hx-frame { border-radius: 24px; }

/* 흐름 재생 · 화면 옆 말풍선: 오류·완료 화면과 엣지 케이스가 '언제' 나오는지 (사용자: "'이럴 때'라는 말보다 흐름 재생 옆에 말풍선처럼") */

/* motion.css — 최종본 화면별 페이지(out/screens/NN-slug.html)에만 실린다. 보드에는 싣지 않는다(요소 고르기를 방해하지 않게).
   기본 움직임(화면 들어오기·뜨는 창·누름 반응)과 screens.json motion이 쓰는 클래스. 움직임 줄이기 설정이면 모두 끈다. */
@media (prefers-reduced-motion: no-preference) {
  .app.mo-enter { animation: mo-enter .32s cubic-bezier(.2, .8, .2, 1) both; }
  .app.mo-enter-back { animation: mo-enter-back .32s cubic-bezier(.2, .8, .2, 1) both; }
  .modal-backdrop.mo-in { animation: mo-fade .24s ease both; }
  .modal-backdrop.mo-in > .modal { animation: mo-pop .28s cubic-bezier(.2, .8, .2, 1) both; }
  .modal-backdrop.mo-in > .modal.sheet { animation: mo-up .36s cubic-bezier(.2, .8, .2, 1) both; }
  .app button, .app a.btn, .app .nav-item, .app label { transition: transform .1s ease, filter .1s ease, background-color .15s ease, color .15s ease; }
  .app button:active, .app a.btn:active, .app .nav-item:active { transform: scale(.95); filter: brightness(.9); }
  .mo-breathe { animation: mo-breathe 2.8s ease-in-out infinite; }
  .mo-pulse { animation: mo-pulse 1.2s ease 3; }
}
@keyframes mo-enter { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes mo-enter-back { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes mo-fade { from { opacity: 0; } }
@keyframes mo-pop { from { opacity: 0; transform: scale(.96); } }
@keyframes mo-up { from { transform: translateY(100%); } }
@keyframes mo-breathe { 50% { opacity: .4; } }
@keyframes mo-pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--c-primary) 30%, transparent); } }

/* 길게 누르기: 누르는 동안 버튼이 왼쪽부터 차오른다 */
.mo-hold { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.mo-hold-fill { position: absolute; inset: 0; background: rgba(255, 255, 255, .3); transform: scaleX(0); transform-origin: left center; pointer-events: none; }
/* 몇 초 뒤 어두워지기: 화면을 누르면 잠깐 밝아진다 */
.mo-dim { position: absolute; inset: 0; z-index: 9000; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
.mo-dim.on { pointer-events: auto; }
/* 길게 눌러 끌어서 순서 바꾸기 */
.mo-lift { position: relative; z-index: 5; background: var(--c-surface); box-shadow: 0 12px 28px rgba(0, 0, 0, .18); border-radius: var(--r-control); }

.hx-mo-toast { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 9999; padding: 10px 16px; border-radius: 999px;
  background: rgba(17, 24, 39, .92); color: #fff; font: 600 14px/1.3 var(--font-sans); pointer-events: none; }
/* 앱 안내 상자: 자리는 부품(toast)이 정한다 — 화면 위쪽. 들어올 때 위에서 살짝 내려온다 */
@media (prefers-reduced-motion: no-preference) { .toast.mo-toast { animation: mo-toast .28s cubic-bezier(.2, .8, .2, 1) both; } }
@keyframes mo-toast { from { opacity: 0; transform: translateY(-10px); } }
/* 입력칸 글자 수 */
.field-count { align-self: flex-end; margin-top: var(--sp-1); font-size: var(--fs-xs); color: var(--c-text-muted); font-variant-numeric: tabular-nums; }
.field-count.is-full { color: var(--c-warning); font-weight: var(--fw-semibold); }
/* 앱 밖으로 나가는 버튼을 누르면: 휴대폰 시스템 화면 자리 (디자이너 보드의 'OS 모달 등장' 자리처럼) */
.mo-out { position: absolute; inset: 0; z-index: 9500; display: flex; align-items: flex-end; justify-content: center; padding: var(--sp-5); background: rgba(17, 24, 39, .55); }
.mo-out-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-5); border-radius: var(--r-xl);
  background: #F2F2F7; color: #111827; border: 2px dashed #9CA3AF; font-family: -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; }
.mo-out-k { font-size: 12px; font-weight: 700; color: #6B7280; }
.mo-out-card b { font-size: 17px; }
.mo-out-card p { margin: 0 0 var(--sp-2); font-size: 13px; color: #4B5563; }
@media (prefers-reduced-motion: no-preference) { .mo-out { animation: mo-fade .2s ease both; } .mo-out-card { animation: mo-up .3s cubic-bezier(.2, .8, .2, 1) both; } }
/* 튜토리얼(보드에서 마우스를 올렸을 때): 손가락(데스크톱은 커서 점) · 위쪽 말풍선 */
.mo-finger { position: absolute; z-index: 9700; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none;
  background: rgba(17, 24, 39, .22); border: 3px solid rgba(255, 255, 255, .95); box-shadow: 0 4px 14px rgba(0, 0, 0, .28); }
.mo-finger.down { transform: scale(.78); background: rgba(17, 24, 39, .38); }
.mo-finger.down::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(17, 24, 39, .35); animation: mo-ripple .5s ease-out both; }
.mo-finger.hold::after { animation: mo-ripple 1.2s ease-out infinite; }
.mo-finger-desk { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-width: 2px; }
@keyframes mo-ripple { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
.mo-cap { position: absolute; z-index: 9800; left: 50%; top: 14px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 999px;
  background: rgba(17, 24, 39, .88); color: #fff; font: 600 13px/1.35 var(--font-sans); text-align: center; pointer-events: none; box-shadow: 0 6px 18px rgba(0, 0, 0, .2); }
/* 옆으로 넘치는 줄: 끝을 흐리게 — 밀면 더 있다는 표시 */
.mo-fade { -webkit-mask-image: linear-gradient(to right, #000 82%, transparent); mask-image: linear-gradient(to right, #000 82%, transparent); cursor: grab; }
.mo-static, .mo-static .mo-out-card { animation: none !important; }
.mo-focus { border-color: var(--c-primary) !important; box-shadow: 0 0 0 3px var(--c-primary-soft) !important; }
.mo-cap-when { top: 10px; background: rgba(185, 28, 28, .92); }
.mo-cap-when.is-ok { background: rgba(21, 128, 61, .92); }
.mo-cap-when.is-info { background: rgba(37, 99, 235, .92); }
.mo-cap-when.is-warn { background: rgba(180, 83, 9, .92); }

   살펴본 레퍼런스(HX.data.references) → 시안 5개를 시안마다 한 줄로(왼쪽: 이름 · 이유 · 특징 · 참고한 곳 · 고르기 · 메모 / 오른쪽: 메인 화면 3~6장 좌우 캐러셀,
   모두 같은 높이(첫 화면) · 넘치는 내용은 화면 안 스크롤 · 이름을 누르면 크게) → "이 안으로 할게요".
   지금 화면들(사용 흐름·화면 디자인)은 HX.meta.concept 시안으로 만든 것. 다른 시안의 화면은 build.js가 "<시안 id>~<slug>" 섹션으로 싣는다.
   시안을 고르면 그 시안의 분위기(look)도 함께 바뀐다(화면 느낌에서 다시 바꿀 수 있다). 복사 글 첫 줄: "시안 <id>(이름) · 테마 …" */
(function () {
  "use strict";
  var HX = window.HX, B = HX.board, doc = document;
  if (!B) return;
  var SHELL = { sidebar: "왼쪽 메뉴", top: "위쪽 탭 메뉴", rail: "아이콘 메뉴" };

  // 지금 화면들의 시안은 원래 화면(slug) 그대로, 다른 시안은 build.js가 실은 "<시안 id>~<slug>" 섹션
  function frameKey(c, slug) { return B.stage !== "concept" && c.id === B.mainConcept ? slug : c.id + "~" + slug; }

  // 화면을 누르면 크게 (시안 화면은 보드 데이터에 없는 화면이라 전용 확대 창)
  function zoom(c, slug, title) {
    var close = HX.btn("", { cls: "hx-icon-btn", aria: "닫기", title: "닫기 (Esc)", icon: HX.icon("#i-x"), onclick: function () { done(); } });
    var box = HX.el("div", { class: "hx-cc-zoom-frame", "data-theme": c.look, "data-swatch": (B.look(c.look).swatches[0] || {}).id || "", "data-type": B.state.type });
    var m = HX.el("div", { class: "hx-modal hx-app" }, [HX.el("div", { class: "hx-modal-backdrop", onclick: function () { done(); } }),
      HX.el("div", { class: "hx-modal-panel", role: "dialog", "aria-modal": "true", "aria-label": title }, [
        HX.el("div", { class: "hx-modal-head" }, [HX.el("span", { class: "hx-cc-id", text: "시안 " + c.id.toUpperCase() }), HX.el("h2", { text: title }), HX.el("span", { class: "hx-bar-spacer" }), close]),
        HX.el("div", { class: "hx-modal-body hx-cc-zoom" }, box)])]);
    function key(e) { if (e.key === "Escape") { e.preventDefault(); done(); } }
    function done() { m.remove(); doc.removeEventListener("keydown", key); doc.body.style.overflow = ""; }
    doc.body.appendChild(m); doc.addEventListener("keydown", key); doc.body.style.overflow = "hidden";
    HX.mountFrame(frameKey(c, slug), box, { scale: 1, fullHeight: true, badges: false });
    close.focus();
  }

  B.buildConcepts = function () {
    var C = B.concepts, main = B.mainConcept = (B.concept(HX.meta.concept) || C[0]).id;
    var refs = (HX.data.references || []).filter(function (r) { return r && r.name; });
    var el = HX.el("div", { class: "hx-cc", role: "tabpanel", "aria-label": "시안 고르기" });
    el.appendChild(HX.el("div", { class: "hx-cc-intro" }, [
      HX.el("b", { text: "이런 방향으로 만들어 봤어요" }),
      HX.el("span", { text: (refs.length ? "비슷한 서비스 " + refs.length + "곳을 살펴보고 " : "") + "화면 구성이 다른 안 " + C.length + "개를 만들었어요. 마음에 드는 안 하나를 골라 주세요. 다른 안에서 가져오고 싶은 점은 그 안의 칸에 적어 주세요. 고른 안으로 모든 화면과 사용 흐름을 만들어요." })]));

    if (refs.length) {
      el.appendChild(HX.el("section", { class: "hx-cc-refs", "aria-label": "살펴본 서비스" }, [
        HX.el("div", { class: "hx-cc-h", text: "살펴본 서비스" }),
        HX.el("div", { class: "hx-cc-refgrid" }, refs.map(function (r) {
          return HX.el("div", { class: "hx-cc-ref" }, [
            HX.el("div", { class: "hx-cc-ref-top" }, [
              r.url ? HX.el("a", { href: r.url, target: "_blank", rel: "noopener", text: r.name }) : HX.el("b", { text: r.name }),
              r.kind ? HX.el("span", { class: "hx-tag", text: r.kind }) : null]),
            r.borrow ? HX.el("div", { class: "hx-cc-ref-borrow", text: r.borrow }) : null]);
        }))]));
    }

    var cols = HX.el("div", { class: "hx-cc-cols", style: "--hx-cc-n:" + C.length });
    var cards = {};
    C.forEach(function (c) {
      var L = B.look(c.look), isRec = c.id === B.REC.concept;
      var pick = HX.btn("", { cls: "hx-cc-pick", onclick: function () { choose(c.id); } });
      var memo = HX.el("textarea", { class: "hx-ta hx-cc-memo", rows: "2", placeholder: "이 안에서 좋은 점·바꿀 점 (선택) — 예: 달력은 이 안처럼", "aria-label": "시안 " + c.id.toUpperCase() + "에 남길 말",
        oninput: function () { (B.state.cmemo || (B.state.cmemo = {}))[c.id] = memo.value; B.changed(); } });
      memo.value = (B.state.cmemo || {})[c.id] || "";
      var shots = HX.el("div", { class: "hx-cc-shots" });
      var card = HX.el("article", { class: "hx-cc-col", dataset: { concept: c.id } }, [
        HX.el("header", { class: "hx-cc-head" }, [
          HX.el("div", { class: "hx-cc-top" }, [HX.el("span", { class: "hx-cc-id", text: "시안 " + c.id.toUpperCase() }), isRec ? HX.el("span", { class: "hx-tag hx-rec", text: "추천" }) : null,
            B.stage !== "concept" && c.id === main ? HX.el("span", { class: "hx-tag", text: "지금 화면들" }) : null]),
          HX.el("h3", { class: "hx-cc-name", text: c.name }),
          c.why ? HX.el("p", { class: "hx-cc-why", text: c.why }) : null,
          HX.el("ul", { class: "hx-cc-traits" }, [SHELL[c.shell] || null, L && L.name ? "분위기 " + L.name : null].concat(c.traits || []).filter(Boolean).map(function (t) { return HX.el("li", { text: t }); })),
          (c.refs || []).length ? HX.el("div", { class: "hx-cc-from" }, [HX.el("span", { class: "hx-cc-from-h", text: "참고한 곳" })].concat((c.refs || []).map(function (r) {
            return HX.el("div", { class: "hx-cc-from-row" }, [r.url ? HX.el("a", { href: r.url, target: "_blank", rel: "noopener", text: r.name }) : HX.el("b", { text: r.name }), r.borrow ? " — " + r.borrow : ""]);
          }))) : null,
          pick,
          memo]),
        HX.el("div", { class: "hx-cc-right" }, [
          HX.el("div", { class: "hx-cc-shots-h", text: "메인 화면 " + (c.screens || []).length + "장 · 옆으로 넘겨 더 보기 · 화면 안은 스크롤 · 이름을 누르면 크게" }), shots])]);
      (c.screens || []).forEach(function (slug) {
        var s = HX.bySlug[slug], title = s ? s.name : slug;
        var box = HX.el("div", { class: "hx-cc-shot-frame", "data-theme": c.look, "data-swatch": (L.swatches[0] || {}).id || "", "data-type": B.state.type });
        // 화면 안 스크롤이 되도록 <button>이 아닌 요소로. 이름을 누르면 크게
        var open = HX.el("button", { type: "button", class: "hx-cc-shot-name", title: "크게 보기", onclick: function () { zoom(c, slug, title); } }, [title, HX.icon("#i-maximize-2", "icon icon-sm")]);
        var shot = HX.el("div", { class: "hx-cc-shot" }, [open, box]);
        shots.appendChild(shot);
        HX.mountFrame(frameKey(c, slug), box, { fit: "width", badges: false });   // 모두 같은 높이(첫 화면), 넘치는 내용은 화면 안에서 스크롤
      });
      cards[c.id] = { el: card, pick: pick }; cols.appendChild(card);
    });
    el.appendChild(cols);
    el.addEventListener("wheel", function (e) { e.stopPropagation(); }, { passive: true });

    function choose(id) {
      var c = B.concept(id); if (!c) return;
      B.state.concept = c.id;
      if (c.look && !B.isLocked("theme") && B.looks.some(function (l) { return l.id === c.look; })) { B.state.theme = c.look; B.state.accent = B.fixSwatch(c.look, ""); }
      B.applyTheme();   // → board-change
      HX.toast("시안 " + c.id.toUpperCase() + "을 골랐어요. 의견 보내기에 함께 담겨요.");
    }
    function paint() {
      Object.keys(cards).forEach(function (id) {
        var on = B.state.concept === id, k = cards[id];
        k.el.classList.toggle("hx-on", on);
        k.pick.innerHTML = ""; k.pick.appendChild(HX.icon(on ? "#i-circle-check" : "#i-circle"));
        k.pick.appendChild(doc.createTextNode(on ? "이 안으로 할게요 (고름)" : "이 안으로 할게요"));
        k.pick.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }
    HX.on("board-change", paint);
    paint();
    return el;
  };

  /* 1턴 보드: 시안 고르기만 — 상단바(제목 · 의견 보내기) + 시안 목록 */
  B.startConcept = function (app) {
    app.classList.add("hx-app"); app.classList.add("hx-bd"); app.classList.add("hx-tab-concept");
    var copyBtn = HX.btn("", { cls: "hx-primary hx-bd-copy", icon: HX.icon("#i-send"), title: "무엇이 전달되는지 확인하고 복사해요", onclick: function () { B.openSend(); } });
    var copyLabel = HX.el("span"); copyBtn.appendChild(copyLabel);
    app.appendChild(HX.el("div", { class: "hx-bar hx-bd-bar" }, [
      HX.el("div", { class: "hx-bar-title", title: HX.meta.title || "" }, [HX.meta.title || HX.meta.project || "", HX.el("small", { text: "시안 고르기" })]),
      HX.el("span", { class: "hx-bar-spacer" }), copyBtn]));
    app.appendChild(B.buildConcepts());
    function paintCopy() {
      var n = B.diffCount(), C = B.concept(B.state.concept);
      copyLabel.textContent = "시안 " + (C ? C.id.toUpperCase() : "") + "(으)로 보내기" + (n ? " · " + n + "개" : "");
    }
    HX.on("board-change", paintCopy); paintCopy();
  };
})();


/* 90-boot.js */
/* 90-boot.js — data-mode를 보고 진입. */
(function () {
  "use strict";
  var HX = window.HX;
  function boot() {
    var app = document.getElementById("hx-app") || document.body.appendChild(document.createElement("div"));
    var mode = HX.mode;
    try {
      if (mode === "board" && HX.board && HX.board.stage === "concept" && HX.board.startConcept) HX.board.startConcept(app);
      else if (mode === "board" && HX.board) HX.board.start(app);
      else if (HX.final) HX.final.start(app);
      else app.textContent = "렌더러를 찾을 수 없어요 (mode=" + mode + ")";
    } catch (e) {
      console.error("[hx] 부팅 실패", e);
      app.textContent = "화면을 그리는 중 오류가 났어요: " + (e && e.message ? e.message : e);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
