<!doctype html>
<html lang="ko" data-platform="mobile" data-theme="dawn" data-type="normal" data-swatch="navy" data-toast-at="top" data-toast-icon="on" data-toast-tone="light" data-toast-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께 보기 — 드르렁</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* design-harness core tokens — 플랫폼·테마 무관 기본값.
   테마 파일(theme-*.css)이 색을, toggles.css가 글자 크기·강조 성격을 덮어쓴다.
   컴포넌트 CSS는 여기 변수만 참조한다. 색·간격·반경·그림자 하드코딩 금지. */

:root {
  /* ---- 타이포 ----
     글꼴·굵기·자간·줄간격은 분위기(look)의 글꼴 세트가 덮어쓴다(scripts/looks.js FONTS).
     강약: 제목은 크고 굵게(--fw-head), 본문은 보통(--fw-body), 보조 글자는 작고 흐리게(--c-text-2·muted). */
  --font-sans: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-head: var(--font-sans);
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;   /* 본문 */
  --fs-lg: 18px;   /* 묶음 제목 */
  --fs-xl: 21px;
  --fs-2xl: 28px;  /* 화면 제목 */
  --fs-3xl: 36px;

  --lh-tight: 1.35;   /* 제목 */
  --lh-normal: 1.55;  /* 본문 */
  --lh-loose: 1.75;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --fw-body: var(--fw-regular);
  --fw-head: var(--fw-bold);

  --ls-head: -0.02em;   /* 한글 제목은 살짝 좁혀야 단단해 보인다 */
  --ls-body: -0.01em;

  /* ---- 간격 (4px 그리드) ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;
  --sp-16: 64px;

  /* ---- 반경 ---- */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-pill: 999px;

  /* ---- 컨트롤 크기 ---- */
  --ctl-sm: 32px;
  --ctl-md: 40px;
  --ctl-lg: 48px;
  --icon-sm: 16px;
  --icon-md: 20px;
  --icon-lg: 24px;
  --icon-stroke: 2;

  /* ---- 레이아웃 (web) ---- */
  --frame-w: 1280px;
  --frame-h: 800px;
  --topnav-h: 60px;
  --sidebar-w: 240px;
  --content-max: 960px;
  --split-list-w: 360px;
  --search-w: 320px;
  --ring-w: 3px;

  /* ---- 여백 리듬 — 묶음 사이는 넉넉하게, 묶음 안은 촘촘하게 (다닥다닥 붙지 않게) ---- */
  --gutter: var(--sp-8);          /* 화면 가장자리 */
  --space-section: var(--sp-12);  /* 묶음(.section) 사이 */
  --space-header: var(--sp-8);    /* 화면 제목 아래 */
  --space-block: var(--sp-5);     /* 묶음 안 덩어리 사이(.stack · 그리드) */
  --pad-card: var(--sp-6);        /* 카드 안쪽 */
  --pad-row: var(--sp-4);         /* 목록 한 줄 위아래 */

  /* ---- 그림자 ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .06);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, .08);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, .12);

  /* ---- 레이어 ---- */
  --z-dropdown: 100;
  --z-sticky: 200;
  --z-drawer: 300;
  --z-modal: 400;
  --z-toast: 500;
  --z-badge: 900;   /* 하네스 번호 배지 — 항상 최상단 */

  /* ---- 모션 ---- */
  --dur-fast: 120ms;
  --dur-normal: 200ms;
  --ease: cubic-bezier(.2, .8, .2, 1);

  /* ---- 하네스 전용 (번호 배지·bbox·화살표). 테마와 무관하게 고정 ---- */
  --hx-badge-bg: #FF3B30;
  --hx-badge-fg: #FFFFFF;
  --hx-bbox: rgba(255, 59, 48, .85);
  --hx-bbox-fill: rgba(255, 59, 48, .06);
  --hx-arrow: #2563EB;
  --hx-arrow-muted: rgba(37, 99, 235, .35);
}

/* ---- 리셋 (컴포넌트가 기대하는 최소 기준) ---- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  font-weight: var(--fw-body);
  line-height: var(--lh-normal);
  letter-spacing: var(--ls-body);
  color: var(--c-text);
  background: var(--c-bg);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;        /* 한국어는 단어(어절) 단위로 줄바꿈 — "준/비"처럼 끊기지 않게 */
  overflow-wrap: anywhere;     /* 아주 긴 영문·숫자만 필요할 때 끊는다 */
}
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
h1, h2, h3, h4 { font-family: var(--font-head); letter-spacing: var(--ls-head); }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
[hidden] { display: none !important; }

/* ---- 아이콘 (Lucide, 스프라이트 <use>) ---- */
.icon, .icon-sm, .icon-lg {
  width: var(--icon-md); height: var(--icon-md);
  fill: none; stroke: currentColor;
  stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round;
  flex: 0 0 auto;
}
.icon-sm { width: var(--icon-sm); height: var(--icon-sm); }
.icon-lg { width: var(--icon-lg); height: var(--icon-lg); }

/* ---- 접근성 ---- */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }


/* 토글 — 테마와 독립. 1라운드 보드에서 사용자가 고른다.
   data-type:   normal | large   (글자 크기 · 컨트롤 높이 · 터치 타깃)
   data-accent: calm   | vivid   (강조색 성격 — 차분한 단일색 vs 선명한 대비색)
   테마 셀렉터보다 뒤에 로드되어야 한다. */

/* ---- 글자 크기 ---- */
[data-type="normal"] {}

[data-type="large"] {
  --fs-xs: 13px;
  --fs-sm: 15px;
  --fs-md: 17px;
  --fs-lg: 20px;
  --fs-xl: 24px;
  --fs-2xl: 32px;
  --fs-3xl: 40px;

  --ctl-sm: 36px;
  --ctl-md: 48px;
  --ctl-lg: 56px;
  --icon-sm: 18px;
  --icon-md: 22px;
  --icon-lg: 28px;

  --topnav-h: 68px;
  --sidebar-w: 264px;
}

/* ---- 강조색 성격 ---- */
[data-accent="calm"] {}

/* vivid: 테마별로 한 단계 더 선명한 대비색으로 primary를 교체한다.
   테마의 바탕·글자색은 그대로 두어 "강조만" 바뀐 것이 보이게 한다. */
[data-theme="a"][data-accent="vivid"] {
  --c-primary: #EA580C;
  --c-primary-hover: #C2410C;
  --c-primary-active: #9A3412;
  --c-primary-soft: #FFEDD5;
  --c-primary-soft-fg: #9A3412;
  --c-focus: #EA580C;
}

/* web/00-layout.css */
/* 00-layout — 프레임 · 상단바 · 사이드바 · 콘텐츠 · 페이지 골격 · 그리드 · 유틸.
   토큰 변수만 참조한다. 도메인 문구·색·px 하드코딩 금지. */

/* ---- 앱 프레임 (1280×800 고정, .content만 내부 스크롤) ---- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  grid-template-rows: var(--topnav-h) minmax(0, 1fr);
  grid-template-areas:
    "topnav topnav"
    "sidebar content";
  width: var(--frame-w);
  height: var(--frame-h);
  overflow: hidden;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-normal);
}
.app.no-sidebar {
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "topnav"
    "content";
}
.app.no-sidebar .sidebar { display: none; }

/* ---- 상단바 ---- */
.topnav {
  grid-area: topnav;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  height: var(--topnav-h);
  padding: 0 var(--gutter);
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  position: relative;
  z-index: var(--z-sticky);
}
.topnav-brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 0 0 auto;
  min-width: calc(var(--sidebar-w) - var(--gutter));
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  color: var(--c-text);
  white-space: nowrap;
}
.topnav-brand .icon { color: var(--c-primary); }
.topnav-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fs-md);
  font-weight: var(--fw-medium);
  color: var(--c-text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topnav-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-left: auto;
  flex: 0 0 auto;
}

/* ---- 사이드바 ---- */
.sidebar {
  grid-area: sidebar;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: var(--sp-4) var(--sp-3);
  background: var(--c-surface);
  border-right: 1px solid var(--c-border);
  overflow-y: auto;
  overflow-x: hidden;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}
.nav-section {
  padding: var(--sp-4) var(--sp-3) var(--sp-2);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  color: var(--c-text-muted);
}
.nav-section:first-child { padding-top: 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: var(--ctl-md);
  padding: 0 var(--sp-3);
  border-radius: var(--r-control);
  color: var(--c-text-2);
  font-size: var(--fs-md);
  font-weight: var(--fw-medium);
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.nav-item > span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .icon { color: var(--c-text-muted); }
.nav-item:hover { background: var(--c-surface-2); color: var(--c-text); }
.nav-item:hover .icon { color: var(--c-text-2); }
.nav-item.active {
  background: var(--c-primary-soft);
  color: var(--c-primary-soft-fg);
  font-weight: var(--fw-semibold);
}
.nav-item.active .icon { color: var(--c-primary); }
.nav-item .badge, .nav-item .kbd { margin-left: auto; flex: 0 0 auto; }
.nav-item:focus-visible { outline: 2px solid var(--c-focus); outline-offset: -2px; }
.sidebar-footer {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  margin-top: auto;
  padding-top: var(--sp-4);
  border-top: 1px solid var(--c-border);
}

/* ---- 콘텐츠 (유일한 스크롤 영역) ---- */
.content {
  grid-area: content;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  padding: var(--gutter);
  background: var(--c-bg);
  overflow-y: auto;
  overflow-x: hidden;
}
.content > * { flex: 0 0 auto; }
.content > .split { flex: 1 1 auto; min-height: 0; }
.content-inner {
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
}

/* ---- 페이지 헤더 · 툴바 · 섹션 ---- */
.page-header {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-4);
  margin-bottom: var(--space-header);
}
.page-header > :first-child { flex: 1 1 auto; min-width: 0; }
.page-title {
  font-family: var(--font-head);
  font-size: var(--fs-2xl);
  font-weight: var(--fw-head);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-head);
  color: var(--c-text);
}
.page-desc {
  margin-top: var(--sp-2);
  font-size: var(--fs-md);
  color: var(--c-text-2);
}
.page-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-left: auto;
  flex: 0 0 auto;
}
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-2);
  min-height: var(--ctl-md);
  margin-bottom: var(--sp-4);
}
.section { margin-bottom: var(--space-section); }
.section:last-child { margin-bottom: 0; }
.section-title {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
  font-family: var(--font-head);
  font-size: var(--fs-lg);
  font-weight: var(--fw-head);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-head);
  color: var(--c-text);
}
.section-title .btn, .section-title .link { margin-left: auto; }
.section-desc {
  margin: calc(var(--sp-3) * -1) 0 var(--sp-4);
  font-size: var(--fs-sm);
  color: var(--c-text-2);
}

/* ---- 그리드 ---- */
.grid-2, .grid-3, .grid-4 {
  display: grid;
  gap: var(--space-block);
  align-items: stretch;
}
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.span-full { grid-column: 1 / -1; }

/* ---- 좌 목록 / 우 상세 ---- */
.split {
  --split-list-w: 360px; /* 토큰 없음: 목록 폭. 글자 크기와 무관한 레이아웃 값 */
  display: grid;
  grid-template-columns: var(--split-list-w) minmax(0, 1fr);
  min-height: 0;
  height: 100%;
  background: var(--c-surface);
  border: var(--border-card);
  border-radius: var(--r-card);
  overflow: hidden;
}
.split-list {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--c-border);
  overflow-y: auto;
  overflow-x: hidden;
}
.split-list > .toolbar {
  margin: 0;
  padding: var(--sp-3);
  border-bottom: 1px solid var(--c-border);
  flex: 0 0 auto;
}
.split-detail {
  min-height: 0;
  min-width: 0;
  padding: var(--gutter);
  overflow-y: auto;
  overflow-x: hidden;
}
.split-detail > .page-header { margin-bottom: var(--sp-4); }

/* ---- 스택 · 로우 ---- */
.stack { display: flex; flex-direction: column; gap: var(--space-block); min-width: 0; }
.row { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-width: 0; }
.row.wrap, .row-between.wrap { flex-wrap: wrap; }
.row.align-start, .row-between.align-start { align-items: flex-start; }
.spacer { flex: 1 1 auto; }

/* ---- 유틸 ---- */
.gap-1 { gap: var(--sp-1); }
.gap-2 { gap: var(--sp-2); }
.gap-3 { gap: var(--sp-3); }
.gap-4 { gap: var(--sp-4); }
.gap-6 { gap: var(--sp-6); }
.mt-2 { margin-top: var(--sp-2); }
.mt-4 { margin-top: var(--sp-4); }
.mt-6 { margin-top: var(--sp-6); }
.mb-2 { margin-bottom: var(--sp-2); }
.mb-4 { margin-bottom: var(--sp-4); }
.mb-6 { margin-bottom: var(--sp-6); }
.text-muted { color: var(--c-text-muted); }
.text-2 { color: var(--c-text-2); }
.text-primary { color: var(--c-primary); }
.text-success { color: var(--c-success); }
.text-warning { color: var(--c-warning); }
.text-danger { color: var(--c-danger); }
.text-xs { font-size: var(--fs-xs); }
.text-sm { font-size: var(--fs-sm); }
.text-lg { font-size: var(--fs-lg); }
.text-xl { font-size: var(--fs-xl); }
.text-center { text-align: center; }
.text-right { text-align: right; }
.fw-medium { font-weight: var(--fw-medium); }
.fw-semibold { font-weight: var(--fw-semibold); }
.fw-bold { font-weight: var(--fw-bold); }
.mono { font-family: var(--font-mono); }
.truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w-full { width: 100%; }
.flex-1 { flex: 1 1 auto; min-width: 0; }
.shrink-0 { flex: 0 0 auto; }

/* ============================================================
   레이아웃 변형 — nav-top (상단 가로 탭) · nav-rail (좁은 아이콘 레일)
   기본 골격(.app, .topnav, .sidebar, .nav-item …)의 마크업·동작은
   그대로 두고, 이 두 클래스가 붙었을 때만 모양을 바꾼다.
   .nav-item 클래스명은 두 변형 모두 그대로 유지한다(다른 도구가 이 클래스로 메뉴를 찾는다).
   ============================================================ */

/* ---- nav-top: 좌측 사이드바를 없애고 상단바에 가로 탭으로 내비를 둔다 ---- */
.app.nav-top {
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "topnav"
    "content";
}
.app.nav-top .sidebar { display: none; } /* 마크업엔 남아 있어도 이 변형에선 쓰지 않는다 */
.app.nav-top .topnav-brand { min-width: 0; } /* 사이드바 폭에 맞춘 정렬이 필요 없다 */

.topnav-nav {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  height: 100%;
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
}
.topnav-nav .nav-item {
  width: auto;
  flex: 0 0 auto;
  height: 100%;
  min-height: 0;
  padding: 0 var(--sp-3);
  border-radius: 0;
  position: relative;
}
.topnav-nav .nav-item.active {
  background: transparent;
  color: var(--c-text);
}
.topnav-nav .nav-item.active::after {
  content: "";
  position: absolute;
  left: var(--sp-3);
  right: var(--sp-3);
  bottom: 0;
  height: 2px; /* 밑줄 두께: 기존 1px 보더처럼 고정값을 쓴 예외 */
  background: var(--c-primary);
}
.topnav-nav .nav-item .badge,
.topnav-nav .nav-item .kbd { display: none; } /* 가로 탭에는 라벨만, 배지·단축키는 생략 */
/* 본문 폭 제한은 새 클래스 없이 기존 .content-inner(--content-max)를 그대로 쓴다 */

/* ---- nav-rail: 넓은 사이드바 대신 아이콘만 남는 좁은 레일 ---- */
.app.nav-rail {
  --rail-w: calc(var(--sp-16) + var(--sp-4)); /* 64px+16px=80px, 76~88px 범위의 아이콘 레일 폭 */
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
}
.app.nav-rail .sidebar {
  padding: var(--sp-4) var(--sp-2);
  align-items: center;
}
.app.nav-rail .nav-section { display: none; } /* 좁은 레일엔 그룹 제목을 놓을 자리가 없다 */
.app.nav-rail .nav-item {
  position: relative;
  flex-direction: column;
  justify-content: center;
  width: 100%;
  min-height: var(--ctl-lg);
  padding: var(--sp-2) var(--sp-1);
  gap: var(--sp-1);
  text-align: center;
}
.app.nav-rail .nav-item > span:not(.badge) {
  flex: 0 0 auto;
  font-size: var(--fs-xs);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.app.nav-rail .nav-item .badge {
  /* 숫자 배지를 아이콘 우상단 모서리의 작은 점/카운트로 옮긴다 */
  position: absolute;
  top: calc(var(--sp-1) * -1);
  right: var(--sp-1);
  margin-left: 0;
  min-width: var(--sp-4);
  height: var(--sp-4);
  padding: 0 var(--sp-1);
  line-height: var(--sp-4);
}
.app.nav-rail .nav-item .kbd { display: none; } /* 단축키 힌트는 레일 폭에 맞지 않는다 */
.app.nav-rail .sidebar-footer { align-items: center; padding-top: var(--sp-3); }
.app.nav-rail .sidebar-footer .nav-item .truncate { display: none; } /* 이름 대신 아바타만 남긴다 */


/* web/10-buttons.css */
/* 10-buttons — 버튼 · 아이콘 버튼 · 버튼 그룹 · 링크.
   높이 --ctl-*, 반경 --r-control, 색은 --c-* 토큰만. */

/* ---- 기본 (= secondary: 테두리 버튼) ---- */
.btn {
  --btn-h: var(--ctl-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  height: var(--btn-h);
  min-width: var(--btn-h);
  padding: 0 var(--sp-4);
  border: 1px solid var(--c-border-strong);
  border-radius: var(--r-control);
  background: var(--c-surface);
  color: var(--c-text);
  font-family: inherit;
  font-size: var(--fs-md);
  font-weight: var(--fw-medium);
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  flex: 0 0 auto;
  transition:
    background var(--dur-fast) var(--ease),
    border-color var(--dur-fast) var(--ease),
    color var(--dur-fast) var(--ease),
    box-shadow var(--dur-fast) var(--ease);
}
.btn .icon, .btn .icon-sm, .btn .icon-lg { flex: 0 0 auto; }
.btn:not(:disabled):hover { background: var(--c-surface-2); }
.btn:not(:disabled):active { background: var(--c-surface-3); }
.btn:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }
.btn:disabled, .btn.is-disabled {
  opacity: .5;
  cursor: not-allowed;
  box-shadow: none;
}
.btn-secondary { background: var(--c-surface); border-color: var(--c-border-strong); color: var(--c-text); }

/* ---- 변형 ---- */
.btn-primary {
  background: var(--c-primary);
  border-color: var(--c-primary);
  color: var(--c-primary-fg);
}
.btn-primary:not(:disabled):hover { background: var(--c-primary-hover); border-color: var(--c-primary-hover); }
.btn-primary:not(:disabled):active { background: var(--c-primary-active); border-color: var(--c-primary-active); }

.btn-soft {
  background: var(--c-primary-soft);
  border-color: transparent;
  color: var(--c-primary-soft-fg);
}
.btn-soft:not(:disabled):hover { background: var(--c-primary-soft); border-color: var(--c-primary); }
.btn-soft:not(:disabled):active { background: var(--c-primary-soft); border-color: var(--c-primary-active); }

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--c-text-2);
}
.btn-ghost:not(:disabled):hover { background: var(--c-surface-2); color: var(--c-text); }
.btn-ghost:not(:disabled):active { background: var(--c-surface-3); color: var(--c-text); }

.btn-danger {
  background: var(--c-danger);
  border-color: var(--c-danger);
  color: var(--c-text-inverse);
}
/* --c-danger-hover 토큰이 없어 밝기 필터로 대신한다 */
.btn-danger:not(:disabled):hover { filter: brightness(.92); }
.btn-danger:not(:disabled):active { filter: brightness(.84); }

.btn-danger-soft {
  background: var(--c-danger-soft);
  border-color: transparent;
  color: var(--c-danger-soft-fg);
}
.btn-danger-soft:not(:disabled):hover { border-color: var(--c-danger); }
.btn-danger-soft:not(:disabled):active { border-color: var(--c-danger); filter: brightness(.96); }

/* ---- 크기 ---- */
.btn-sm {
  --btn-h: var(--ctl-sm);
  padding: 0 var(--sp-3);
  gap: var(--sp-1);
  font-size: var(--fs-sm);
}
.btn-sm .icon { width: var(--icon-sm); height: var(--icon-sm); }
.btn-lg {
  --btn-h: var(--ctl-lg);
  padding: 0 var(--sp-5);
  gap: var(--sp-2);
  font-size: var(--fs-lg);
}
.btn-lg .icon { width: var(--icon-lg); height: var(--icon-lg); }

/* ---- 아이콘 전용 (정사각, aria-label 필수) ---- */
.btn-icon {
  width: var(--btn-h);
  min-width: var(--btn-h);
  padding: 0;
}
.btn-round { border-radius: var(--r-pill); }

/* ---- 블록 ---- */
.btn-block {
  display: flex;
  width: 100%;
}

/* ---- 그룹 (붙은 버튼 묶음) ---- */
.btn-group {
  display: inline-flex;
  align-items: stretch;
  vertical-align: middle;
}
.btn-group > .btn { border-radius: 0; margin-left: -1px; position: relative; }
.btn-group > .btn:first-child { margin-left: 0; border-top-left-radius: var(--r-control); border-bottom-left-radius: var(--r-control); }
.btn-group > .btn:last-child { border-top-right-radius: var(--r-control); border-bottom-right-radius: var(--r-control); }
.btn-group > .btn:hover, .btn-group > .btn:focus-visible, .btn-group > .btn.active { z-index: 1; }
.btn-group > .btn.active {
  background: var(--c-primary-soft);
  border-color: var(--c-primary);
  color: var(--c-primary-soft-fg);
}

/* ---- 로딩 (loader 아이콘 회전) ---- */
.btn.is-loading { pointer-events: none; opacity: .7; }
.icon-spin { animation: icon-spin 900ms linear infinite; }
@keyframes icon-spin { to { transform: rotate(360deg); } }

/* ---- 텍스트 링크 ---- */
.link {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 0;
  border: 0;
  background: none;
  color: var(--c-primary);
  font-size: inherit;
  font-weight: var(--fw-medium);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 0.2em;
}
.link:hover { color: var(--c-primary-hover); }
.link:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; border-radius: var(--r-sm); }
.link-muted { color: var(--c-text-2); }
.link-muted:hover { color: var(--c-text); }


/* web/20-inputs.css */
/* 20-inputs — 필드 · 입력 · 셀렉트 · 텍스트영역 · 입력 그룹 · 체크/라디오/스위치 · 세그먼트 · 검색 · 폼 그리드.
   높이 --ctl-*, 반경 --r-control, 색은 --c-* 토큰만. */

/* ---- 필드 (라벨 + 컨트롤 + 도움말/오류) ---- */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  min-width: 0;
}
.field-label {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  line-height: var(--lh-tight);
  color: var(--c-text);
}
.field-label .req { color: var(--c-danger); }
.field-label .opt { color: var(--c-text-muted); font-weight: var(--fw-regular); }
.field-help {
  font-size: var(--fs-xs);
  line-height: var(--lh-normal);
  color: var(--c-text-muted);
}
.field-error {
  display: none;
  align-items: center;
  gap: var(--sp-1);
  font-size: var(--fs-sm);   /* 오류 문구는 작게 두지 않는다(기본 규칙 17-2) */
  line-height: var(--lh-normal);
  color: var(--c-danger);
}
.field.is-error .field-error { display: flex; }
.field.is-error .field-help { display: none; }
.field.is-error :is(.input, .select, .textarea, .input-group) { border-color: var(--c-danger); }
.field.is-error :is(.input, .select, .textarea):focus { box-shadow: 0 0 0 3px var(--c-danger-soft); border-color: var(--c-danger); }
.field.is-disabled { pointer-events: none; }
.field.is-disabled .field-label { color: var(--c-text-muted); }
.field.is-disabled :is(.input, .select, .textarea) { background: var(--c-surface-2); color: var(--c-text-muted); }

/* 가로 배치 (설정 화면: 라벨·설명 좌, 컨트롤 우) */
.field-inline {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  min-height: var(--ctl-md);
}
.field-inline > :first-child { flex: 1 1 auto; min-width: 0; }
.field-inline > :last-child { flex: 0 0 auto; }
.field-inline .field-help { margin-top: var(--sp-1); }

/* ---- 텍스트 컨트롤 ---- */
.input, .select, .textarea {
  display: block;
  width: 100%;
  height: var(--ctl-md);
  padding: 0 var(--sp-3);
  border: 1px solid var(--c-border-strong);
  border-radius: var(--r-control);
  background: var(--c-surface);
  color: var(--c-text);
  font-family: inherit;
  font-size: var(--fs-md);
  line-height: var(--lh-normal);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input::placeholder, .textarea::placeholder { color: var(--c-text-muted); }
:is(.input, .select, .textarea):hover:not(:disabled):not(:focus) { border-color: var(--c-text-muted); }
:is(.input, .select, .textarea):focus {
  border-color: var(--c-focus);
  box-shadow: 0 0 0 3px var(--c-primary-soft);
}
:is(.input, .select, .textarea):disabled,
:is(.input, .textarea)[readonly] {
  background: var(--c-surface-2);
  color: var(--c-text-muted);
  cursor: not-allowed;
}
.input-sm, .select-sm { height: var(--ctl-sm); font-size: var(--fs-sm); padding: 0 var(--sp-2); }
.input-lg, .select-lg { height: var(--ctl-lg); font-size: var(--fs-lg); padding: 0 var(--sp-4); }
.input[type="number"] { font-variant-numeric: tabular-nums; }
.input[type="date"], .input[type="time"] { min-width: 0; }

.textarea {
  height: auto;
  min-height: calc(var(--ctl-md) * 2.5);
  padding: var(--sp-2) var(--sp-3);
  border-radius: min(var(--r-control), var(--r-lg)); /* 여러 줄 입력: 알약 모서리가 글자를 자른다 */
  resize: vertical;
}

/* 셀렉트: 단독은 네이티브 화살표, .select-wrap 안에서는 아이콘 화살표 */
.select { cursor: pointer; }
.select-wrap { position: relative; width: 100%; }
.select-wrap > .select { appearance: none; padding-right: calc(var(--sp-3) + var(--icon-md) + var(--sp-2)); }
.select-wrap > .icon, .select-wrap > .icon-sm {
  position: absolute;
  right: var(--sp-3);
  top: 50%;
  translate: 0 -50%;
  color: var(--c-text-muted);
  pointer-events: none;
}

/* ---- 입력 그룹 (접두/접미 · 아이콘 · 버튼 결합) ---- */
.input-group {
  display: flex;
  align-items: stretch;
  position: relative;
  width: 100%;
  min-width: 0;
}
.input-group > .input, .input-group > .select { flex: 1 1 auto; min-width: 0; width: auto; }
.input-group > .input:not(:first-child), .input-group > .select:not(:first-child) { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.input-group > .input:not(:last-child), .input-group > .select:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.input-group > :is(.input, .select):focus { position: relative; z-index: 1; }
.input-addon {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 0 var(--sp-3);
  border: 1px solid var(--c-border-strong);
  background: var(--c-surface-2);
  color: var(--c-text-2);
  font-size: var(--fs-sm);
  white-space: nowrap;
  flex: 0 0 auto;
}
.input-group > .input-addon:first-child { border-right: 0; border-radius: var(--r-control) 0 0 var(--r-control); }
.input-group > .input-addon:last-child { border-left: 0; border-radius: 0 var(--r-control) var(--r-control) 0; }
.input-group > .btn { flex: 0 0 auto; margin-left: -1px; border-radius: 0 var(--r-control) var(--r-control) 0; }
.input-group > .btn:first-child { margin-left: 0; margin-right: -1px; border-radius: var(--r-control) 0 0 var(--r-control); }
/* 아이콘을 입력 안쪽에 겹치기: <div class="input-group"><svg class="icon">…</svg><input class="input"></div> */
.input-group > .icon, .input-group > .icon-sm {
  position: absolute;
  top: 50%;
  left: var(--sp-3);
  translate: 0 -50%;
  color: var(--c-text-muted);
  pointer-events: none;
  z-index: 2;
}
.input-group > .icon + .input, .input-group > .icon-sm + .input { padding-left: calc(var(--sp-3) + var(--icon-md) + var(--sp-2)); }
.input-group > .input + .icon, .input-group > .input + .icon-sm { left: auto; right: var(--sp-3); }
.input-group > .input:has(+ .icon), .input-group > .input:has(+ .icon-sm) { padding-right: calc(var(--sp-3) + var(--icon-md) + var(--sp-2)); }

/* ---- 검색 (돋보기 + 입력) ---- */
.search {
  --search-w: 320px; /* 토큰 없음: 툴바 안 기본 폭. .w-full로 해제 */
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  max-width: var(--search-w);
  min-width: 0;
}
.search.w-full { max-width: none; }
.search > .icon, .search > .icon-sm {
  position: absolute;
  left: var(--sp-3);
  top: 50%;
  translate: 0 -50%;
  color: var(--c-text-muted);
  pointer-events: none;
}
.search > .input { padding-left: calc(var(--sp-3) + var(--icon-md) + var(--sp-2)); }
.search > .input[type="search"]::-webkit-search-cancel-button { appearance: none; }

/* ---- 체크박스 · 라디오 ---- */
.checkbox, .radio {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--ctl-sm);
  font-size: var(--fs-md);
  color: var(--c-text);
  cursor: pointer;
  user-select: none;
}
.checkbox input, .radio input {
  appearance: none;
  display: grid;
  place-content: center;
  width: var(--icon-md);
  height: var(--icon-md);
  margin: 0;
  flex: 0 0 auto;
  border: 1px solid var(--c-border-strong);
  border-radius: var(--r-sm);
  background: var(--c-surface);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.radio input { border-radius: var(--r-pill); }
.checkbox:hover input, .radio:hover input { border-color: var(--c-primary); }
.checkbox input:checked, .radio input:checked { background: var(--c-primary); border-color: var(--c-primary); }
.checkbox input:checked::after {
  content: "";
  width: 30%;
  height: 55%;
  border: solid var(--c-primary-fg);
  border-width: 0 calc(var(--icon-stroke) * 1px) calc(var(--icon-stroke) * 1px) 0;
  rotate: 45deg;
  translate: 0 -10%;
}
.checkbox input:indeterminate { background: var(--c-primary); border-color: var(--c-primary); }
.checkbox input:indeterminate::after { content: ""; width: 50%; height: calc(var(--icon-stroke) * 1px); background: var(--c-primary-fg); }
.radio input:checked::after {
  content: "";
  width: 40%;
  height: 40%;
  border-radius: var(--r-pill);
  background: var(--c-primary-fg);
}
.checkbox input:focus-visible, .radio input:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }
.checkbox input:disabled, .radio input:disabled { opacity: .5; cursor: not-allowed; }
.checkbox:has(input:disabled), .radio:has(input:disabled) { color: var(--c-text-muted); cursor: not-allowed; }
.checkbox .desc, .radio .desc { display: block; font-size: var(--fs-xs); color: var(--c-text-muted); }
.checkbox.align-start, .radio.align-start { align-items: flex-start; }
.checkbox.align-start input, .radio.align-start input { margin-top: calc((var(--fs-md) * var(--lh-normal) - var(--icon-md)) / 2); }

/* ---- 스위치 ---- */
.switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: var(--ctl-sm);
  font-size: var(--fs-md);
  color: var(--c-text);
  cursor: pointer;
  user-select: none;
}
.switch input {
  appearance: none;
  position: relative;
  flex: 0 0 auto;
  width: calc(var(--icon-lg) * 1.75);
  height: var(--icon-lg);
  margin: 0;
  border-radius: var(--r-pill);
  border: 1px solid var(--c-border-strong);
  background: var(--c-surface-3);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.switch input::after {
  content: "";
  position: absolute;
  top: calc(var(--sp-1) / 2 - 1px);
  left: calc(var(--sp-1) / 2 - 1px);
  width: calc(var(--icon-lg) - var(--sp-1));
  height: calc(var(--icon-lg) - var(--sp-1));
  border-radius: var(--r-pill);
  border: 1px solid var(--c-border-strong);
  background: var(--c-surface);
  box-shadow: var(--shadow-sm);
  transition: translate var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.switch input:checked { background: var(--c-primary); border-color: var(--c-primary); }
.switch input:checked::after { translate: calc(var(--icon-lg) * .75) 0; background: var(--c-primary-fg); border-color: transparent; }
.switch input:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }
.switch input:disabled { opacity: .5; cursor: not-allowed; }
.switch:has(input:disabled) { color: var(--c-text-muted); cursor: not-allowed; }
.switch .desc { display: block; font-size: var(--fs-xs); color: var(--c-text-muted); }

/* ---- 세그먼트 (배타 선택 탭형 컨트롤) ---- */
.segmented {
  display: inline-flex;
  align-items: stretch;
  gap: calc(var(--sp-1) / 2);
  padding: calc(var(--sp-1) / 2);
  border: 1px solid var(--c-border);
  border-radius: var(--r-control);
  background: var(--c-surface-2);
  vertical-align: middle;
}
.segmented-item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  height: calc(var(--ctl-md) - var(--sp-1) - 2px);
  padding: 0 var(--sp-3);
  border: 1px solid transparent;
  border-radius: calc(var(--r-control) - var(--sp-1) / 2);
  color: var(--c-text-2);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  white-space: nowrap;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.segmented-item:hover { color: var(--c-text); }
.segmented-item.active {
  background: var(--c-surface);
  border-color: var(--c-border-strong);
  color: var(--c-text);
  box-shadow: var(--shadow-sm);
}
.segmented-item:focus-visible { outline: 2px solid var(--c-focus); outline-offset: -1px; }
.segmented-sm .segmented-item { height: calc(var(--ctl-sm) - var(--sp-1) - 2px); padding: 0 var(--sp-2); font-size: var(--fs-xs); }
.segmented.w-full { display: flex; }
.segmented.w-full .segmented-item { flex: 1 1 0; }

/* ---- 폼 그리드 · 액션 ---- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-5) var(--sp-4);
  align-items: start;
}
.form-grid > .span-2, .form-grid > .span-full { grid-column: 1 / -1; }
.form-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-2);
  margin-top: var(--sp-6);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--c-border);
}
.form-actions.sticky {
  position: sticky;
  bottom: calc(var(--gutter) * -1);
  margin-bottom: calc(var(--gutter) * -1);
  padding-bottom: var(--sp-4);
  background: var(--c-bg);
  z-index: var(--z-sticky);
}


/* web/30-display.css */
/* 30-display.css — 표시 컴포넌트 (card · badge · chip · avatar · tabs · breadcrumb · progress ·
   stat · empty · skeleton · divider · banner · toast · tooltip · kbd).
   토큰 변수만 참조한다. 색·간격·반경·그림자 하드코딩 금지 (1px 테두리 · 0 · % 허용). */

/* toast·overlay가 프레임 기준 absolute로 놓이므로 .app은 배치 기준이어야 한다 (00-layout과 중복돼도 무해). */
.app { position: relative; }

/* ---- card ---- */
.card {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--c-surface);
  border: var(--border-card);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-card);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-5) var(--pad-card);
  border-bottom: 1px solid var(--c-border);
}
.card-title { font-family: var(--font-head); font-size: var(--fs-lg); font-weight: var(--fw-head); line-height: var(--lh-tight); letter-spacing: var(--ls-head); min-width: 0; }
.card-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-4); padding: var(--pad-card); }
.card-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2);
  padding: var(--sp-4) var(--pad-card);
  border-top: 1px solid var(--c-border);
}
.card.is-selected { border-color: var(--c-primary); box-shadow: inset 0 0 0 1px var(--c-primary); }
.card-clickable { cursor: pointer; transition: box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.card-clickable:hover { border-color: var(--c-border-strong); box-shadow: var(--shadow-md); }
.card-compact .card-header, .card-compact .card-body, .card-compact .card-footer { padding-left: var(--sp-4); padding-right: var(--sp-4); }
.card-compact .card-body { padding-top: var(--sp-4); padding-bottom: var(--sp-4); }
/* 카드 안에 목록을 여백 없이 붙일 때: .card > .list / .card > .table-wrap */
.card > .list .list-item { padding-left: var(--pad-card); padding-right: var(--pad-card); }
.card > .table-wrap { border: 0; border-radius: 0; }

/* ---- badge ---- */
.badge {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: calc(var(--sp-1) / 2) var(--sp-2);
  border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: var(--fw-medium); line-height: var(--lh-normal);
  white-space: nowrap; vertical-align: middle;
  background: var(--c-surface-3); color: var(--c-text-2);
}
.badge-neutral { background: var(--c-surface-3); color: var(--c-text-2); }
.badge-primary { background: var(--c-primary-soft); color: var(--c-primary-soft-fg); }
.badge-success { background: var(--c-success-soft); color: var(--c-success-soft-fg); }
.badge-warning { background: var(--c-warning-soft); color: var(--c-warning-soft-fg); }
.badge-danger  { background: var(--c-danger-soft);  color: var(--c-danger-soft-fg); }
.badge-info    { background: var(--c-info-soft);    color: var(--c-info-soft-fg); }
.badge-dot::before {
  content: ""; width: var(--sp-2); height: var(--sp-2); border-radius: 50%;
  background: currentColor; flex: 0 0 auto;
}
.badge .icon-sm { width: calc(var(--icon-sm) * .85); height: calc(var(--icon-sm) * .85); }

/* ---- chip ---- */
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  height: var(--ctl-sm); padding: 0 var(--sp-3);
  border: 1px solid var(--c-border); border-radius: var(--r-pill);
  background: var(--c-surface); color: var(--c-text-2);
  font-size: var(--fs-sm); font-weight: var(--fw-medium); white-space: nowrap;
}
button.chip, a.chip { cursor: pointer; }
.chip:hover { border-color: var(--c-border-strong); color: var(--c-text); }
.chip.active { background: var(--c-primary-soft); color: var(--c-primary-soft-fg); border-color: transparent; }
.chip .icon-sm { margin-left: calc(var(--sp-1) * -1); }
.chip-close {
  display: inline-flex; align-items: center; justify-content: center;
  margin-right: calc(var(--sp-2) * -1); padding: calc(var(--sp-1) / 2);
  border-radius: 50%; color: var(--c-text-muted); cursor: pointer;
}
.chip-close:hover { background: var(--c-surface-3); color: var(--c-text); }
.chip-close .icon-sm { margin: 0; }
.chip-group { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* ---- avatar ---- */
.avatar {
  --avatar-size: var(--ctl-md);
  width: var(--avatar-size); height: var(--avatar-size); flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
  border-radius: 50%;
  background: var(--c-primary-soft); color: var(--c-primary-soft-fg);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: 1; letter-spacing: .02em;
}
.avatar-sm { --avatar-size: var(--ctl-sm); font-size: var(--fs-xs); }
.avatar-lg { --avatar-size: var(--ctl-lg); font-size: var(--fs-lg); }
.avatar-neutral { background: var(--c-surface-3); color: var(--c-text-2); }
.avatar-success { background: var(--c-success-soft); color: var(--c-success-soft-fg); }
.avatar-warning { background: var(--c-warning-soft); color: var(--c-warning-soft-fg); }
.avatar-info    { background: var(--c-info-soft);    color: var(--c-info-soft-fg); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-group { display: inline-flex; align-items: center; }
.avatar-group .avatar { border: calc(var(--sp-1) / 2) solid var(--c-surface); margin-left: calc(var(--sp-2) * -1); }
.avatar-group .avatar:first-child { margin-left: 0; }
.avatar-group .avatar-more { background: var(--c-surface-3); color: var(--c-text-2); font-size: var(--fs-xs); }

/* ---- tabs ---- */
.tabs { display: flex; align-items: flex-end; gap: var(--sp-1); border-bottom: 1px solid var(--c-border); overflow-x: auto; }
.tab {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  height: var(--ctl-md); padding: 0 var(--sp-3); margin-bottom: -1px;
  border-bottom: calc(var(--sp-1) / 2) solid transparent;
  color: var(--c-text-2); font-size: var(--fs-md); font-weight: var(--fw-medium);
  white-space: nowrap; cursor: pointer;
}
.tab:hover { color: var(--c-text); }
.tab.active { color: var(--c-primary); border-bottom-color: var(--c-primary); }
.tab .badge { margin-left: calc(var(--sp-1) * -1); }
/* 알약형 탭 (세그먼트와 비슷하지만 콘텐츠 전환용) */
.tabs-pill { border-bottom: 0; gap: var(--sp-2); }
.tabs-pill .tab { height: var(--ctl-sm); margin-bottom: 0; border-bottom: 0; border-radius: var(--r-pill); font-size: var(--fs-sm); }
.tabs-pill .tab:hover { background: var(--c-surface-2); }
.tabs-pill .tab.active { background: var(--c-primary-soft); color: var(--c-primary-soft-fg); }

/* ---- breadcrumb ---- */
.breadcrumb {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-1);
  font-size: var(--fs-sm); color: var(--c-text-muted);
}
.breadcrumb a:hover { color: var(--c-text); }
.breadcrumb .icon-sm { color: var(--c-text-muted); }
.breadcrumb [aria-current="page"] { color: var(--c-text); font-weight: var(--fw-medium); }

/* ---- progress ---- */
.progress { width: 100%; height: var(--sp-2); border-radius: var(--r-pill); background: var(--c-surface-3); overflow: hidden; }
.progress-bar { height: 100%; border-radius: inherit; background: var(--c-primary); }
.progress-sm { height: var(--sp-1); }
.progress-lg { height: var(--sp-3); }
.progress-success .progress-bar { background: var(--c-success); }
.progress-warning .progress-bar { background: var(--c-warning); }
.progress-danger  .progress-bar { background: var(--c-danger); }
.progress-row { display: flex; align-items: center; gap: var(--sp-3); }
.progress-row .progress { flex: 1 1 auto; }
.progress-row .progress-num { flex: 0 0 auto; font-size: var(--fs-sm); color: var(--c-text-2); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
/* width 유틸 — 인라인 style 금지이므로 10단계로 고정 */
.w-10 { width: 10%; } .w-20 { width: 20%; } .w-30 { width: 30%; } .w-40 { width: 40%; } .w-50 { width: 50%; }
.w-60 { width: 60%; } .w-70 { width: 70%; } .w-80 { width: 80%; } .w-90 { width: 90%; } .w-100 { width: 100%; }

/* ---- stat ---- */
.stat { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.stat-label { font-size: var(--fs-sm); color: var(--c-text-2); }
.stat-value {
  font-family: var(--font-head); font-size: var(--fs-2xl); font-weight: var(--fw-head); line-height: var(--lh-tight);
  letter-spacing: var(--ls-head); font-variant-numeric: tabular-nums; color: var(--c-text);
}
.stat-value small { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--c-text-muted); margin-left: var(--sp-1); }
.stat-delta { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-sm); color: var(--c-text-muted); }
.stat-delta.up   { color: var(--c-success); }
.stat-delta.down { color: var(--c-danger); }
.stat-icon {
  width: var(--ctl-md); height: var(--ctl-md); border-radius: var(--r-control);
  display: flex; align-items: center; justify-content: center;
  background: var(--c-primary-soft); color: var(--c-primary-soft-fg);
}
.stat-row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); }

/* ---- empty ---- */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  gap: var(--sp-2); padding: var(--sp-12) var(--sp-6); color: var(--c-text-2);
}
.empty-icon {
  width: var(--ctl-lg); height: var(--ctl-lg); margin-bottom: var(--sp-2);
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  background: var(--c-surface-2); color: var(--c-text-muted);
}
.empty-title { font-family: var(--font-head); font-size: var(--fs-lg); font-weight: var(--fw-head); letter-spacing: var(--ls-head); color: var(--c-text); }
.empty-desc { font-size: var(--fs-sm); max-width: 40ch; }
.empty-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
.empty-sm { padding: var(--sp-6) var(--sp-4); }
.empty-sm .empty-icon { width: var(--ctl-md); height: var(--ctl-md); margin-bottom: 0; }
.empty-sm .empty-title { font-size: var(--fs-md); }

/* ---- skeleton ---- */
.skeleton { background: var(--c-skeleton); border-radius: var(--r-sm); }
.skeleton-text { height: var(--fs-md); width: 100%; }
.skeleton-text + .skeleton-text { margin-top: var(--sp-2); }
.skeleton-title { height: var(--fs-xl); width: 60%; }
.skeleton-block { width: 100%; min-height: calc(var(--sp-16) * 2.5); border-radius: var(--r-md); }
.skeleton-circle { width: var(--ctl-md); height: var(--ctl-md); border-radius: 50%; flex: 0 0 auto; }
.skeleton-row { display: flex; align-items: center; gap: var(--sp-3); }
.skeleton-row > .skeleton-lines { flex: 1 1 auto; }

/* ---- divider ---- */
.divider { height: 1px; width: 100%; border: 0; margin: var(--sp-4) 0; background: var(--c-border); flex: 0 0 auto; }
.divider-tight { margin: var(--sp-2) 0; }
.divider-vertical { width: 1px; height: auto; align-self: stretch; margin: 0 var(--sp-2); }
.divider-text {
  display: flex; align-items: center; gap: var(--sp-3);
  height: auto; background: none; font-size: var(--fs-xs); color: var(--c-text-muted); white-space: nowrap;
}
.divider-text::before, .divider-text::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--c-border); }

/* ---- banner ---- */
.banner {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid transparent;
  border-radius: min(var(--r-control), var(--r-lg)); /* 여러 줄 상자: 둥근 분위기에서도 알약 모양 금지 */
  font-size: var(--fs-sm); line-height: var(--lh-normal);
  background: var(--c-surface-2); color: var(--c-text);
}
.banner > .icon { margin-top: calc((var(--fs-md) * var(--lh-normal) - var(--icon-md)) / 2); }
.banner-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--sp-1) / 2); }
.banner-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }   /* 오류·완료 문구 제목은 본문 크기(기본 규칙 17-2) */
.banner-actions { display: flex; align-items: center; gap: var(--sp-2); flex: 0 0 auto; margin-left: auto; }
.banner-info    { background: var(--c-info-soft);    color: var(--c-info-soft-fg); }
.banner-success { background: var(--c-success-soft); color: var(--c-success-soft-fg); }
.banner-warning { background: var(--c-warning-soft); color: var(--c-warning-soft-fg); }
.banner-danger  { background: var(--c-danger-soft);  color: var(--c-danger-soft-fg); }
.banner-info    > .icon { color: var(--c-info); }
.banner-success > .icon { color: var(--c-success); }
.banner-warning > .icon { color: var(--c-warning); }
.banner-danger  > .icon { color: var(--c-danger); }
.banner-inline { border-radius: 0; border-left: 0; border-right: 0; }

/* ---- toast (정적 · 화면 위쪽 가운데. .app 기준 absolute) ----
   기본 규칙(사용자 결정 2026-10-07): 안내·오류 문구는 화면 위쪽에, 글자는 본문 크기로 — 아래 버튼에 가려지지 않고 먼저 읽힌다. */
.toast {
  position: absolute; top: var(--sp-6); left: 50%; translate: -50% 0; z-index: var(--z-toast);
  display: flex; align-items: flex-start; gap: var(--sp-3);
  min-width: 32ch; max-width: 48ch; padding: var(--sp-4) var(--sp-5);
  background: var(--c-surface); color: var(--c-text);
  border: 1px solid var(--c-border); border-radius: var(--r-card); box-shadow: var(--shadow-lg);
  font-size: var(--fs-md); line-height: var(--lh-normal);
}
.toast > .icon { margin-top: calc((var(--fs-md) * var(--lh-normal) - var(--icon-md)) / 2); color: var(--c-text-2); }
.toast-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--sp-1) / 2); }
.toast-title { font-weight: var(--fw-semibold); }
.toast-desc { font-size: var(--fs-sm); color: var(--c-text-2); }
.toast-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-1); }
.toast-success > .icon { color: var(--c-success); }
.toast-warning > .icon { color: var(--c-warning); }
.toast-danger  > .icon { color: var(--c-danger); }
.toast-info    > .icon { color: var(--c-info); }
/* 안내 문구 모양(사용자가 보드 '안내 문구 모음'에서 고른다 → screens.json toggles.toast → <html data-toast-*>)
   위치 top(기본)|bottom · 아이콘 on(기본)|off · 색 light(기본, 흰 바탕)|dark(어두운 바탕)|color(상태 색 바탕) · 글자 normal(기본)|large */
[data-toast-at="bottom"] .toast, [data-toast-at="bottom"] .toast-stack { top: auto; bottom: var(--sp-6); }
[data-toast-icon="off"] .toast > .icon { display: none; }
[data-toast-tone="dark"] .toast { background: var(--c-text); color: var(--c-surface); border-color: transparent; }
[data-toast-tone="dark"] .toast .toast-desc { color: inherit; opacity: .78; }
[data-toast-tone="dark"] .toast > .icon { color: inherit; }
[data-toast-tone="color"] .toast-success { background: var(--c-success-soft); color: var(--c-success-soft-fg); border-color: transparent; }
[data-toast-tone="color"] .toast-warning { background: var(--c-warning-soft); color: var(--c-warning-soft-fg); border-color: transparent; }
[data-toast-tone="color"] .toast-danger  { background: var(--c-danger-soft);  color: var(--c-danger-soft-fg);  border-color: transparent; }
[data-toast-tone="color"] .toast-info    { background: var(--c-info-soft);    color: var(--c-info-soft-fg);    border-color: transparent; }
[data-toast-tone="color"] .toast .toast-desc { color: inherit; opacity: .85; }
[data-toast-size="large"] .toast { font-size: var(--fs-lg); }
[data-toast-size="large"] .toast .toast-desc { font-size: var(--fs-md); }
[data-toast-size="large"] .toast > .icon { margin-top: calc((var(--fs-lg) * var(--lh-normal) - var(--icon-md)) / 2); }
/* 여러 개 쌓을 때: .toast-stack 안에 .toast를 static으로 */
.toast-stack { position: absolute; top: var(--sp-6); left: 50%; translate: -50% 0; z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--sp-2); }
.toast-stack .toast { position: static; translate: none; }

/* ---- tooltip (정적 말풍선) ---- */
.tooltip {
  display: inline-block; width: max-content; max-width: 32ch;
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--r-sm); box-shadow: var(--shadow-md);
  background: var(--c-text); color: var(--c-bg);
  font-size: var(--fs-xs); line-height: var(--lh-normal); font-weight: var(--fw-medium);
}
.tooltip-anchor { position: relative; display: inline-flex; }
.tooltip-anchor > .tooltip {
  position: absolute; left: 50%; bottom: calc(100% + var(--sp-2)); transform: translateX(-50%);
  z-index: var(--z-dropdown); white-space: nowrap;
}
.tooltip-anchor.tooltip-bottom > .tooltip { bottom: auto; top: calc(100% + var(--sp-2)); }

/* ---- kbd ---- */
.kbd {
  display: inline-block; min-width: calc(var(--fs-xs) * 1.8); padding: 0 var(--sp-1);
  font-family: var(--font-mono); font-size: var(--fs-xs); line-height: calc(var(--fs-xs) * 1.6); text-align: center;
  color: var(--c-text-2); background: var(--c-surface-2);
  border: 1px solid var(--c-border-strong); border-bottom-width: calc(var(--sp-1) / 2); border-radius: var(--r-sm);
  vertical-align: middle;
}
.kbd + .kbd { margin-left: var(--sp-1); }

/* 세로로 쌓는 묶음 안의 배지는 글자만큼만 (폭을 다 차지하지 않게) */
.stack > .badge, .empty > .badge, .card-body > .badge { align-self: flex-start; }


/* web/40-data.css */
/* 40-data.css — 데이터 컴포넌트 (list · table · timeline · steps · calendar · day-strip).
   토큰 변수만 참조한다. 색·간격·반경·그림자 하드코딩 금지 (1px 테두리 · 0 · % 허용). */

/* ---- list ---- */
.list { display: flex; flex-direction: column; min-width: 0; }
.list-item {
  display: flex; align-items: center; gap: var(--sp-3);
  min-height: var(--ctl-lg); padding: var(--pad-row) var(--sp-4);
  border-radius: var(--r-control); color: inherit; text-align: left; width: 100%;
}
a.list-item, button.list-item { cursor: pointer; }
a.list-item:hover, button.list-item:hover { background: var(--c-surface-2); }
.list-item.active { background: var(--c-primary-soft); }
.list-item.active .list-title { color: var(--c-primary-soft-fg); }
.list-item.is-muted .list-title, .list-item.is-muted .list-sub, .list-item.is-muted .list-meta { color: var(--c-text-muted); }
.list-item.is-muted .list-icon { background: var(--c-surface-2); color: var(--c-text-muted); }
.list-icon {
  width: var(--ctl-md); height: var(--ctl-md); flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-control); background: var(--c-surface-2); color: var(--c-text-2);
}
.list-icon.is-primary { background: var(--c-primary-soft); color: var(--c-primary-soft-fg); }
.list-icon.is-success { background: var(--c-success-soft); color: var(--c-success-soft-fg); }
.list-icon.is-warning { background: var(--c-warning-soft); color: var(--c-warning-soft-fg); }
.list-icon.is-danger  { background: var(--c-danger-soft);  color: var(--c-danger-soft-fg); }
.list-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.list-title { font-weight: var(--fw-medium); color: var(--c-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-title .badge { margin-left: var(--sp-1); }
.list-sub { font-size: var(--fs-sm); color: var(--c-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-meta {
  flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-sm); color: var(--c-text-muted); text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.list-actions { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-1); }
.list-divided .list-item { border-radius: 0; border-bottom: 1px solid var(--c-border); }
.list-divided .list-item:last-child { border-bottom: 0; }
.list-compact .list-item { min-height: var(--ctl-md); padding: var(--sp-2) var(--sp-3); }
.list-compact .list-icon { width: var(--ctl-sm); height: var(--ctl-sm); }
/* 목록 사이 그룹 제목 */
.list-group-title {
  padding: var(--sp-4) var(--sp-4) var(--sp-1);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-text-muted);
  text-transform: uppercase; letter-spacing: .04em;
}

/* ---- table ---- */
.table-wrap {
  overflow: auto; min-width: 0;
  background: var(--c-surface); border: var(--border-card); border-radius: var(--r-card);
}
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.table th, .table td { padding: var(--pad-row) var(--sp-4); text-align: left; vertical-align: middle; border-bottom: 1px solid var(--c-border); }
.table thead th {
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-text-2);
  background: var(--c-surface-2); white-space: nowrap;
}
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--c-surface-2); }
.table tr.is-selected td { background: var(--c-primary-soft); }
.table tr.is-muted td { color: var(--c-text-muted); }
.table th.num, .table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.table th.center, .table td.center { text-align: center; }
.table .col-check { width: var(--ctl-sm); padding-right: 0; }
.table .col-actions { width: 1%; white-space: nowrap; text-align: right; }
.table td .row { align-items: center; }
.table-compact th, .table-compact td { padding: var(--sp-2) var(--sp-3); }
.table-striped tbody tr:nth-child(even) td { background: var(--c-surface-2); }
.table th .icon-sm { vertical-align: middle; margin-left: var(--sp-1); color: var(--c-text-muted); }
.table-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--c-border); font-size: var(--fs-sm); color: var(--c-text-2); }

/* ---- timeline (세로) ---- */
.timeline { display: flex; flex-direction: column; min-width: 0; }
.timeline-date {
  padding: var(--sp-2) 0; margin-top: var(--sp-3);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--c-text-2);
}
.timeline-date:first-child { margin-top: 0; }
.timeline-item {
  display: grid; grid-template-columns: minmax(6ch, auto) var(--icon-md) 1fr; column-gap: var(--sp-3);
  padding-bottom: var(--sp-5); position: relative;
}
.timeline-compact .timeline-item { grid-template-columns: var(--icon-md) 1fr; }
/* 시간 칸(.timeline-time)을 빼고 쓰면 자동으로 두 칸(점 · 내용) — 내용이 좁은 점 칸에 들어가 글자가 세로로 깨지지 않게 */
.timeline-item:not(:has(> .timeline-time)) { grid-template-columns: var(--icon-md) 1fr; }
.timeline-time { font-size: var(--fs-sm); color: var(--c-text-muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: var(--lh-normal); }
.timeline-dot { position: relative; width: var(--icon-md); height: calc(var(--fs-md) * var(--lh-normal)); display: flex; align-items: center; justify-content: center; }
.timeline-dot::before {
  content: ""; width: var(--sp-3); height: var(--sp-3); border-radius: 50%;
  background: var(--c-primary); border: calc(var(--sp-1) / 2) solid var(--c-surface); box-sizing: content-box;
  position: relative; z-index: 1;
}
.timeline-item:not(:last-child) .timeline-dot::after {
  content: ""; position: absolute; left: 50%; top: 50%; bottom: calc(var(--sp-5) * -1);
  width: 1px; background: var(--c-border-strong); transform: translateX(-50%);
}
.timeline-dot.dot-success::before { background: var(--c-success); }
.timeline-dot.dot-warning::before { background: var(--c-warning); }
.timeline-dot.dot-danger::before  { background: var(--c-danger); }
.timeline-dot.dot-neutral::before { background: var(--c-border-strong); }
.timeline-dot.dot-info::before    { background: var(--c-info); }
.timeline-content { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.timeline-title { font-weight: var(--fw-medium); color: var(--c-text); display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.timeline-desc { font-size: var(--fs-sm); color: var(--c-text-2); }
.timeline-content .card { margin-top: var(--sp-1); }

/* ---- steps (번호 원 + 라벨, 가로) ---- */
.steps { display: flex; align-items: flex-start; counter-reset: step; min-width: 0; }
.step {
  flex: 1 1 0; position: relative; counter-increment: step;
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  text-align: center; font-size: var(--fs-sm); color: var(--c-text-muted);
}
.step-num {
  position: relative; z-index: 1;
  width: var(--ctl-sm); height: var(--ctl-sm); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--c-surface); border: 1px solid var(--c-border-strong);
  font-weight: var(--fw-semibold); color: var(--c-text-2); font-variant-numeric: tabular-nums;
}
.step-num:empty::before { content: counter(step); }
.step:not(:first-child)::before {
  content: ""; position: absolute; top: calc(var(--ctl-sm) / 2); right: 50%; left: -50%;
  height: 1px; background: var(--c-border-strong);
}
.step-label { font-weight: var(--fw-medium); }
.step-desc { font-size: var(--fs-xs); }
.step.done { color: var(--c-text-2); }
.step.done .step-num { background: var(--c-primary); border-color: var(--c-primary); color: var(--c-primary-fg); }
.step.done::before { background: var(--c-primary); }
.step.current { color: var(--c-text); }
.step.current .step-num { border-color: var(--c-primary); color: var(--c-primary); box-shadow: 0 0 0 var(--sp-1) var(--c-primary-soft); }
.step.current::before { background: var(--c-primary); }
.step.current .step-label { color: var(--c-primary); }
/* 세로 스텝 (사이드 진행 표시) */
.steps-vertical { flex-direction: column; align-items: stretch; gap: 0; }
.steps-vertical .step { flex-direction: row; align-items: flex-start; text-align: left; gap: var(--sp-3); padding-bottom: var(--sp-5); }
.steps-vertical .step:not(:first-child)::before { display: none; }
.steps-vertical .step:not(:last-child)::after {
  content: ""; position: absolute; left: calc(var(--ctl-sm) / 2); top: var(--ctl-sm); bottom: 0;
  width: 1px; background: var(--c-border-strong); transform: translateX(-50%);
}
.steps-vertical .step.done::after { background: var(--c-primary); }
.steps-vertical .step-body { display: flex; flex-direction: column; gap: calc(var(--sp-1) / 2); padding-top: calc((var(--ctl-sm) - var(--fs-sm) * var(--lh-normal)) / 2); }

/* ---- calendar (월 그리드 7열) ---- */
.calendar {
  display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0;
  padding: var(--sp-4);
  background: var(--c-surface); border: var(--border-card); border-radius: var(--r-card);
}
.calendar-header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.calendar-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.calendar-nav { display: flex; align-items: center; gap: var(--sp-1); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: calc(var(--sp-1) / 2); }
.calendar-weekday {
  padding: var(--sp-1) 0; text-align: center;
  font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--c-text-muted);
}
.calendar-day {
  position: relative; aspect-ratio: 1; min-height: var(--ctl-md);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-control); font-size: var(--fs-sm); color: var(--c-text); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.calendar-day:hover { background: var(--c-surface-2); }
.calendar-day.is-other-month { color: var(--c-text-muted); }
.calendar-day.today { font-weight: var(--fw-bold); color: var(--c-primary); box-shadow: inset 0 0 0 1px var(--c-primary); }
.calendar-day.selected { background: var(--c-primary); color: var(--c-primary-fg); box-shadow: none; }
.calendar-day.has-event::after {
  content: ""; position: absolute; left: 50%; bottom: var(--sp-1); transform: translateX(-50%);
  width: calc(var(--sp-1) * 1.5); height: calc(var(--sp-1) * 1.5); border-radius: 50%; background: var(--c-primary);
}
.calendar-day.selected.has-event::after { background: var(--c-primary-fg); }
.calendar-day.is-disabled { color: var(--c-text-muted); cursor: default; }
.calendar-day.is-disabled:hover { background: none; }
/* 큰 월 보기: 칸 안에 일정 칩을 쌓는다 */
.calendar-month .calendar-grid { gap: 0; border-top: 1px solid var(--c-border); border-left: 1px solid var(--c-border); }
.calendar-month .calendar-weekday { border-right: 1px solid var(--c-border); border-bottom: 1px solid var(--c-border); }
.calendar-month .calendar-day {
  aspect-ratio: auto; min-height: calc(var(--ctl-lg) * 2); padding: var(--sp-1);
  flex-direction: column; align-items: stretch; justify-content: flex-start; gap: calc(var(--sp-1) / 2);
  border-radius: 0; border-right: 1px solid var(--c-border); border-bottom: 1px solid var(--c-border);
}
.calendar-month .calendar-day.selected { background: var(--c-primary-soft); color: var(--c-text); }
.calendar-month .calendar-day.today { box-shadow: none; }
.calendar-month .calendar-day.today .calendar-daynum { background: var(--c-primary); color: var(--c-primary-fg); }
.calendar-month .calendar-day.has-event::after { display: none; }
.calendar-daynum {
  align-self: flex-start; width: var(--icon-lg); height: var(--icon-lg); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: var(--fs-xs); font-weight: var(--fw-medium);
}
.calendar-event {
  display: block; padding: 0 var(--sp-1); border-radius: var(--r-sm);
  font-size: var(--fs-xs); line-height: var(--lh-loose);
  background: var(--c-primary-soft); color: var(--c-primary-soft-fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
}
.calendar-event.is-success { background: var(--c-success-soft); color: var(--c-success-soft-fg); }
.calendar-event.is-warning { background: var(--c-warning-soft); color: var(--c-warning-soft-fg); }
.calendar-event.is-neutral { background: var(--c-surface-3); color: var(--c-text-2); }
.calendar-more { font-size: var(--fs-xs); color: var(--c-text-muted); padding: 0 var(--sp-1); }

/* ---- day-strip (가로 날짜 칩 · 요일/날짜 2줄) ---- */
.day-strip { display: flex; gap: var(--sp-2); overflow-x: auto; min-width: 0; padding-bottom: var(--sp-1); }
.day {
  flex: 0 0 auto; min-width: var(--ctl-lg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--sp-1) / 2);
  padding: var(--sp-2) var(--sp-3);
  background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-control);
  color: var(--c-text-2); line-height: var(--lh-tight); cursor: pointer;
}
.day:hover { border-color: var(--c-border-strong); }
.day-name { font-size: var(--fs-xs); color: var(--c-text-muted); }
.day-num { font-size: var(--fs-lg); font-weight: var(--fw-semibold); color: var(--c-text); font-variant-numeric: tabular-nums; }
.day-dot { width: calc(var(--sp-1) * 1.5); height: calc(var(--sp-1) * 1.5); border-radius: 50%; background: var(--c-primary); }
.day.today .day-num { color: var(--c-primary); }
.day.active { background: var(--c-primary); border-color: var(--c-primary); }
.day.active .day-name, .day.active .day-num { color: var(--c-primary-fg); }
.day.active .day-dot { background: var(--c-primary-fg); }
.day.is-muted { opacity: .6; }
.day-strip-wide .day { flex: 1 1 0; }

/* ---- week-grid (주간 시간표: 요일 7열 × 시간 줄, 칸마다 일정 조각) ----
   표(.table)로 7열을 만들면 칸이 좁아 글자가 세로로 깨진다 — 시간표는 이 조각으로. */
.week-grid {
  display: grid; grid-template-columns: calc(var(--sp-12, 48px) + var(--sp-2)) repeat(7, minmax(0, 1fr));
  gap: 1px; background: var(--c-border); border: 1px solid var(--c-border); border-radius: var(--r-md); overflow: hidden; min-width: 0;
}
.wg-corner, .wg-day, .wg-time, .wg-cell { background: var(--c-surface); min-width: 0; }
.wg-day { padding: var(--sp-2); text-align: center; font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--c-text-2); white-space: nowrap; }
.wg-day b { display: block; font-size: var(--fs-md); color: var(--c-text); }
.wg-day.today { background: var(--c-primary-soft); color: var(--c-primary-soft-fg); }
.wg-day.today b { color: var(--c-primary-soft-fg); }
.wg-time { padding: var(--sp-2); font-size: var(--fs-xs); color: var(--c-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wg-cell { padding: var(--sp-1, 4px); display: flex; flex-direction: column; gap: var(--sp-1, 4px); min-height: calc(var(--fs-sm) * 4); }
.wg-slot {
  display: flex; flex-direction: column; gap: 2px; width: 100%; min-width: 0; padding: var(--sp-1, 4px) var(--sp-2);
  border: 1px solid var(--c-border); border-left-width: 3px; border-radius: var(--r-sm); background: var(--c-surface-2);
  font: inherit; font-size: var(--fs-xs); line-height: 1.3; text-align: left; color: var(--c-text); cursor: pointer;
}
.wg-slot-title { font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wg-slot-meta { color: var(--c-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wg-slot.is-open { border-left-color: var(--c-success); }
.wg-slot.is-almost { border-left-color: var(--c-warning); background: var(--c-warning-soft); }
.wg-slot.is-full { border-left-color: var(--c-danger); background: var(--c-danger-soft); }
.wg-slot.is-mine { border-color: var(--c-primary); border-left-color: var(--c-primary); background: var(--c-primary-soft); }
.wg-slot.is-muted { opacity: .5; }
/* 오늘 요일 열: 머리칸(.wg-day.today)과 그 열의 칸(.wg-cell.today)을 함께 */
.wg-cell.today { background: var(--c-primary-soft); }
.wg-day.today { box-shadow: inset 0 -3px 0 var(--c-primary); }


/* web/50-overlay.css */
/* 50-overlay.css — 오버레이 (modal · drawer · dropdown · popover).
   "열린 상태를 정적으로 그리는" 용도. 인터랙션 없음.
   프레임(.app)을 하네스가 transform scale 하므로 position: fixed 금지 → 전부 .app 기준 absolute.
   토큰 변수만 참조한다. */

/* .app이 배치 기준이어야 한다 (30-display와 중복돼도 무해). */
.app { position: relative; }

/* ---- backdrop (프레임 전체 덮개 · .app의 마지막 자식으로 둔다) ---- */
.modal-backdrop {
  position: absolute; inset: 0; z-index: var(--z-modal);
  display: flex; align-items: center; justify-content: center;
  padding: var(--sp-8);
  background: var(--c-overlay);
}
.modal-backdrop.align-top { align-items: flex-start; padding-top: var(--sp-16); }

/* ---- modal ---- */
.modal {
  width: 100%; max-width: calc(var(--content-max) / 2); max-height: 100%;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--c-surface); color: var(--c-text);
  border: var(--border-card); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
}
.modal-sm { max-width: calc(var(--content-max) * .4); }
.modal-lg { max-width: calc(var(--content-max) * .8); }
.modal-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-6) var(--sp-3);
}
.modal-title { font-size: var(--fs-xl); font-weight: var(--fw-semibold); line-height: var(--lh-tight); min-width: 0; }
.modal-desc { font-size: var(--fs-sm); color: var(--c-text-2); margin-top: var(--sp-1); }
.modal-body {
  flex: 1 1 auto; min-height: 0; overflow: auto;
  display: flex; flex-direction: column; gap: var(--sp-4);
  padding: var(--sp-2) var(--sp-6) var(--sp-5);
}
.modal-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-6);
  border-top: 1px solid var(--c-border);
}
.modal-footer .spacer, .modal-footer .text-muted { margin-right: auto; }
/* 확인 대화상자: 가운데 아이콘 원 + 가운데 정렬 */
.modal-icon {
  width: var(--ctl-lg); height: var(--ctl-lg); margin: var(--sp-6) auto 0;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  background: var(--c-primary-soft); color: var(--c-primary-soft-fg);
}
.modal-icon.is-danger  { background: var(--c-danger-soft);  color: var(--c-danger); }
.modal-icon.is-warning { background: var(--c-warning-soft); color: var(--c-warning); }
.modal-icon.is-success { background: var(--c-success-soft); color: var(--c-success); }
.modal-icon.is-info    { background: var(--c-info-soft);    color: var(--c-info); }
.modal-center .modal-header, .modal-center .modal-body { text-align: center; justify-content: center; align-items: center; }
.modal-center .modal-footer { justify-content: center; }

/* ---- drawer (우측 패널 · backdrop 안에 둔다) ---- */
.modal-backdrop:has(> .drawer) { align-items: stretch; justify-content: flex-end; padding: 0; }
.drawer {
  width: calc(var(--sidebar-w) * 1.75); max-width: 100%; height: 100%;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--c-surface); color: var(--c-text);
  border-left: 1px solid var(--c-border); box-shadow: var(--shadow-lg);
}
.drawer-lg { width: calc(var(--sidebar-w) * 2.5); }
.drawer-header {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-6);
  border-bottom: 1px solid var(--c-border);
}
.drawer-title { font-size: var(--fs-lg); font-weight: var(--fw-semibold); line-height: var(--lh-tight); min-width: 0; }
.drawer-body {
  flex: 1 1 auto; min-height: 0; overflow: auto;
  display: flex; flex-direction: column; gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-6);
}
.drawer-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-6);
  border-top: 1px solid var(--c-border);
}

/* ---- dropdown (열린 메뉴) ---- */
.dropdown {
  min-width: calc(var(--ctl-lg) * 4); width: max-content; max-width: 40ch;
  display: flex; flex-direction: column; padding: var(--sp-1);
  background: var(--c-surface); color: var(--c-text);
  border: 1px solid var(--c-border); border-radius: var(--r-md); box-shadow: var(--shadow-md);
  z-index: var(--z-dropdown);
}
.dropdown-item {
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: var(--ctl-sm); padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--c-text);
  white-space: nowrap; text-align: left; width: 100%; cursor: pointer;
}
.dropdown-item:hover { background: var(--c-surface-2); }
.dropdown-item.active { background: var(--c-primary-soft); color: var(--c-primary-soft-fg); }
.dropdown-item.is-danger { color: var(--c-danger); }
.dropdown-item.is-disabled { color: var(--c-text-muted); cursor: default; }
.dropdown-item.is-disabled:hover { background: none; }
.dropdown-item > .icon-sm, .dropdown-item > .icon { color: var(--c-text-2); }
.dropdown-item.is-danger > .icon-sm, .dropdown-item.is-danger > .icon { color: var(--c-danger); }
.dropdown-item.active > .icon-sm { color: var(--c-primary-soft-fg); }
.dropdown-item .kbd, .dropdown-shortcut { margin-left: auto; padding-left: var(--sp-3); font-size: var(--fs-xs); color: var(--c-text-muted); }
.dropdown-item .check { margin-left: auto; color: var(--c-primary); }
.dropdown-divider { height: 1px; margin: var(--sp-1) 0; background: var(--c-border); }
.dropdown-label { padding: var(--sp-2) var(--sp-3) var(--sp-1); font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--c-text-muted); }
/* 트리거 옆에 붙여 열린 것처럼 보이기: 트리거를 .dropdown-anchor로 감싼다 */
.dropdown-anchor, .popover-anchor { position: relative; display: inline-flex; }
.dropdown-anchor > .dropdown, .popover-anchor > .popover { position: absolute; top: calc(100% + var(--sp-1)); left: 0; }
.dropdown-anchor.align-end > .dropdown, .popover-anchor.align-end > .popover { left: auto; right: 0; }
.dropdown-anchor.align-top > .dropdown, .popover-anchor.align-top > .popover { top: auto; bottom: calc(100% + var(--sp-1)); }

/* ---- popover (작은 카드) ---- */
.popover {
  width: max-content; max-width: 40ch; min-width: calc(var(--ctl-lg) * 4);
  display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4);
  background: var(--c-surface); color: var(--c-text);
  border: 1px solid var(--c-border); border-radius: var(--r-md); box-shadow: var(--shadow-md);
  font-size: var(--fs-sm); z-index: var(--z-dropdown);
}
.popover-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.popover-desc { color: var(--c-text-2); }
.popover-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-1); }
.popover .list-item { padding-left: 0; padding-right: 0; min-height: var(--ctl-md); }


/* mobile/00-mobile-tokens.css */
/* mobile/00-mobile-tokens — 모바일(390×844) 토큰. web 컴포넌트 뒤에 읽혀 같은 이름의 토큰을 덮어쓴다(scripts/platform.js).
   여기서만 px 값을 정한다. 아래 mobile 컴포넌트는 이 변수만 참조한다(색·간격·반경 하드코딩 금지 · 1px 테두리 · 0 · % 허용).
   기준: 디자이너가 만든 모바일 예약 앱 — 연회색 바탕 위 흰 카드(테두리·그림자 없음), 가장자리 20px,
   작은 회색 머리줄 + 크고 굵은 제목, 본문 15 · 보조 13 · 탭 글자 11. */

:root {
  /* ---- 프레임 ---- */
  --frame-w: 390px;
  --frame-h: 844px;

  /* ---- 글자 크기 (390 폭에 맞춘 단계) ---- */
  --fs-xs: 11px;   /* 탭 글자 · 작은 배지 */
  --fs-sm: 13px;   /* 보조 글자 · 머리줄(eyebrow) */
  --fs-md: 15px;   /* 본문 */
  --fs-lg: 17px;   /* 묶음 제목 */
  --fs-xl: 20px;
  --fs-2xl: 24px;  /* 화면 제목 */
  --fs-3xl: 28px;  /* 큰 숫자 */

  /* ---- 컨트롤 (손가락으로 누르는 크기) ---- */
  --ctl-sm: 36px;
  --ctl-md: 44px;
  --ctl-lg: 52px;  /* 아래 꽉 찬 버튼 */

  /* ---- 반경 ---- */
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;    /* 아래에서 올라오는 창 위쪽 모서리 */

  /* ---- 여백 리듬 — 카드 사이 12, 카드 안 20, 가장자리 20 ---- */
  --gutter: var(--sp-5);
  --space-section: var(--sp-3);   /* 카드(묶음) 사이 */
  --space-header: var(--sp-6);    /* 화면 제목 아래 */
  --space-block: var(--sp-3);     /* 묶음 안 덩어리 사이 */
  --pad-card: var(--sp-5);        /* 카드 안쪽 */
  --pad-row: var(--sp-3);         /* 목록 한 줄 위아래 */

  /* ---- 모바일 골격 ---- */
  --appbar-h: 52px;    /* 위 제목 줄(뒤로 · 가운데 제목) */
  --tabbar-h: 64px;    /* 아래 탭(아이콘 + 글자) */
  --sheet-max-h: 86%;  /* 아래에서 올라오는 창 최대 높이 */
  --handle-w: 36px;    /* 창 손잡이 막대 */
  --handle-h: 4px;

}

/* 글자 크게(data-type="large") — 모바일 단계에서 한 칸씩 키운다 (toggles.css보다 뒤에 읽혀 덮어쓴다) */
[data-type="large"] {
  --fs-xs: 12px;
  --fs-sm: 15px;
  --fs-md: 17px;
  --fs-lg: 19px;
  --fs-xl: 22px;
  --fs-2xl: 27px;
  --fs-3xl: 32px;

  --ctl-sm: 40px;
  --ctl-md: 48px;
  --ctl-lg: 56px;
  --icon-sm: 18px;
  --icon-md: 22px;
  --icon-lg: 26px;

  --appbar-h: 56px;
  --tabbar-h: 70px;
}

/* 모바일 화면 안에서는 카드에 테두리·그림자를 두지 않는다 — 회색 바탕과 흰 카드의 차이만으로 나눈다.
   (분위기의 --border-card · --shadow-card는 html에 걸리므로 .app-mobile에서 다시 정하면 그 안에서만 바뀐다) */
.app-mobile {
  --border-card: 1px solid transparent;
  --shadow-card: none;
  /* 바탕 · 카드 색 (분위기 색에서 계산 — 밝은 분위기든 어두운 분위기든 카드가 바탕보다 한 단계 떠 보이게).
     .app-mobile에서 계산해야 분위기를 바꿔 끼운 곳(data-theme)의 색을 따른다 */
  --m-page-bg: color-mix(in srgb, var(--c-bg) 95%, var(--c-text));
  --m-card-bg: var(--c-surface);
}


/* mobile/10-mobile-layout.css */
/* mobile/10-mobile-layout — 모바일 골격: 프레임 · 위 제목 줄(appbar) · 아래 탭(tabbar) · 위 탭 메뉴(toptabs) ·
   본문(content) · 화면 제목 · 머리줄(eyebrow) · 큰 숫자(big-num) · 아래 꽉 찬 버튼(bottom-cta).
   셸 마크업은 scripts/expand.js가 붙인다(작성자는 <main class="content">만 쓴다). 토큰 변수만 참조한다. */

/* ---- 프레임 (390×844, 세로 한 줄: [appbar] · content · [tabbar]) ---- */
.app.app-mobile {
  display: flex;
  flex-direction: column;
  width: var(--frame-w);
  height: var(--frame-h);
  background: var(--m-page-bg);
}
.app.app-mobile > .appbar,
.app.app-mobile > .toptabs,
.app.app-mobile > .tabbar { flex: 0 0 auto; }

/* ---- 위 제목 줄: 뒤로(왼쪽) · 가운데 제목 · 오른쪽 자리 ---- */
.appbar {
  display: grid;
  grid-template-columns: var(--ctl-md) minmax(0, 1fr) var(--ctl-md);
  align-items: center;
  gap: var(--sp-2);
  height: var(--appbar-h);
  padding: 0 var(--sp-2);
  background: var(--m-page-bg);
  color: var(--c-text);
  position: relative;
  z-index: var(--z-sticky);
}
.appbar > .btn-icon { justify-self: start; }
.appbar-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-body);
}
.appbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-1); min-width: 0; }
/* 변형 — 왼쪽 정렬(위 탭 메뉴 화면의 서비스 이름 줄) */
.appbar.appbar-start {
  grid-template-columns: minmax(0, 1fr) auto;
  padding: 0 var(--sp-2) 0 var(--gutter);
}
.appbar.appbar-start .appbar-title {
  text-align: left;
  font-family: var(--font-head);
  font-size: var(--fs-lg);
  font-weight: var(--fw-head);
  letter-spacing: var(--ls-head);
}

/* ---- 본문 (유일한 스크롤 영역 · 회색 바탕에 흰 카드를 12px 간격으로 쌓는다) ---- */
.app-mobile .content {
  flex: 1 1 auto;
  min-height: 0;
  gap: var(--space-section);
  padding: var(--sp-6) var(--gutter) var(--sp-8);
  background: var(--m-page-bg);
}
.app-mobile .appbar + .content { padding-top: var(--sp-3); }
/* 영역을 나누려고 감싼 클래스 없는 div도 카드 사이 간격을 그대로 갖게 */
.app-mobile .content > div:not([class]) { display: flex; flex-direction: column; gap: var(--space-section); min-width: 0; }
.app-mobile .content-inner { max-width: none; }

/* ---- 화면 제목: 탭 화면은 크게 왼쪽 위, 아래 화면도 같은 모양 (eyebrow → 제목 → 회색 설명) ---- */
.app-mobile .page-header {
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}
.app-mobile .page-title { font-size: var(--fs-2xl); }
.app-mobile .page-desc { margin-top: var(--sp-1); font-size: var(--fs-sm); }
.app-mobile .page-actions { margin-left: 0; flex-wrap: wrap; }
.app-mobile .page-actions > .btn { flex: 1 1 0; }

/* 머리줄: 제목 위 작은 회색 한 줄 ("다음 수업 · 10월 13일(화)") */
.eyebrow {
  display: block;
  margin-bottom: var(--sp-1);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-body);
  color: var(--c-text-2);
}
/* 크게 보여 줄 숫자 ("잔여 3회 / 10") — 강조 부분은 주 색, <small>은 본문 색 */
.big-num {
  display: block;
  font-family: var(--font-head);
  font-size: var(--fs-3xl);
  font-weight: var(--fw-bold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-head);
  color: var(--c-primary);
  font-variant-numeric: tabular-nums;
}
.big-num small { font-size: inherit; font-weight: inherit; color: var(--c-text); }
.big-num + .text-sm, .big-num + p { margin-top: var(--sp-1); }

/* ---- 아래 꽉 찬 버튼 (본문 마지막 자식 · 내용이 짧으면 맨 아래, 길면 아래에 붙어 따라온다) ---- */
.bottom-cta {
  position: sticky;
  bottom: calc(var(--sp-8) * -1);   /* 스크롤 영역의 아래 여백(sp-8)까지 덮는다 — 버튼 밑으로 내용이 비치지 않게 */
  z-index: var(--z-sticky);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin: auto calc(var(--gutter) * -1) calc(var(--sp-8) * -1);
  padding: var(--sp-4) var(--gutter) calc(var(--sp-5) + var(--sp-8));
  background: linear-gradient(to bottom, transparent, var(--m-page-bg) var(--sp-4));
}
.bottom-cta > .btn,
.bottom-cta > .row > .btn {
  width: 100%;
  height: var(--ctl-lg);
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
}
.bottom-cta > .row { gap: var(--sp-2); }
.bottom-cta > .row > .btn { flex: 1 1 0; width: auto; }
.bottom-cta > .text-sm, .bottom-cta > .text-xs { text-align: center; color: var(--c-text-2); }

/* ---- 아래 탭 (탭 화면에만 · 아이콘 + 11px 글자 · 지금 탭 = 본문 색, 나머지 = 흐린 회색) ---- */
.tabbar {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  height: var(--tabbar-h);
  padding: var(--sp-1) var(--sp-2) var(--sp-2);
  background: var(--m-card-bg);
  border-top: 1px solid var(--c-border);
  position: relative;
  z-index: var(--z-sticky);
}
.tabbar .nav-item {
  flex-direction: column;
  justify-content: center;
  gap: var(--sp-1);
  width: 100%;
  height: 100%;
  min-height: 0;
  padding: 0;
  border-radius: 0;
