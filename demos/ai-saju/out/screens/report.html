<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>2027 신년운세</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
/* 큰 한 단어 */
.word { font-size: var(--fs-title); font-weight: var(--fw-title); line-height: var(--lh-title); letter-spacing: -0.03em; color: var(--c-brand-text); }
.block .chips { padding: 0; }
</style>
</head>
<body class="has-cta">
<header class="appbar"><a class="appbar-btn" href="home.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">2027 신년운세</h1><span></span></header>
<main class="page">
  <section class="block">
  <div class="photo is-16x9"><img src="../assets/photos/report-cover.jpg" alt="새해 일출"></div>
    <p class="eyebrow">2027년 소윤님의 한 단어</p>
    <p class="word">뿌리내림</p>
    <div>
      <div class="row"><span class="row-date">1월</span><div class="row-main"><p class="row-title">천천히 자리를 잡아가요</p></div></div>
      <div class="row"><span class="row-date">2월</span><div class="row-main"><p class="row-title">작은 성과가 쌓이기 시작해요</p></div></div>
    </div>
    <p class="block-note">1~2월 미리보기는 무료예요</p>
  </section>
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">받는 것</h2></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/calendar.svg" alt=""></span><div class="row-main"><p class="row-title">월별 흐름 12장</p></div></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/clipboard.svg" alt=""></span><div class="row-main"><p class="row-title">일 · 돈 · 관계</p></div></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/ticket.svg" alt=""></span><div class="row-main"><p class="row-title">이직·시험에 좋은 달 표시</p></div></div>
  </section>
  <section class="block">
    <div class="block-head"><h2 class="h2">누구 것을 살까요</h2></div>
    <div class="chips" role="radiogroup">
      <button class="chip is-selected" role="radio" aria-checked="true">나 · 한소윤</button>
      <button class="chip" role="radio" aria-checked="false">이도현</button>
      <button class="chip" role="radio" aria-checked="false">김미경</button>
    </div>
    <div class="row"><div class="row-main"><p class="row-title">별 99개</p><p class="row-sub">9,900원 · 지금 12개 가지고 있어요</p></div><span class="row-trail">87개가 모자라요</span></div>
  </section>
  <p class="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg><span>열람 후에는 환불할 수 없어요</span></p>
</main>
<div class="cta"><a class="btn primary full" href="stars.html">별 충전하고 구매하기</a></div>
